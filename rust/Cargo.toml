[package]
name = "uecm"
version = "0.1.0"
edition = "2021"
description = "UE Context Management service (Rust implementation), per ../spec/SPECIFICATION.md"
license = "MIT OR Apache-2.0"

[lib]
name = "uecm"
path = "src/lib.rs"

# Match the C++ build's optimisation level (-O2) for a fair comparison (spec §3).
# Cargo's default release opt-level is 3; pinned to 2 here for parity.
[profile.release]
opt-level = 2

[dependencies]
# Optional matched allocator, enabled with `--features jemalloc` (spec §3, RQ3).
tikv-jemallocator = { version = "0.7.0", optional = true }
# Reads jemalloc's own stats.* counters so peak RSS can be split into live
# allocation, arena metadata, and retained space (RQ3). The C++ arm reads the
# same six counters through mallctl, so the two are differenceable. Cargo does
# not allow optional dev-dependencies, so this sits beside the allocator it
# interrogates and appears only when that feature is on; the default build stays
# dependency-free.
tikv-jemalloc-ctl = { version = "0.7.0", optional = true, features = ["stats"] }

[dev-dependencies]
# Used only by the benchmark example, so the core library stays dependency-free.
hdrhistogram = "7.5.4"
libc = "0.2.186"

[features]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
# Heap-profiling build of the same allocator, used by bench/alloc_profile.sh to
# attribute the peak-RSS difference to allocation sites (RQ3). Opt-in and never
# used for reported timings: profiling adds a sampled backtrace to allocation, so
# a build with it enabled is not the build the campaign measures. It exists so the
# C++ and Rust arms can be profiled with one tool -- jemalloc's own prof -- rather
# than with two tools whose numbers would not be comparable.
jemalloc-prof = ["jemalloc", "tikv-jemallocator/profiling"]
# PROBE ONLY, never a reported arm: swaps the standard bounded channel for a
# mutex-and-two-condition-variables queue matching the C++ design, to test whether
# the overload divergence is the channel rather than the language. See
# src/mutex_queue.rs and spec/SPECIFICATION.md §12.
mutex-queue = []
# PROBE ONLY, never a reported arm: per-request completion is sync_channel(1)
# (array flavour, one slot) instead of unbounded channel() (list flavour, 31-slot
# block). Tests whether the overload floor is the oneshot allocation. Completions
# stay 1:1 and blocking. See spec/SPECIFICATION.md §12 and docs/OVERLOAD_MECHANISM.md.
sync-oneshot = []

# The benchmark lives as an example so it can use the dev-dependency (hdrhistogram)
# while keeping the library itself free of runtime dependencies.
[[example]]
name = "bench"

# Method 3 pilot, signal or mixed. Separate from `bench` so the
# reported closed-call instrument stays untouched.
[[example]]
name = "pipeline"
