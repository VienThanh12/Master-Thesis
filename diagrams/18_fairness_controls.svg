<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 536" width="880" height="536" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8794a3"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="536" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#12233a">Fairness as a controlled-variable strategy</text>
  <text x="440" y="54" text-anchor="middle" font-size="13" fill="#5b6b7b">One frozen specification, two implementations, exactly one variable allowed to differ</text>

  <!-- frozen specification -->
  <rect x="18" y="78" width="228" height="246" rx="11" fill="#eef3fa" stroke="#2f6db3" stroke-width="2"/>
  <rect x="18" y="78" width="228" height="36" rx="11" fill="#2f6db3"/>
  <rect x="18" y="102" width="228" height="12" fill="#2f6db3"/>
  <text x="132" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">FROZEN SPECIFICATION</text>
  <text x="132" y="132" text-anchor="middle" font-size="11.5" font-style="italic" fill="#1c4e86">written and frozen before any code</text>
  <g font-size="12" fill="#33475b">
    <text x="34" y="158">&#8226;&#160; public API</text>
    <text x="34" y="180">&#8226;&#160; UE-context state machine</text>
    <text x="34" y="202">&#8226;&#160; data structures and their</text>
    <text x="47" y="217">algorithmic strategy</text>
    <text x="34" y="239">&#8226;&#160; sharding granularity and</text>
    <text x="47" y="254">the concurrency model</text>
    <text x="34" y="276">&#8226;&#160; the parity contract</text>
  </g>
  <text x="132" y="299" text-anchor="middle" font-size="11" fill="#8794a3">the primary control against</text>
  <text x="132" y="313" text-anchor="middle" font-size="11" fill="#8794a3">implementation bias</text>

  <!-- also held fixed -->
  <rect x="262" y="78" width="286" height="246" rx="11" fill="#fbfcfd" stroke="#c3ccd5" stroke-width="1.6"/>
  <text x="405" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12233a">Also held fixed across both</text>
  <g font-size="11" fill="#5b6b7b">
    <rect x="276" y="112" width="258" height="38" rx="6" fill="#eef3fa" stroke="#bcd0e8"/>
    <text x="288" y="130" font-size="11.5" font-weight="600" fill="#1c4e86">Allocator</text>
    <text x="288" y="144">same jemalloc, system build as control</text>

    <rect x="276" y="154" width="258" height="38" rx="6" fill="#eef3fa" stroke="#bcd0e8"/>
    <text x="288" y="172" font-size="11.5" font-weight="600" fill="#1c4e86">Optimisation</text>
    <text x="288" y="186">-O2 against opt-level = 2</text>

    <rect x="276" y="196" width="258" height="38" rx="6" fill="#eef3fa" stroke="#bcd0e8"/>
    <text x="288" y="214" font-size="11.5" font-weight="600" fill="#1c4e86">Hashing</text>
    <text x="288" y="228">SplitMix64 and FNV-1a, pinned</text>

    <rect x="276" y="238" width="258" height="38" rx="6" fill="#eef3fa" stroke="#bcd0e8"/>
    <text x="288" y="256" font-size="11.5" font-weight="600" fill="#1c4e86">Workload</text>
    <text x="288" y="270">one driver, same op sequence per seed</text>

    <rect x="276" y="280" width="258" height="38" rx="6" fill="#eef3fa" stroke="#bcd0e8"/>
    <text x="288" y="298" font-size="11.5" font-weight="600" fill="#1c4e86">Instrumentation</text>
    <text x="288" y="312">same HDR config, repeats, interleaving</text>
  </g>

  <!-- the two implementations -->
  <rect x="596" y="96" width="266" height="58" rx="9" fill="#dce8f7" stroke="#2f6db3" stroke-width="2"/>
  <text x="729" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1c4e86">C++23 implementation</text>
  <text x="729" y="140" text-anchor="middle" font-size="11.5" fill="#5b6b7b">STL, RAII, std::thread</text>

  <rect x="596" y="166" width="266" height="52" rx="9" fill="#12233a"/>
  <text x="729" y="188" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">VARIED: implementation language</text>
  <text x="729" y="206" text-anchor="middle" font-size="11" fill="#c3ccd5">the study&#8217;s single independent variable</text>

  <rect x="596" y="232" width="266" height="58" rx="9" fill="#fbe3e0" stroke="#a5281b" stroke-width="2"/>
  <text x="729" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#8c2a20">Rust implementation</text>
  <text x="729" y="276" text-anchor="middle" font-size="11.5" fill="#5b6b7b">stable toolchain, zero unsafe</text>

  <line x1="246" y1="200" x2="256" y2="200" stroke="#8794a3" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="548" y1="192" x2="590" y2="192" stroke="#8794a3" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- verification -->
  <rect x="18" y="340" width="530" height="62" rx="9" fill="#f4fbf6" stroke="#2e8b57" stroke-width="1.8"/>
  <text x="34" y="362" font-size="13" font-weight="700" fill="#1f6b41">Equivalence is checked, not assumed</text>
  <text x="34" y="381" font-size="11.5" fill="#33475b">A language-neutral conformance suite runs the same vectors on both sides.</text>
  <text x="34" y="396" font-size="11.5" fill="#33475b">The canonical transcripts are then diffed op for op.</text>

  <!-- escape valves -->
  <rect x="18" y="414" width="420" height="82" rx="9" fill="#fdf6e9" stroke="#c8860d" stroke-width="1.8"/>
  <text x="34" y="436" font-size="13" font-weight="700" fill="#8a5a06">Logged, not removed</text>
  <text x="34" y="456" font-size="11.5" fill="#33475b">Where the two languages cannot express the same construct,</text>
  <text x="34" y="471" font-size="11.5" fill="#33475b">the divergence goes into the forced-idiom log and is weighed</text>
  <text x="34" y="486" font-size="11.5" fill="#33475b">explicitly in the discussion rather than smoothed over.</text>

  <rect x="452" y="414" width="410" height="82" rx="9" fill="#fdf1f0" stroke="#a5281b" stroke-width="1.8"/>
  <text x="468" y="436" font-size="13" font-weight="700" fill="#8c2a20">Acknowledged, not removed</text>
  <text x="468" y="456" font-size="11.5" fill="#33475b">One person wrote both implementations and is not equally</text>
  <text x="468" y="471" font-size="11.5" fill="#33475b">expert in both. The parity suite bounds this for behaviour</text>
  <text x="468" y="486" font-size="11.5" fill="#33475b">but not for performance, so it is a threat to validity.</text>

  <text x="440" y="520" text-anchor="middle" font-size="11.5" fill="#8794a3">Every measured difference is attributable to the language only to the extent that this diagram holds.</text>
</svg>
