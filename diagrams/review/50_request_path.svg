<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs><marker id="a0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6db3"/></marker></defs>
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">One request, from the producer to the reply</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">Most of this path is passing work between threads. That is why the end-to-end clock cannot bound a language effect.</text>
  <rect x="16" y="88" width="160" height="188" rx="10" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.7"/>
  <text x="28" y="110.325" font-size="11.5" fill="#1c4e86" font-weight="700">Producer</text>
  <text x="28" y="130.325" font-size="11.5" fill="#5b6b7b">Load generator.</text>
  <text x="28" y="146.325" font-size="11.5" fill="#5b6b7b">Hashes ue_id.</text>
  <text x="28" y="162.325" font-size="11.5" fill="#5b6b7b">Waits on a one-shot</text>
  <text x="28" y="178.325" font-size="11.5" fill="#5b6b7b">reply handle.</text>
  <rect x="188" y="88" width="160" height="188" rx="10" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.7"/>
  <text x="200" y="110.325" font-size="11.5" fill="#1c4e86" font-weight="700">MPSC queue</text>
  <text x="200" y="130.325" font-size="11.5" fill="#5b6b7b">Bounded. FIFO.</text>
  <text x="200" y="146.325" font-size="11.5" fill="#5b6b7b">Blocks when full.</text>
  <text x="200" y="162.325" font-size="11.5" fill="#5b6b7b">One queue per shard.</text>
  <rect x="360" y="88" width="160" height="188" rx="10" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.7"/>
  <text x="372" y="110.325" font-size="11.5" fill="#1c4e86" font-weight="700">Worker</text>
  <text x="372" y="130.325" font-size="11.5" fill="#5b6b7b">The only thread</text>
  <text x="372" y="146.325" font-size="11.5" fill="#5b6b7b">that may touch this</text>
  <text x="372" y="162.325" font-size="11.5" fill="#5b6b7b">shard. No lock on</text>
  <text x="372" y="178.325" font-size="11.5" fill="#5b6b7b">context state.</text>
  <rect x="532" y="88" width="160" height="188" rx="10" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.7"/>
  <text x="544" y="110.325" font-size="11.5" fill="#1c4e86" font-weight="700">Shard map</text>
  <text x="544" y="130.325" font-size="11.5" fill="#5b6b7b">Language's own</text>
  <text x="544" y="146.325" font-size="11.5" fill="#5b6b7b">hash map. This is</text>
  <text x="544" y="162.325" font-size="11.5" fill="#5b6b7b">the core the second</text>
  <text x="544" y="178.325" font-size="11.5" fill="#5b6b7b">clock times.</text>
  <rect x="704" y="88" width="160" height="188" rx="10" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.7"/>
  <text x="716" y="110.325" font-size="11.5" fill="#1c4e86" font-weight="700">Reply</text>
  <text x="716" y="130.325" font-size="11.5" fill="#5b6b7b">Result goes back</text>
  <text x="716" y="146.325" font-size="11.5" fill="#5b6b7b">on the one-shot</text>
  <text x="716" y="162.325" font-size="11.5" fill="#5b6b7b">handle. Producer</text>
  <text x="716" y="178.325" font-size="11.5" fill="#5b6b7b">unblocks.</text>
  <line x1="180" y1="182" x2="200" y2="182" stroke="#2f6db3" stroke-width="2.0" marker-end="url(#a0)"/>
  <line x1="352" y1="182" x2="372" y2="182" stroke="#2f6db3" stroke-width="2.0" marker-end="url(#a0)"/>
  <line x1="524" y1="182" x2="544" y2="182" stroke="#2f6db3" stroke-width="2.0" marker-end="url(#a0)"/>
  <line x1="696" y1="182" x2="716" y2="182" stroke="#2f6db3" stroke-width="2.0" marker-end="url(#a0)"/>
  <rect x="16" y="300" width="332" height="140" rx="9" fill="#f4fbf6" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="32" y="324" font-size="13" fill="#1f6b41" font-weight="700">Timed apart: the core</text>
  <text x="32" y="348" font-size="12" fill="#33475b">Shard map only. No queue.</text>
  <text x="32" y="366" font-size="12" fill="#33475b">Rust is 1.6x faster.</text>
  <text x="32" y="384" font-size="12" fill="#33475b">0.250% of the round-trip.</text>
  <text x="32" y="402" font-size="12" fill="#33475b">Likely hash-map layout.</text>
  <rect x="364" y="300" width="500" height="140" rx="9" fill="#fdf6e9" stroke="#c8860d" stroke-width="1.6"/>
  <text x="380" y="324" font-size="13" fill="#a5700c" font-weight="700">Timed together: the round-trip</text>
  <text x="380" y="348" font-size="12" fill="#33475b">Producer to queue to worker to map to reply.</text>
  <text x="380" y="366" font-size="12" fill="#33475b">Paired median gap 1.3 us. Real, too small to attribute.</text>
  <text x="380" y="384" font-size="12" fill="#33475b">The rest is operating-system handoff.</text>
  <text x="380" y="402" font-size="12" fill="#33475b">That clock answers a vendor sizing a node, not a language comparison.</text>
  <text x="440.0" y="496" font-size="11.5" fill="#8794a3" text-anchor="middle">The only shared mutable state either version allows is one atomic counter. No control flow depends on its value.</text>
</svg>
