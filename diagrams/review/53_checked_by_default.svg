<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs><marker id="a0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6db3"/></marker></defs>
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">One case reached past the fault programs</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">A spec gap let a call be sent outside the service running window. Every test missed it, because nothing ever called that path.</text>
  <rect x="16" y="80" width="200" height="220" rx="10" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.6"/>
  <text x="30" y="104.325" font-size="11.5" fill="#12233a" font-weight="700">1.  Spec gap</text>
  <text x="30" y="124.325" font-size="12" fill="#5b6b7b">A call was legal in the</text>
  <text x="30" y="140.325" font-size="12" fill="#5b6b7b">written spec at a time</text>
  <text x="30" y="156.325" font-size="12" fill="#5b6b7b">the service was not</text>
  <text x="30" y="172.325" font-size="12" fill="#5b6b7b">running.</text>
  <text x="30" y="188.325" font-size="12" fill="#5b6b7b"></text>
  <text x="30" y="204.325" font-size="12" fill="#5b6b7b">Both versions inherited</text>
  <text x="30" y="220.325" font-size="12" fill="#5b6b7b">the hole. The method</text>
  <text x="30" y="236.325" font-size="12" fill="#5b6b7b">left each to fail in its</text>
  <text x="30" y="252.325" font-size="12" fill="#5b6b7b">own idiom.</text>
  <rect x="232" y="80" width="200" height="220" rx="10" fill="#fdf6e9" stroke="#c8860d" stroke-width="1.6"/>
  <text x="246" y="104.325" font-size="11.5" fill="#a5700c" font-weight="700">2.  What missed it</text>
  <text x="246" y="124.325" font-size="12" fill="#5b6b7b">Parity vectors.</text>
  <text x="246" y="140.325" font-size="12" fill="#5b6b7b">Generated campaign.</text>
  <text x="246" y="156.325" font-size="12" fill="#5b6b7b">ASan, TSan, UBSan.</text>
  <text x="246" y="172.325" font-size="12" fill="#5b6b7b">Miri.</text>
  <text x="246" y="188.325" font-size="12" fill="#5b6b7b"></text>
  <text x="246" y="204.325" font-size="12" fill="#5b6b7b">Nothing called that</text>
  <text x="246" y="220.325" font-size="12" fill="#5b6b7b">path, so nothing had</text>
  <text x="246" y="236.325" font-size="12" fill="#5b6b7b">a failure to report.</text>
  <rect x="448" y="80" width="200" height="220" rx="10" fill="#f4fbf6" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="462" y="104.325" font-size="11.5" fill="#1f6b41" font-weight="700">3.  What caught it</text>
  <text x="462" y="124.325" font-size="12" fill="#5b6b7b">A plain bounds check</text>
  <text x="462" y="140.325" font-size="12" fill="#5b6b7b">on the Rust side.</text>
  <text x="462" y="156.325" font-size="12" fill="#5b6b7b">Undefined behaviour</text>
  <text x="462" y="172.325" font-size="12" fill="#5b6b7b">became a catchable</text>
  <text x="462" y="188.325" font-size="12" fill="#5b6b7b">failure.</text>
  <text x="462" y="204.325" font-size="12" fill="#5b6b7b"></text>
  <text x="462" y="220.325" font-size="12" fill="#5b6b7b">Not a proof.</text>
  <text x="462" y="236.325" font-size="12" fill="#5b6b7b">Checked by default.</text>
  <rect x="664" y="80" width="200" height="220" rx="10" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.6"/>
  <text x="678" y="104.325" font-size="11.5" fill="#1c4e86" font-weight="700">4.  What to plan for</text>
  <text x="678" y="124.325" font-size="12" fill="#5b6b7b">Do not budget as if</text>
  <text x="678" y="140.325" font-size="12" fill="#5b6b7b">compile time had ruled</text>
  <text x="678" y="156.325" font-size="12" fill="#5b6b7b">the hole out.</text>
  <text x="678" y="172.325" font-size="12" fill="#5b6b7b"></text>
  <text x="678" y="188.325" font-size="12" fill="#5b6b7b">A ban stated without a</text>
  <text x="678" y="204.325" font-size="12" fill="#5b6b7b">way behind it leaves</text>
  <text x="678" y="220.325" font-size="12" fill="#5b6b7b">each version to fail in</text>
  <text x="678" y="236.325" font-size="12" fill="#5b6b7b">its own idiom.</text>
  <line x1="220" y1="190" x2="228" y2="190" stroke="#2f6db3" stroke-width="2.0" marker-end="url(#a0)"/>
  <line x1="436" y1="190" x2="444" y2="190" stroke="#2f6db3" stroke-width="2.0" marker-end="url(#a0)"/>
  <line x1="652" y1="190" x2="660" y2="190" stroke="#2f6db3" stroke-width="2.0" marker-end="url(#a0)"/>
  <rect x="16" y="324" width="848" height="128" rx="9" fill="#fdf1f0" stroke="#a5281b" stroke-width="1.6"/>
  <text x="32" y="348" font-size="13" fill="#8c2a20" font-weight="700">The root cause belongs to the method</text>
  <text x="32" y="372" font-size="12.5" fill="#33475b">Parity bounds the paths the suite drives. A clean sanitiser result is bounded by the code that actually ran.</text>
  <text x="32" y="390" font-size="12.5" fill="#33475b">RQ2's injected catalogue is still final for the fourteen programs. This case is why the thesis also talks about checked-by-default,</text>
  <text x="32" y="408" font-size="12.5" fill="#33475b">not only ruled-out-at-compile-time.</text>
  <text x="440.0" y="496" font-size="11.5" fill="#8794a3" text-anchor="middle">Chapter 6, after the guarantee-boundary figure. It is part of the answer to RQ2, not a footnote.</text>
</svg>
