<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">What the measurement host does, and what it refuses</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">One socket, AMD EPYC 7443. The program runs on the machine itself, not inside a virtual machine.</text>
  <rect x="16" y="76" width="420" height="320" rx="11" fill="#f4fbf6" stroke="#2e8b57" stroke-width="2.0"/>
  <rect x="16" y="76" width="420" height="34" rx="11" fill="#2e8b57"/>
  <rect x="16" y="99" width="420" height="11" fill="#2e8b57"/>
  <text x="226.0" y="98.0" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700">DONE</text>
  <rect x="36" y="126" width="380" height="28" rx="6" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="226.0" y="144.32" font-size="12" fill="#1f6b41" text-anchor="middle">SMT off. One thread per core.</text>
  <rect x="36" y="160" width="380" height="28" rx="6" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="226.0" y="178.32" font-size="12" fill="#1f6b41" text-anchor="middle">Governor performance. Boost off.</text>
  <rect x="36" y="194" width="380" height="28" rx="6" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="226.0" y="212.32" font-size="12" fill="#1f6b41" text-anchor="middle">nohz_full on the pinned cores.</text>
  <rect x="36" y="228" width="380" height="28" rx="6" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="226.0" y="246.32" font-size="12" fill="#1f6b41" text-anchor="middle">16 pinned cores, 2 to 17.</text>
  <rect x="36" y="262" width="380" height="28" rx="6" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="226.0" y="280.32" font-size="12" fill="#1f6b41" text-anchor="middle">Clock held fixed.</text>
  <rect x="36" y="296" width="380" height="28" rx="6" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="226.0" y="314.32" font-size="12" fill="#1f6b41" text-anchor="middle">Rocky image pins gcc-toolset major.</text>
  <rect x="36" y="330" width="380" height="28" rx="6" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="226.0" y="348.32" font-size="12" fill="#1f6b41" text-anchor="middle">g++ 15.2.1, rustc 1.97.1.</text>
  <rect x="452" y="76" width="412" height="320" rx="11" fill="#fdf1f0" stroke="#a5281b" stroke-width="2.0"/>
  <rect x="452" y="76" width="412" height="34" rx="11" fill="#a5281b"/>
  <rect x="452" y="99" width="412" height="11" fill="#a5281b"/>
  <text x="658.0" y="98.0" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700">REFUSED</text>
  <rect x="470" y="126" width="376" height="100" rx="8" fill="#ffffff" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="482" y="148.325" font-size="11.5" fill="#8c2a20" font-weight="700">isolcpus</text>
  <text x="482" y="166.325" font-size="12" fill="#5b6b7b">It also stops the kernel sharing work</text>
  <text x="482" y="182.325" font-size="12" fill="#5b6b7b">across the allowed cores. Each test</text>
  <text x="482" y="198.325" font-size="12" fill="#5b6b7b">thread then lands on one core. An</text>
  <text x="482" y="214.325" font-size="12" fill="#5b6b7b">earlier campaign ran that way. Void.</text>
  <rect x="470" y="240" width="376" height="130" rx="8" fill="#ffffff" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="482" y="262.325" font-size="11.5" fill="#8c2a20" font-weight="700">A derived representative load</text>
  <text x="482" y="280.325" font-size="12" fill="#5b6b7b">The old rule took the busiest load</text>
  <text x="482" y="296.325" font-size="12" fill="#5b6b7b">holding p99 under 5 ms. On the guest</text>
  <text x="482" y="312.325" font-size="12" fill="#5b6b7b">that was the host noise floor. On a</text>
  <text x="482" y="328.325" font-size="12" fill="#5b6b7b">quiet host it climbs to the knee.</text>
  <text x="482" y="344.325" font-size="12" fill="#5b6b7b">ReprLoad is pinned at 56 kops/s.</text>
  <rect x="16" y="416" width="848" height="84" rx="9" fill="#fdf6e9" stroke="#c8860d" stroke-width="1.6"/>
  <text x="32" y="440" font-size="13" fill="#a5700c" font-weight="700">The image still uses the kernel of the host it sits on</text>
  <text x="32" y="460" font-size="12" fill="#33475b">So the guest sweep and the reported sweep differ in hardware, kernel,</text>
  <text x="32" y="476" font-size="12" fill="#33475b">and one GCC 15 point release. Do not write that they share a toolchain.</text>
  <text x="440.0" y="536" font-size="11.5" fill="#8794a3" text-anchor="middle">bench/TESTBED.md is scripted and published. Executing the protocol and rerunning the same scripts is the only step between hosts.</text>
</svg>
