<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="280" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">The four answers, at a glance</text>
  <rect x="16" y="80" width="200" height="160" rx="12" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.8"/>
  <text x="116" y="110" font-size="14" fill="#1c4e86" text-anchor="middle" font-weight="700">RQ1</text>
  <text x="116" y="160" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">1.3 us</text>
  <text x="116" y="198" font-size="12" fill="#5b6b7b" text-anchor="middle">median gap, too small</text>
  <rect x="232" y="80" width="200" height="160" rx="12" fill="#f4fbf6" stroke="#2e8b57" stroke-width="1.8"/>
  <text x="332" y="110" font-size="14" fill="#1f6b41" text-anchor="middle" font-weight="700">RQ2</text>
  <text x="332" y="160" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">7 / 7</text>
  <text x="332" y="198" font-size="12" fill="#5b6b7b" text-anchor="middle">compile error / still open</text>
  <rect x="448" y="80" width="200" height="160" rx="12" fill="#fdf6e9" stroke="#c8860d" stroke-width="1.8"/>
  <text x="548" y="110" font-size="14" fill="#a5700c" text-anchor="middle" font-weight="700">RQ3</text>
  <text x="548" y="160" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">1.4–2.5 MiB</text>
  <text x="548" y="198" font-size="12" fill="#5b6b7b" text-anchor="middle">Rust RSS, all hosts</text>
  <rect x="664" y="80" width="200" height="160" rx="12" fill="#fff3ec" stroke="#d35400" stroke-width="1.8"/>
  <text x="764" y="110" font-size="14" fill="#a04000" text-anchor="middle" font-weight="700">RQ4</text>
  <text x="764" y="160" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">10.91%</text>
  <text x="764" y="198" font-size="12" fill="#5b6b7b" text-anchor="middle">bound on a real call</text>
</svg>
