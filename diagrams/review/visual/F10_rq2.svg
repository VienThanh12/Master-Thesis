<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="360" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">Where the guarantee stops</text>
  <rect x="16" y="72" width="416" height="250" rx="11" fill="#f4fbf6" stroke="#2e8b57" stroke-width="2.0"/>
  <rect x="16" y="72" width="416" height="32" rx="11" fill="#2e8b57"/>
  <rect x="16" y="93" width="416" height="11" fill="#2e8b57"/>
  <text x="224.0" y="93.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Safe Rust rejects</text>
  <rect x="36" y="118" width="376" height="24" rx="6" fill="#d9f0dd" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="224.0" y="134.32" font-size="12" fill="#1f6b41" text-anchor="middle">Use-after-free</text>
  <rect x="36" y="146" width="376" height="24" rx="6" fill="#d9f0dd" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="224.0" y="162.32" font-size="12" fill="#1f6b41" text-anchor="middle">Double-free</text>
  <rect x="36" y="174" width="376" height="24" rx="6" fill="#d9f0dd" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="224.0" y="190.32" font-size="12" fill="#1f6b41" text-anchor="middle">Iterator invalidation</text>
  <rect x="36" y="202" width="376" height="24" rx="6" fill="#d9f0dd" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="224.0" y="218.32" font-size="12" fill="#1f6b41" text-anchor="middle">Data race</text>
  <rect x="36" y="230" width="376" height="24" rx="6" fill="#d9f0dd" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="224.0" y="246.32" font-size="12" fill="#1f6b41" text-anchor="middle">Unguarded mutation</text>
  <rect x="36" y="258" width="376" height="24" rx="6" fill="#d9f0dd" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="224.0" y="274.32" font-size="12" fill="#1f6b41" text-anchor="middle">Use-after-move</text>
  <rect x="36" y="286" width="376" height="24" rx="6" fill="#d9f0dd" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="224.0" y="302.32" font-size="12" fill="#1f6b41" text-anchor="middle">Unsafe handle shared</text>
  <rect x="448" y="72" width="416" height="250" rx="11" fill="#fdf1f0" stroke="#a5281b" stroke-width="2.0"/>
  <rect x="448" y="72" width="416" height="32" rx="11" fill="#a5281b"/>
  <rect x="448" y="93" width="416" height="11" fill="#a5281b"/>
  <text x="656.0" y="93.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Both still miss</text>
  <rect x="468" y="118" width="376" height="24" rx="6" fill="#fbdedb" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="656.0" y="134.32" font-size="12" fill="#8c2a20" text-anchor="middle">Lock-order deadlock</text>
  <rect x="468" y="146" width="376" height="24" rx="6" fill="#fbdedb" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="656.0" y="162.32" font-size="12" fill="#8c2a20" text-anchor="middle">Lost update</text>
  <rect x="468" y="174" width="376" height="24" rx="6" fill="#fbdedb" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="656.0" y="190.32" font-size="12" fill="#8c2a20" text-anchor="middle">Ref-cycle leak</text>
  <rect x="468" y="202" width="376" height="24" rx="6" fill="#fbdedb" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="656.0" y="218.32" font-size="12" fill="#8c2a20" text-anchor="middle">Integer overflow</text>
  <rect x="468" y="230" width="376" height="24" rx="6" fill="#fbdedb" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="656.0" y="246.32" font-size="12" fill="#8c2a20" text-anchor="middle">Worker blast radius</text>
  <rect x="468" y="258" width="376" height="24" rx="6" fill="#fbdedb" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="656.0" y="274.32" font-size="12" fill="#8c2a20" text-anchor="middle">Forgotten guard</text>
  <rect x="468" y="286" width="376" height="24" rx="6" fill="#fbdedb" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="656.0" y="302.32" font-size="12" fill="#8c2a20" text-anchor="middle">Seam double-free (unsafe)</text>
  <text x="440" y="344" font-size="13" fill="#33475b" text-anchor="middle">Seven and seven. Seam is a rewrite, not a new class.</text>
</svg>
