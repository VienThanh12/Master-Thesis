<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="280" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">Four variants, interleaved</text>
  <text x="250" y="88" font-size="13" fill="#8794a3" text-anchor="middle" font-weight="700">jemalloc</text>
  <text x="630" y="88" font-size="13" fill="#8794a3" text-anchor="middle" font-weight="700">system (control)</text>
  <text x="40" y="140" font-size="16" fill="#1c4e86" text-anchor="middle" font-weight="700">C++</text>
  <text x="40" y="210" font-size="16" fill="#1f6b41" text-anchor="middle" font-weight="700">Rust</text>
  <rect x="90" y="118" width="320" height="48" rx="10" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.0"/>
  <text x="250.0" y="147.76" font-size="16" fill="#1c4e86" text-anchor="middle" font-weight="700">C++  +  jemalloc</text>
  <rect x="470" y="118" width="320" height="48" rx="10" fill="#dce8f7" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="630.0" y="147.76" font-size="16" fill="#1c4e86" text-anchor="middle" font-weight="700">C++  +  system</text>
  <rect x="90" y="188" width="320" height="48" rx="10" fill="#f4fbf6" stroke="#2e8b57" stroke-width="1.0"/>
  <text x="250.0" y="217.76" font-size="16" fill="#1f6b41" text-anchor="middle" font-weight="700">Rust  +  jemalloc</text>
  <rect x="470" y="188" width="320" height="48" rx="10" fill="#d9f0dd" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="630.0" y="217.76" font-size="16" fill="#1f6b41" text-anchor="middle" font-weight="700">Rust  +  system</text>
  <text x="440" y="256" font-size="13" fill="#33475b" text-anchor="middle">20 repeats, four variants back to back</text>
