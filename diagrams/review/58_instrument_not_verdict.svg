<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">What the thesis adds is an instrument, not a verdict</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">At loads where the service still meets its sent rate, the choice is which defects a team will make impossible to write.</text>
  <circle cx="40" cy="98" r="14" fill="#2f6db3"/>
  <text x="40" y="102.07" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
  <rect x="64" y="80" width="796" height="48" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="74" y="101.15" font-size="13" fill="#12233a" font-weight="700">Frozen spec</text>
  <text x="74" y="117.15" font-size="12" fill="#5b6b7b">The main control against writer bias. Public. Both sides follow it.</text>
  <circle cx="40" cy="154" r="14" fill="#2f6db3"/>
  <text x="40" y="158.07" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
  <rect x="64" y="136" width="796" height="48" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="74" y="157.15" font-size="13" fill="#12233a" font-weight="700">Parity-tested pair</text>
  <text x="74" y="173.15" font-size="12" fill="#5b6b7b">Same paths, same seeds, a Python oracle, sanitisers on the path taken.</text>
  <circle cx="40" cy="210" r="14" fill="#2f6db3"/>
  <text x="40" y="214.07" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
  <rect x="64" y="192" width="796" height="48" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="74" y="213.15" font-size="13" fill="#12233a" font-weight="700">Harness past the knee</text>
  <text x="74" y="229.15" font-size="12" fill="#5b6b7b">Open-loop, interleaved, Holm family fixed before the campaign.</text>
  <circle cx="40" cy="266" r="14" fill="#2f6db3"/>
  <text x="40" y="270.07" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
  <rect x="64" y="248" width="796" height="48" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="74" y="269.15" font-size="13" fill="#12233a" font-weight="700">A split of the round-trip</text>
  <text x="74" y="285.15" font-size="12" fill="#5b6b7b">Says how much of what it times the language can own.</text>
  <circle cx="40" cy="322" r="14" fill="#2f6db3"/>
  <text x="40" y="326.07" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
  <rect x="64" y="304" width="796" height="48" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="74" y="325.15" font-size="13" fill="#12233a" font-weight="700">A defect catalogue</text>
  <text x="74" y="341.15" font-size="12" fill="#5b6b7b">Maps where the guarantee stops, with a stage and a cost.</text>
  <circle cx="40" cy="378" r="14" fill="#2f6db3"/>
  <text x="40" y="382.07" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">6</text>
  <rect x="64" y="360" width="796" height="48" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="74" y="381.15" font-size="13" fill="#12233a" font-weight="700">A thin C-ABI seam</text>
  <text x="74" y="397.15" font-size="12" fill="#5b6b7b">Shows a C++ host can drive an unchanged Rust core.</text>
  <text x="440.0" y="476" font-size="11.5" fill="#8794a3" text-anchor="middle">Past the knee it is a speed choice as well. A nominal-load test would not have exposed the gap.</text>
</svg>
