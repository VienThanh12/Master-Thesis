<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs><marker id="a0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8c2a20"/></marker></defs>
  <rect x="0" y="0" width="880" height="640" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">The problem, the four questions, and the three hypotheses</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">Hypotheses were written down before any measurement. Chapter 6 says how each one came out.</text>
  <rect x="16" y="72" width="848" height="118" rx="11" fill="#fdf1f0" stroke="#a5281b" stroke-width="2.0"/>
  <rect x="16" y="72" width="848" height="32" rx="11" fill="#a5281b"/>
  <rect x="16" y="93" width="848" height="11" fill="#a5281b"/>
  <text x="440.0" y="93.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">THE OPEN PROBLEM</text>
  <text x="32" y="120" font-size="12" fill="#33475b">Vendors are under technical and regulatory pressure to adopt memory-safe languages, yet they lack a direct, controlled test of a</text>
  <text x="32" y="136" font-size="12" fill="#33475b">stateful, concurrent RAN control-plane part. Average-throughput comparisons leave three dimensions open.</text>
  <rect x="32" y="154" width="220" height="26" rx="6" fill="#ffffff" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="142.0" y="170.96" font-size="11" fill="#8c2a20" text-anchor="middle">Tail latency under overload</text>
  <line x1="254" y1="167.0" x2="264" y2="167.0" stroke="#8c2a20" stroke-width="1.6" marker-end="url(#a0)"/>
  <rect x="266" y="154" width="236" height="26" rx="6" fill="#ffffff" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="384.0" y="170.96" font-size="11" fill="#8c2a20" text-anchor="middle">Defects stopped at compile time</text>
  <line x1="504" y1="167.0" x2="514" y2="167.0" stroke="#8c2a20" stroke-width="1.6" marker-end="url(#a0)"/>
  <rect x="516" y="154" width="210" height="26" rx="6" fill="#ffffff" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="621.0" y="170.96" font-size="11" fill="#8c2a20" text-anchor="middle">Incremental adoption cost</text>
  <text x="16" y="208" font-size="11" fill="#8794a3" font-weight="700">RESEARCH QUESTIONS</text>
  <rect x="16" y="218" width="64" height="52" rx="7" fill="#dce8f7"/>
  <text x="48.0" y="248.68" font-size="13" fill="#1c4e86" text-anchor="middle" font-weight="700">RQ1</text>
  <rect x="90" y="218" width="370" height="52" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="100" y="238.6" font-size="12" fill="#12233a" font-weight="700">Latency predictability</text>
  <text x="100" y="253.6" font-size="10.5" fill="#5b6b7b">Median, p99, p99.9, p99.99 and the maximum, from</text>
  <text x="100" y="266.6" font-size="10.5" fill="#5b6b7b">light load through overload.</text>
  <rect x="16" y="278" width="64" height="52" rx="7" fill="#dce8f7"/>
  <text x="48.0" y="308.68" font-size="13" fill="#1c4e86" text-anchor="middle" font-weight="700">RQ2</text>
  <rect x="90" y="278" width="370" height="52" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="100" y="298.6" font-size="12" fill="#12233a" font-weight="700">Defect scope</text>
  <text x="100" y="313.6" font-size="10.5" fill="#5b6b7b">7 classes inside the guarantee, 7 on the</text>
  <text x="100" y="326.6" font-size="10.5" fill="#5b6b7b">boundary. When is each caught, and at what cost.</text>
  <rect x="16" y="338" width="64" height="52" rx="7" fill="#dce8f7"/>
  <text x="48.0" y="368.68" font-size="13" fill="#1c4e86" text-anchor="middle" font-weight="700">RQ3</text>
  <rect x="90" y="338" width="370" height="52" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="100" y="358.6" font-size="12" fill="#12233a" font-weight="700">Safety-model overhead</text>
  <text x="100" y="373.6" font-size="10.5" fill="#5b6b7b">Bounds checks, copies, abstraction cost:</text>
  <text x="100" y="386.6" font-size="10.5" fill="#5b6b7b">throughput, CPU, and peak RSS.</text>
  <rect x="16" y="398" width="64" height="52" rx="7" fill="#dce8f7"/>
  <text x="48.0" y="428.68" font-size="13" fill="#1c4e86" text-anchor="middle" font-weight="700">RQ4</text>
  <rect x="90" y="398" width="370" height="52" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="100" y="418.6" font-size="12" fill="#12233a" font-weight="700">Incremental adoption</text>
  <text x="100" y="433.6" font-size="10.5" fill="#5b6b7b">Effort, FFI interoperability, and risk of adding</text>
  <text x="100" y="446.6" font-size="10.5" fill="#5b6b7b">Rust a piece at a time.</text>
  <rect x="480" y="218" width="384" height="84" rx="9" fill="#fdf6e9" stroke="#c8860d" stroke-width="1.6"/>
  <text x="494" y="242.325" font-size="11.5" fill="#a5700c" font-weight="700">H1  Performance below saturation</text>
  <text x="494" y="262.325" font-size="11.5" fill="#5b6b7b">The two languages are performance-equivalent</text>
  <text x="494" y="277.325" font-size="11.5" fill="#5b6b7b">below saturation, with any difference only in</text>
  <text x="494" y="292.325" font-size="11.5" fill="#5b6b7b">the far tail.</text>
  <rect x="480" y="312" width="384" height="84" rx="9" fill="#f4fbf6" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="494" y="336.325" font-size="11.5" fill="#1f6b41" font-weight="700">H2  Compile-time prevention</text>
  <text x="494" y="356.325" font-size="11.5" fill="#5b6b7b">Safe Rust prevents at compile time the memory-</text>
  <text x="494" y="371.325" font-size="11.5" fill="#5b6b7b">safety and concurrency classes that C++ only</text>
  <text x="494" y="386.325" font-size="11.5" fill="#5b6b7b">tries to catch after the program is built.</text>
  <rect x="480" y="406" width="384" height="84" rx="9" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.6"/>
  <text x="494" y="430.325" font-size="11.5" fill="#1c4e86" font-weight="700">H3  Interop cost is not run time</text>
  <text x="494" y="450.325" font-size="11.5" fill="#5b6b7b">The extra time when C++ calls into Rust is</text>
  <text x="494" y="465.325" font-size="11.5" fill="#5b6b7b">small next to the operations themselves. The</text>
  <text x="494" y="480.325" font-size="11.5" fill="#5b6b7b">real cost is engineering work, not speed.</text>
  <rect x="16" y="512" width="848" height="80" rx="9" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.5"/>
  <text x="32" y="536" font-size="12.5" fill="#12233a" font-weight="700">How RQ2 stays falsifiable</text>
  <text x="32" y="556" font-size="11.5" fill="#33475b">The catalogue is two-sided on purpose: 7 classes safe Rust is expected to prevent, and 7 it is expected not to.</text>
  <text x="32" y="572" font-size="11.5" fill="#33475b">A previous study mapped CWE types onto a list. This one builds and runs a program for each class.</text>
  <text x="440.0" y="620" font-size="11.5" fill="#8794a3" text-anchor="middle">H1 does double duty for RQ1 and RQ3. Chapter 6 finds that wording to be the hypothesis's main weakness.</text>
</svg>
