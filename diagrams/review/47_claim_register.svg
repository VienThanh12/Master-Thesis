<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="600" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">A register of what a sentence is allowed to say</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">The defect that costs a grade is a correct statement attached to the wrong scope</text>
  <rect x="16" y="76" width="208" height="360" rx="10" fill="#f4fbf6" stroke="#2e8b57" stroke-width="1.8"/>
  <text x="28" y="98.05" font-size="11" fill="#1f6b41" font-weight="700">FINAL</text>
  <text x="28" y="120.05" font-size="11" fill="#5b6b7b">compilers and source</text>
  <text x="28" y="140.05" font-size="11" fill="#5b6b7b"></text>
  <text x="28" y="160.05" font-size="11" fill="#5b6b7b">RQ2 compile outcomes</text>
  <text x="28" y="180.05" font-size="11" fill="#5b6b7b">Seam size, unsafe sites</text>
  <text x="28" y="200.05" font-size="11" fill="#5b6b7b">Size and complexity</text>
  <text x="28" y="220.05" font-size="11" fill="#5b6b7b">Transcript parity</text>
  <rect x="232" y="76" width="208" height="360" rx="10" fill="#fdf6e9" stroke="#c8860d" stroke-width="1.8"/>
  <text x="244" y="98.05" font-size="11" fill="#a5700c" font-weight="700">HOST-SENSITIVE</text>
  <text x="244" y="120.05" font-size="11" fill="#5b6b7b">say which host</text>
  <text x="244" y="140.05" font-size="11" fill="#5b6b7b"></text>
  <text x="244" y="160.05" font-size="11" fill="#5b6b7b">Tail latency, overload</text>
  <text x="244" y="180.05" font-size="11" fill="#5b6b7b">CPU (sign hangs on load)</text>
  <text x="244" y="200.05" font-size="11" fill="#5b6b7b">Absolute build times</text>
  <text x="244" y="220.05" font-size="11" fill="#5b6b7b">Allocator / language RSS</text>
  <rect x="448" y="76" width="208" height="360" rx="10" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.8"/>
  <text x="460" y="98.05" font-size="11" fill="#1c4e86" font-weight="700">TRAVELS</text>
  <text x="460" y="120.05" font-size="11" fill="#5b6b7b">all three hosts agree</text>
  <text x="460" y="140.05" font-size="11" fill="#5b6b7b"></text>
  <text x="460" y="160.05" font-size="11" fill="#5b6b7b">Language RSS, a few MiB</text>
  <text x="460" y="180.05" font-size="11" fill="#5b6b7b">Far-tail direction on</text>
  <text x="460" y="200.05" font-size="11" fill="#5b6b7b">both bare-metal hosts</text>
  <text x="460" y="220.05" font-size="11" fill="#5b6b7b">Paired build-time ratio</text>
  <rect x="664" y="76" width="208" height="360" rx="10" fill="#fdf1f0" stroke="#a5281b" stroke-width="1.8"/>
  <text x="676" y="98.05" font-size="11" fill="#8c2a20" font-weight="700">REFUSED</text>
  <text x="676" y="120.05" font-size="11" fill="#5b6b7b">do not write</text>
  <text x="676" y="140.05" font-size="11" fill="#5b6b7b"></text>
  <text x="676" y="160.05" font-size="11" fill="#5b6b7b">equivalent from cannot tell</text>
  <text x="676" y="180.05" font-size="11" fill="#5b6b7b">isolcpus as a tuning step</text>
  <text x="676" y="200.05" font-size="11" fill="#5b6b7b">Guest and main share a</text>
  <text x="676" y="220.05" font-size="11" fill="#5b6b7b">toolchain</text>
  <text x="676" y="240.05" font-size="11" fill="#5b6b7b">Shipped size as language</text>
  <text x="676" y="260.05" font-size="11" fill="#5b6b7b">TSan rate from memory</text>
  <rect x="16" y="456" width="848" height="92" rx="9" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.5"/>
  <text x="32" y="480" font-size="13" fill="#12233a" font-weight="700">Three live traps for a generated macro</text>
  <text x="32" y="502" font-size="12" fill="#33475b">A Pct macro read as a multiple. A lo-hi range wrapped in math mode, which typesets as two minus signs. A quantity that is right where it</text>
  <text x="32" y="520" font-size="12" fill="#33475b">is derived and wrong at every site that summarises it (CpuDiffAbsMax is scoped to ReprLoad, not to the whole below-saturation regime).</text>
  <text x="440.0" y="576" font-size="11.5" fill="#8794a3" text-anchor="middle">These pages quote the same macros the prose does. If a fresh campaign moves a number, rebuild this pack with the same command.</text>
</svg>
