<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="580" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">The tested family is fixed before the campaign</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">Exact paired permutation tests over 20 interleaved repeats, Holm-corrected across 14 comparisons</text>
  <rect x="16" y="76" width="420" height="380" rx="11" fill="#f4fbf6" stroke="#2e8b57" stroke-width="2.0"/>
  <rect x="16" y="76" width="420" height="34" rx="11" fill="#2e8b57"/>
  <rect x="16" y="99" width="420" height="11" fill="#2e8b57"/>
  <text x="226.0" y="98.0" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700">IN THE FAMILY</text>
  <rect x="34" y="126" width="384" height="72" rx="7" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="46" y="148.6" font-size="12" fill="#12233a" font-weight="700">Median, p99, p99.9 at the chosen load</text>
  <text x="46" y="165.6" font-size="11" fill="#5b6b7b">Unit is the run. Pairing can cancel shared</text>
  <text x="46" y="179.6" font-size="11" fill="#5b6b7b">noise.</text>
  <rect x="34" y="206" width="384" height="72" rx="7" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="46" y="228.6" font-size="12" fill="#12233a" font-weight="700">Overload throughput and CPU per finished call</text>
  <text x="46" y="245.6" font-size="11" fill="#5b6b7b">The largest language effect in the family.</text>
  <rect x="34" y="286" width="384" height="72" rx="7" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="46" y="308.6" font-size="12" fill="#12233a" font-weight="700">Peak RSS language and allocator contrasts</text>
  <text x="46" y="325.6" font-size="11" fill="#5b6b7b">A run-level max, so a handful of stalls do not</text>
  <text x="46" y="339.6" font-size="11" fill="#5b6b7b">move it.</text>
  <rect x="34" y="366" width="384" height="72" rx="7" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="46" y="388.6" font-size="12" fill="#12233a" font-weight="700">Allocator held fixed inside each comparison</text>
  <text x="46" y="405.6" font-size="11" fill="#5b6b7b">A result that reverses across heaps is</text>
  <text x="46" y="419.6" font-size="11" fill="#5b6b7b">unresolved.</text>
  <rect x="452" y="76" width="412" height="380" rx="11" fill="#fdf1f0" stroke="#a5281b" stroke-width="2.0"/>
  <rect x="452" y="76" width="412" height="34" rx="11" fill="#a5281b"/>
  <rect x="452" y="99" width="412" height="11" fill="#a5281b"/>
  <text x="658.0" y="98.0" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700">KEPT OUT, WITH A REASON</text>
  <rect x="470" y="126" width="376" height="72" rx="7" fill="#ffffff" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="482" y="148.6" font-size="12" fill="#12233a" font-weight="700">Jitter from one call to the next</text>
  <text x="482" y="165.6" font-size="11" fill="#5b6b7b">No research question asks for it.</text>
  <rect x="470" y="206" width="376" height="72" rx="7" fill="#ffffff" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="482" y="228.6" font-size="12" fill="#12233a" font-weight="700">Pooled p99.99 far tail</text>
  <text x="482" y="245.6" font-size="11" fill="#5b6b7b">Unit is the operation, not the run. No</text>
  <text x="482" y="259.6" font-size="11" fill="#5b6b7b">across-repeat interval to test. No fallback</text>
  <text x="482" y="273.6" font-size="11" fill="#5b6b7b">to per-run p9999.</text>
  <rect x="470" y="286" width="376" height="72" rx="7" fill="#ffffff" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="482" y="308.6" font-size="12" fill="#12233a" font-weight="700">The 448 kops/s tracking gap</text>
  <text x="482" y="325.6" font-size="11" fill="#5b6b7b">Operating point found after the data. Shown,</text>
  <text x="482" y="339.6" font-size="11" fill="#5b6b7b">not tested.</text>
  <rect x="470" y="366" width="376" height="72" rx="7" fill="#ffffff" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="482" y="388.6" font-size="12" fill="#12233a" font-weight="700">Achieved throughput below saturation</text>
  <text x="482" y="405.6" font-size="11" fill="#5b6b7b">Pinned to offered load by construction, so</text>
  <text x="482" y="419.6" font-size="11" fill="#5b6b7b">it cannot express a language effect.</text>
  <rect x="16" y="472" width="848" height="64" rx="8" fill="#fdf6e9" stroke="#c8860d" stroke-width="1.6"/>
  <text x="32" y="496" font-size="12.5" fill="#a5700c" font-weight="700">Floors, quoted so a null can be told from a math limit</text>
  <text x="32" y="518" font-size="11.5" fill="#33475b">Uncorrected floor p = 0.0000019. Holm-corrected floor 0.000027. When interval and p-value disagree, pairing decides.</text>
  <text x="440.0" y="560" font-size="11.5" fill="#8794a3" text-anchor="middle">Applying the reading rule to the block that suits the argument, and dropping it for the other, is the failure pre-commitment exists to prevent.</text>
</svg>
