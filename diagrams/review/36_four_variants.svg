<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">Four variants, interleaved so host noise is shared</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">14 offered-load levels up to 784 kops/s, 20 repeats, 1120 measured runs</text>
  <text x="230" y="92" font-size="13" fill="#8794a3" text-anchor="middle" font-weight="700">jemalloc</text>
  <text x="650" y="92" font-size="13" fill="#8794a3" text-anchor="middle" font-weight="700">system allocator (control)</text>
  <text x="28" y="168" font-size="16" fill="#1c4e86" text-anchor="middle" font-weight="700">C++</text>
  <text x="28" y="288" font-size="16" fill="#1f6b41" text-anchor="middle" font-weight="700">Rust</text>
  <rect x="80" y="112" width="300" height="108" rx="10" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.8"/>
  <text x="94" y="136.325" font-size="11.5" fill="#1c4e86" font-weight="700">C++ + jemalloc</text>
  <text x="94" y="158.325" font-size="12" fill="#5b6b7b">Production-like heap.</text>
  <text x="94" y="174.325" font-size="12" fill="#5b6b7b">Compared with Rust + jemalloc</text>
  <text x="94" y="190.325" font-size="12" fill="#5b6b7b">to isolate the language.</text>
  <rect x="500" y="112" width="300" height="108" rx="10" fill="#eef3fa" stroke="#bcd0e8" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="514" y="136.325" font-size="11.5" fill="#1c4e86" font-weight="700">C++ + system</text>
  <text x="514" y="158.325" font-size="12" fill="#5b6b7b">Control heap.</text>
  <text x="514" y="174.325" font-size="12" fill="#5b6b7b">Compared with C++ + jemalloc</text>
  <text x="514" y="190.325" font-size="12" fill="#5b6b7b">to isolate the allocator.</text>
  <rect x="80" y="248" width="300" height="108" rx="10" fill="#f4fbf6" stroke="#2e8b57" stroke-width="1.8"/>
  <text x="94" y="272.325" font-size="11.5" fill="#1f6b41" font-weight="700">Rust + jemalloc</text>
  <text x="94" y="294.325" font-size="12" fill="#5b6b7b">Production-like heap.</text>
  <text x="94" y="310.325" font-size="12" fill="#5b6b7b">The pair that answers RQ1 and</text>
  <text x="94" y="326.325" font-size="12" fill="#5b6b7b">RQ3 under a matched allocator.</text>
  <rect x="500" y="248" width="300" height="108" rx="10" fill="#f4fbf6" stroke="#a8d7bb" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="514" y="272.325" font-size="11.5" fill="#1f6b41" font-weight="700">Rust + system</text>
  <text x="514" y="294.325" font-size="12" fill="#5b6b7b">Control heap.</text>
  <text x="514" y="310.325" font-size="12" fill="#5b6b7b">A language effect that reverses</text>
  <text x="514" y="326.325" font-size="12" fill="#5b6b7b">here is reported as unresolved.</text>
  <rect x="80" y="380" width="720" height="80" rx="9" fill="#fdf6e9" stroke="#c8860d" stroke-width="1.6"/>
  <text x="96" y="404" font-size="13" fill="#a5700c" font-weight="700">Inside each repeat the four variants run back to back</text>
  <text x="96" y="426" font-size="11.5" fill="#33475b">Interference common to a block is then shared rather than assigned to one variant. A load picked after seeing the sweep cannot enter</text>
  <text x="96" y="442" font-size="11.5" fill="#33475b">the tested family. That is why the 448 kops/s tracking gap is shown and not tested.</text>
  <text x="440.0" y="496" font-size="11.5" fill="#8794a3" text-anchor="middle">The representative resource load is a chosen value (56 kops/s), not one derived from the sweep.</text>
</svg>
