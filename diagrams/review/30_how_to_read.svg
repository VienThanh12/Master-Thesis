<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="620" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">How to read Thesis_v3, in one page</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">Chapter 1 is the draft introduction. Chapters 2 to 7 keep five argument paragraphs each.</text>
  <rect x="20" y="78" width="72" height="44" rx="7" fill="#ffffff" stroke="#2f6db3" stroke-width="1.0"/>
  <text x="56.0" y="104.32" font-size="12" fill="#2f6db3" text-anchor="middle" font-weight="700">Ch. 1</text>
  <rect x="104" y="78" width="756" height="44" rx="7" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="114" y="99.15" font-size="13" fill="#12233a" font-weight="700">Introduction</text>
  <text x="114" y="115.15" font-size="11" fill="#5b6b7b">Why the comparison, four RQs, three hypotheses written first</text>
  <rect x="20" y="130" width="72" height="44" rx="7" fill="#ffffff" stroke="#2f6db3" stroke-width="1.0"/>
  <text x="56.0" y="156.32" font-size="12" fill="#2f6db3" text-anchor="middle" font-weight="700">Ch. 2</text>
  <rect x="104" y="130" width="756" height="44" rx="7" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="114" y="151.15" font-size="13" fill="#12233a" font-weight="700">Background</text>
  <text x="114" y="167.15" font-size="11" fill="#5b6b7b">NG-RAN placement, what each language guarantees, the research gap</text>
  <rect x="20" y="182" width="72" height="44" rx="7" fill="#ffffff" stroke="#2e8b57" stroke-width="1.0"/>
  <text x="56.0" y="208.32" font-size="12" fill="#2e8b57" text-anchor="middle" font-weight="700">Ch. 3</text>
  <rect x="104" y="182" width="756" height="44" rx="7" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="114" y="203.15" font-size="13" fill="#12233a" font-weight="700">Methodology</text>
  <text x="114" y="219.15" font-size="11" fill="#5b6b7b">UECM, three methods, fairness, statistics, artefacts</text>
  <rect x="20" y="234" width="72" height="44" rx="7" fill="#ffffff" stroke="#2e8b57" stroke-width="1.0"/>
  <text x="56.0" y="260.32" font-size="12" fill="#2e8b57" text-anchor="middle" font-weight="700">Ch. 4</text>
  <rect x="104" y="234" width="756" height="44" rx="7" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="114" y="255.15" font-size="13" fill="#12233a" font-weight="700">Design</text>
  <text x="114" y="271.15" font-size="11" fill="#5b6b7b">Frozen spec, shared-nothing shards, forced-idiom log, parity</text>
  <rect x="20" y="286" width="72" height="44" rx="7" fill="#ffffff" stroke="#a5700c" stroke-width="1.0"/>
  <text x="56.0" y="312.32" font-size="12" fill="#a5700c" text-anchor="middle" font-weight="700">Ch. 5</text>
  <rect x="104" y="286" width="756" height="44" rx="7" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="114" y="307.15" font-size="13" fill="#12233a" font-weight="700">Evaluation</text>
  <text x="114" y="323.15" font-size="11" fill="#5b6b7b">Hosts, two workloads, then results by load and by question</text>
  <rect x="20" y="338" width="72" height="44" rx="7" fill="#ffffff" stroke="#a04000" stroke-width="1.0"/>
  <text x="56.0" y="364.32" font-size="12" fill="#a04000" text-anchor="middle" font-weight="700">Ch. 6</text>
  <rect x="104" y="338" width="756" height="44" rx="7" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="114" y="359.15" font-size="13" fill="#12233a" font-weight="700">Discussion</text>
  <text x="114" y="375.15" font-size="11" fill="#5b6b7b">RQ answers, hypothesis verdicts, guidelines, what it cannot support</text>
  <rect x="20" y="390" width="72" height="44" rx="7" fill="#ffffff" stroke="#a5281b" stroke-width="1.0"/>
  <text x="56.0" y="416.32" font-size="12" fill="#a5281b" text-anchor="middle" font-weight="700">Ch. 7</text>
  <rect x="104" y="390" width="756" height="44" rx="7" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="114" y="411.15" font-size="13" fill="#12233a" font-weight="700">Conclusion</text>
  <text x="114" y="427.15" font-size="11" fill="#5b6b7b">Narrow claim, then named next experiments</text>
  <rect x="20" y="446" width="840" height="92" rx="9" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.7"/>
  <text x="36" y="470" font-size="13" fill="#1c4e86" font-weight="700">This pack is for review, not for the PDF yet</text>
  <text x="36" y="490" font-size="11.5" fill="#33475b">Each later page unpacks one move the skeleton has to make in five paragraphs. Open the combined .drawio and step the tabs.</text>
  <text x="36" y="506" font-size="11.5" fill="#33475b">Nothing here is cited by Thesis_v3.tex. Pick a page, then we can shrink it to a thesis figure if it earns a caption.</text>
  <text x="440.0" y="598" font-size="11.5" fill="#8794a3" text-anchor="middle">Green in later pages marks a compiler or source fact. Amber marks a host-sensitive measurement. Red marks a refusal or a boundary.</text>
</svg>
