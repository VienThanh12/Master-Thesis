<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs><marker id="a0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6db3"/></marker></defs>
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">The gNB is split twice. UECM sits in one of those boxes.</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">The first split is central versus distributed. The second is control versus user plane inside the central unit.</text>
  <rect x="20" y="76" width="72" height="88" rx="10" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="56.0" y="125.76" font-size="16" fill="#12233a" text-anchor="middle" font-weight="700">UE</text>
  <rect x="140" y="76" width="100" height="88" rx="10" fill="#dce8f7" stroke="#2f6db3" stroke-width="1.0"/>
  <text x="190.0" y="125.4" font-size="15" fill="#1c4e86" text-anchor="middle" font-weight="700">gNB-DU</text>
  <line x1="96" y1="120" x2="136" y2="120" stroke="#2f6db3" stroke-width="2.0" marker-end="url(#a0)"/>
  <rect x="280" y="68" width="380" height="200" rx="12" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="470" y="90" font-size="13" fill="#8794a3" text-anchor="middle" font-weight="700">gNB-CU</text>
  <rect x="300" y="104" width="340" height="72" rx="8" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.8"/>
  <text x="312" y="126.325" font-size="11.5" fill="#1c4e86" font-weight="700">gNB-CU-CP  (this thesis)</text>
  <text x="312" y="144.325" font-size="12" fill="#5b6b7b">RRC, mobility, UE context.</text>
  <text x="312" y="159.325" font-size="12" fill="#5b6b7b">UE Context Management lives here.</text>
  <rect x="300" y="184" width="340" height="68" rx="8" fill="#f4fbf6" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="312" y="206.325" font-size="11.5" fill="#1f6b41" font-weight="700">gNB-CU-UP</text>
  <text x="312" y="224.325" font-size="12" fill="#5b6b7b">User-plane forwarding. Not measured.</text>
  <rect x="700" y="76" width="160" height="88" rx="10" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="780.0" y="125.4" font-size="15" fill="#12233a" text-anchor="middle" font-weight="700">5G Core</text>
  <line x1="244" y1="120" x2="276" y2="120" stroke="#2f6db3" stroke-width="2.0" marker-end="url(#a0)"/>
  <line x1="664" y1="120" x2="696" y2="120" stroke="#2f6db3" stroke-width="2.0" marker-end="url(#a0)"/>
  <text x="118" y="178" font-size="11" fill="#5b6b7b" text-anchor="middle">Uu</text>
  <text x="258" y="178" font-size="11" fill="#5b6b7b" text-anchor="middle">F1</text>
  <text x="682" y="178" font-size="11" fill="#5b6b7b" text-anchor="middle">NG</text>
  <text x="470" y="268" font-size="11" fill="#5b6b7b" text-anchor="middle">E1 between CU-CP and CU-UP</text>
  <rect x="20" y="300" width="270" height="168" rx="9" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="34" y="324.325" font-size="11.5" fill="#1c4e86" font-weight="700">Why this part</text>
  <text x="34" y="344.325" font-size="12" fill="#5b6b7b">UECM owns per-UE control state.</text>
  <text x="34" y="360.325" font-size="12" fill="#5b6b7b">Many UEs at once. Strict lifecycle.</text>
  <text x="34" y="376.325" font-size="12" fill="#5b6b7b">Millisecond-scale signalling budgets.</text>
  <text x="34" y="392.325" font-size="12" fill="#5b6b7b">Small enough to specify in full and</text>
  <text x="34" y="408.325" font-size="12" fill="#5b6b7b">build twice. Hard enough to stand in</text>
  <text x="34" y="424.325" font-size="12" fill="#5b6b7b">for this class of service.</text>
  <rect x="306" y="300" width="270" height="168" rx="9" fill="#ffffff" stroke="#c8860d" stroke-width="1.0"/>
  <text x="320" y="324.325" font-size="11.5" fill="#a5700c" font-weight="700">What the splits buy</text>
  <text x="320" y="344.325" font-size="12" fill="#5b6b7b">DU sits close to the radio.</text>
  <text x="320" y="360.325" font-size="12" fill="#5b6b7b">CU-CP can run on ordinary servers.</text>
  <text x="320" y="376.325" font-size="12" fill="#5b6b7b">Open-RAN lets each box come from</text>
  <text x="320" y="392.325" font-size="12" fill="#5b6b7b">a different vendor.</text>
  <text x="320" y="408.325" font-size="12" fill="#5b6b7b">A defect here is then network-wide,</text>
  <text x="320" y="424.325" font-size="12" fill="#5b6b7b">not local to one vendor's metal.</text>
  <rect x="592" y="300" width="268" height="168" rx="9" fill="#ffffff" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="606" y="324.325" font-size="11.5" fill="#8c2a20" font-weight="700">What this is not</text>
  <text x="606" y="344.325" font-size="12" fill="#5b6b7b">Not the user plane.</text>
  <text x="606" y="360.325" font-size="12" fill="#5b6b7b">Not PHY or layer 2.</text>
  <text x="606" y="376.325" font-size="12" fill="#5b6b7b">Not a packet processor.</text>
  <text x="606" y="392.325" font-size="12" fill="#5b6b7b">Findings travel to other stateful,</text>
  <text x="606" y="408.325" font-size="12" fill="#5b6b7b">partitionable control-plane</text>
  <text x="606" y="424.325" font-size="12" fill="#5b6b7b">services of this kind.</text>
  <text x="440.0" y="536" font-size="11.5" fill="#8794a3" text-anchor="middle">Figure ngran in the thesis is the compact form. This page is the reading aid for the two-axis split.</text>
</svg>
