<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">Three methods, one planned variable: the language</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">A weakness in one method does not carry into the rest of the claims</text>
  <rect x="16" y="76" width="108" height="24" rx="5" fill="#ffffff" stroke="#2f6db3" stroke-width="1.0"/>
  <text x="70.0" y="91.96" font-size="11" fill="#1c4e86" text-anchor="middle" font-weight="700">RQ1 and RQ3</text>
  <rect x="16" y="108" width="268" height="336" rx="10" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.8"/>
  <text x="30" y="132.325" font-size="11.5" fill="#1c4e86" font-weight="700">Load sweep</text>
  <text x="30" y="154.325" font-size="11" fill="#5b6b7b">Open-loop send schedule from light</text>
  <text x="30" y="169.325" font-size="11" fill="#5b6b7b">load to well past saturation.</text>
  <text x="30" y="184.325" font-size="11" fill="#5b6b7b">4 variants interleaved inside</text>
  <text x="30" y="199.325" font-size="11" fill="#5b6b7b">each of 20 repeats.</text>
  <text x="30" y="214.325" font-size="11" fill="#5b6b7b"></text>
  <text x="30" y="229.325" font-size="11" fill="#5b6b7b">A second timing splits the core</text>
  <text x="30" y="244.325" font-size="11" fill="#5b6b7b">operation from the cross-thread</text>
  <text x="30" y="259.325" font-size="11" fill="#5b6b7b">handoff. A third times the contended</text>
  <text x="30" y="274.325" font-size="11" fill="#5b6b7b">queue and the reply handle alone.</text>
  <text x="30" y="289.325" font-size="11" fill="#5b6b7b"></text>
  <text x="30" y="304.325" font-size="11" fill="#5b6b7b">Metric: median, p99, p99.9, p99.99,</text>
  <text x="30" y="319.325" font-size="11" fill="#5b6b7b">maximum, peak RSS, CPU, throughput.</text>
  <rect x="306" y="76" width="108" height="24" rx="5" fill="#ffffff" stroke="#2e8b57" stroke-width="1.0"/>
  <text x="360.0" y="91.96" font-size="11" fill="#1f6b41" text-anchor="middle" font-weight="700">RQ2</text>
  <rect x="306" y="108" width="268" height="336" rx="10" fill="#f4fbf6" stroke="#2e8b57" stroke-width="1.8"/>
  <text x="320" y="132.325" font-size="11.5" fill="#1f6b41" font-weight="700">Fault injection</text>
  <text x="320" y="154.325" font-size="11" fill="#5b6b7b">14 small programs, one per</text>
  <text x="320" y="169.325" font-size="11" fill="#5b6b7b">class, in both languages.</text>
  <text x="320" y="184.325" font-size="11" fill="#5b6b7b"></text>
  <text x="320" y="199.325" font-size="11" fill="#5b6b7b">C++ under AddressSanitizer,</text>
  <text x="320" y="214.325" font-size="11" fill="#5b6b7b">ThreadSanitizer, and</text>
  <text x="320" y="229.325" font-size="11" fill="#5b6b7b">UndefinedBehaviorSanitizer.</text>
  <text x="320" y="244.325" font-size="11" fill="#5b6b7b">Safe Rust compiled, and run under a</text>
  <text x="320" y="259.325" font-size="11" fill="#5b6b7b">bounded timeout where it builds.</text>
  <text x="320" y="274.325" font-size="11" fill="#5b6b7b"></text>
  <text x="320" y="289.325" font-size="11" fill="#5b6b7b">No static analyser is run, on purpose.</text>
  <text x="320" y="304.325" font-size="11" fill="#5b6b7b">The C++ columns report the tooling</text>
  <text x="320" y="319.325" font-size="11" fill="#5b6b7b">this study ran, not a ceiling on C++.</text>
  <rect x="596" y="76" width="108" height="24" rx="5" fill="#ffffff" stroke="#d35400" stroke-width="1.0"/>
  <text x="650.0" y="91.96" font-size="11" fill="#a04000" text-anchor="middle" font-weight="700">RQ4</text>
  <rect x="596" y="108" width="268" height="336" rx="10" fill="#fff3ec" stroke="#d35400" stroke-width="1.8"/>
  <text x="610" y="132.325" font-size="11.5" fill="#a04000" font-weight="700">FFI prototype</text>
  <text x="610" y="154.325" font-size="11" fill="#5b6b7b">A C++ host calls an unchanged Rust</text>
  <text x="610" y="169.325" font-size="11" fill="#5b6b7b">core across a C ABI, the direction a</text>
  <text x="610" y="184.325" font-size="11" fill="#5b6b7b">real migration takes.</text>
  <text x="610" y="199.325" font-size="11" fill="#5b6b7b"></text>
  <text x="610" y="214.325" font-size="11" fill="#5b6b7b">Per-call cost is measured on a real</text>
  <text x="610" y="229.325" font-size="11" fill="#5b6b7b">signalling operation, not inferred</text>
  <text x="610" y="244.325" font-size="11" fill="#5b6b7b">from an empty crossing.</text>
  <text x="610" y="259.325" font-size="11" fill="#5b6b7b"></text>
  <text x="610" y="274.325" font-size="11" fill="#5b6b7b">Memory bugs that cross a language</text>
  <text x="610" y="289.325" font-size="11" fill="#5b6b7b">sit at that seam. All unsafe stays</text>
  <text x="610" y="304.325" font-size="11" fill="#5b6b7b">there. The core is left free of it.</text>
  <rect x="16" y="460" width="848" height="58" rx="8" fill="#fdf6e9" stroke="#c8860d" stroke-width="1.6"/>
  <text x="32" y="478" font-size="12.5" fill="#a5700c" font-weight="700">The common control</text>
  <text x="196" y="474" font-size="11.5" fill="#33475b">both versions are built from one frozen spec. A gap between two</text>
  <text x="196" y="489" font-size="11.5" fill="#33475b">independently written programs would also carry design, libraries, and skill.</text>
  <text x="440.0" y="542" font-size="11.5" fill="#8794a3" text-anchor="middle">Where a question can be answered with numbers, it uses numbers. Where it cannot, the answer is still by a fixed plan, in words.</text>
</svg>
