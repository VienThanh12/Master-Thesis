<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs><marker id="a0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#a5281b"/></marker></defs>
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">Keeping unsafe at the seam bounds review, not corruption</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">Host and part share one address space. A compile-time property of the Rust core bounds nothing at run time once a pointer has crossed.</text>
  <rect x="16" y="76" width="260" height="250" rx="11" fill="#eef3fa" stroke="#2f6db3" stroke-width="2.0"/>
  <rect x="16" y="76" width="260" height="34" rx="11" fill="#2f6db3"/>
  <rect x="16" y="99" width="260" height="11" fill="#2f6db3"/>
  <text x="146.0" y="98.0" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700">C++ HOST</text>
  <rect x="36" y="128" width="220" height="36" rx="6" fill="#dce8f7" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="146.0" y="150.68" font-size="13" fill="#1c4e86" text-anchor="middle">opaque handle</text>
  <rect x="36" y="176" width="220" height="36" rx="6" fill="#dce8f7" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="146.0" y="198.68" font-size="13" fill="#1c4e86" text-anchor="middle">status codes only</text>
  <rect x="36" y="224" width="220" height="36" rx="6" fill="#dce8f7" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="146.0" y="246.68" font-size="13" fill="#1c4e86" text-anchor="middle">same process</text>
  <rect x="310" y="76" width="260" height="250" rx="11" fill="#fff3ec" stroke="#d35400" stroke-width="2.0"/>
  <rect x="310" y="76" width="260" height="34" rx="11" fill="#a04000"/>
  <rect x="310" y="99" width="260" height="11" fill="#a04000"/>
  <text x="440.0" y="98.0" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700">SEAM  (unsafe lives here)</text>
  <rect x="330" y="128" width="220" height="36" rx="6" fill="#ffffff" stroke="#e0975a" stroke-width="1.0"/>
  <text x="440.0" y="150.68" font-size="13" fill="#a04000" text-anchor="middle">11 C entry points</text>
  <rect x="330" y="176" width="220" height="36" rx="6" fill="#ffffff" stroke="#e0975a" stroke-width="1.0"/>
  <text x="440.0" y="198.68" font-size="13" fill="#a04000" text-anchor="middle">9 unsafe functions</text>
  <rect x="330" y="224" width="220" height="36" rx="6" fill="#ffffff" stroke="#e0975a" stroke-width="1.0"/>
  <text x="440.0" y="246.68" font-size="13" fill="#a04000" text-anchor="middle">231 lines of Rust</text>
  <rect x="604" y="76" width="260" height="250" rx="11" fill="#f4fbf6" stroke="#2e8b57" stroke-width="2.0"/>
  <rect x="604" y="76" width="260" height="34" rx="11" fill="#2e8b57"/>
  <rect x="604" y="99" width="260" height="11" fill="#2e8b57"/>
  <text x="734.0" y="98.0" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700">RUST CORE</text>
  <rect x="624" y="128" width="220" height="36" rx="6" fill="#d9f0dd" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="734.0" y="150.68" font-size="13" fill="#1f6b41" text-anchor="middle">0 unsafe sites</text>
  <rect x="624" y="176" width="220" height="36" rx="6" fill="#d9f0dd" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="734.0" y="198.68" font-size="13" fill="#1f6b41" text-anchor="middle">unchanged by the host</text>
  <rect x="624" y="224" width="220" height="36" rx="6" fill="#d9f0dd" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="734.0" y="246.68" font-size="13" fill="#1f6b41" text-anchor="middle">Send / Sync still apply</text>
  <line x1="280" y1="200" x2="306" y2="200" stroke="#a5281b" stroke-width="2.2" marker-end="url(#a0)"/>
  <line x1="574" y1="200" x2="600" y2="200" stroke="#a5281b" stroke-width="2.2" marker-end="url(#a0)"/>
  <text x="440" y="348" font-size="12" fill="#a5281b" text-anchor="middle" font-weight="700">one address space</text>
  <rect x="16" y="372" width="848" height="88" rx="9" fill="#fdf1f0" stroke="#a5281b" stroke-width="1.6"/>
  <text x="32" y="396" font-size="13" fill="#8c2a20" font-weight="700">What a vendor could misread</text>
  <text x="32" y="420" font-size="12" fill="#33475b">The RQ2 result is not a licence to describe a moved part as safe. The seam double-free is the in-guarantee class returning inside unsafe.</text>
  <text x="32" y="438" font-size="12" fill="#33475b">Guideline 2 keeps the C ABI in its own crate so unsafe does not spread through crate chains. It does not sandbox the host.</text>
  <text x="440.0" y="496" font-size="11.5" fill="#8794a3" text-anchor="middle">Per-call tax bounded at 10.91% of a real signal call. A do-nothing crossing bounds only itself.</text>
</svg>
