<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs><marker id="a0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#bcd0e8"/></marker></defs>
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">Parity is tested, not assumed</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">A cross-diff of two logs cannot tell both-correct from both-wrong in the same way. A third version exists for that.</text>
  <circle cx="48" cy="102" r="18" fill="#2f6db3"/>
  <text x="48" y="106.81" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
  <rect x="80" y="80" width="780" height="52" rx="8" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="92" y="103.15" font-size="13" fill="#12233a" font-weight="700">Frozen spec</text>
  <text x="92" y="120.15" font-size="12" fill="#5b6b7b">API, states, data layout, locks, shard size, thread model</text>
  <line x1="48" y1="128" x2="48" y2="140" stroke="#bcd0e8" stroke-width="1.6" marker-end="url(#a0)"/>
  <circle cx="48" cy="164" r="18" fill="#2f6db3"/>
  <text x="48" y="168.81" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
  <rect x="80" y="142" width="780" height="52" rx="8" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="92" y="165.15" font-size="13" fill="#12233a" font-weight="700">Two implementations</text>
  <text x="92" y="182.15" font-size="12" fill="#5b6b7b">C++ and Rust, both following the spec, forced gaps logged</text>
  <line x1="48" y1="190" x2="48" y2="202" stroke="#bcd0e8" stroke-width="1.6" marker-end="url(#a0)"/>
  <circle cx="48" cy="226" r="18" fill="#2f6db3"/>
  <text x="48" y="230.81" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
  <rect x="80" y="204" width="780" height="52" rx="8" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="92" y="227.15" font-size="13" fill="#12233a" font-weight="700">Language-neutral vectors</text>
  <text x="92" y="244.15" font-size="12" fill="#5b6b7b">Same operations, same seeds, logs diffed line by line</text>
  <line x1="48" y1="252" x2="48" y2="264" stroke="#bcd0e8" stroke-width="1.6" marker-end="url(#a0)"/>
  <circle cx="48" cy="288" r="18" fill="#2f6db3"/>
  <text x="48" y="292.81" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
  <rect x="80" y="266" width="780" height="52" rx="8" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="92" y="289.15" font-size="13" fill="#12233a" font-weight="700">Python oracle</text>
  <text x="92" y="306.15" font-size="12" fill="#5b6b7b">223 hand-derived expectations must hold before it may generate</text>
  <line x1="48" y1="314" x2="48" y2="326" stroke="#bcd0e8" stroke-width="1.6" marker-end="url(#a0)"/>
  <circle cx="48" cy="350" r="18" fill="#2f6db3"/>
  <text x="48" y="354.81" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
  <rect x="80" y="328" width="780" height="52" rx="8" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="92" y="351.15" font-size="13" fill="#12233a" font-weight="700">Generated campaign</text>
  <text x="92" y="368.15" font-size="12" fill="#5b6b7b">793,000 generated operations, no mismatch</text>
  <line x1="48" y1="376" x2="48" y2="388" stroke="#bcd0e8" stroke-width="1.6" marker-end="url(#a0)"/>
  <circle cx="48" cy="412" r="18" fill="#2f6db3"/>
  <text x="48" y="416.81" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">6</text>
  <rect x="80" y="390" width="780" height="52" rx="8" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="92" y="413.15" font-size="13" fill="#12233a" font-weight="700">Sanitisers on the path taken</text>
  <text x="92" y="430.15" font-size="12" fill="#5b6b7b">C++: ASan, TSan, UBSan. Rust: Miri. A clean result is bounded by the code that ran.</text>
  <text x="440.0" y="488" font-size="11.5" fill="#8794a3" text-anchor="middle">Illegal operations return a typed error and leave the context unchanged.</text>
  <text x="440.0" y="504" font-size="11.5" fill="#8794a3" text-anchor="middle">That closed set is what lets the same tests drive both versions along the same paths.</text>
</svg>
