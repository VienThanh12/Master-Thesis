<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">Peak RSS: two real effects of the same order on bare metal</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">Never write that the allocator effect is the larger one. Never quote their ratio without naming a host.</text>
  <rect x="16" y="76" width="416" height="220" rx="10" fill="#f4fbf6" stroke="#2e8b57" stroke-width="1.8"/>
  <text x="32" y="102.325" font-size="11.5" fill="#1f6b41" font-weight="700">Language effect (travels)</text>
  <text x="32" y="124.325" font-size="12" fill="#5b6b7b">Rust uses 1.4 to 2.5 MiB more</text>
  <text x="32" y="140.325" font-size="12" fill="#5b6b7b">peak RAM than C++ under either heap.</text>
  <text x="32" y="156.325" font-size="12" fill="#5b6b7b">Same sign and size on all three hosts.</text>
  <text x="32" y="172.325" font-size="12" fill="#5b6b7b"></text>
  <text x="32" y="188.325" font-size="12" fill="#5b6b7b">It is a fixed cost, not a cost per UE. The</text>
  <text x="32" y="204.325" font-size="12" fill="#5b6b7b">quiet host is where that can be seen.</text>
  <text x="32" y="220.325" font-size="12" fill="#5b6b7b">jemalloc's own counts put the extra past</text>
  <text x="32" y="236.325" font-size="12" fill="#5b6b7b">the heap, in the runtime a Rust process</text>
  <text x="32" y="252.325" font-size="12" fill="#5b6b7b">carries before it gets RAM.</text>
  <rect x="448" y="76" width="416" height="220" rx="10" fill="#fdf6e9" stroke="#c8860d" stroke-width="1.8"/>
  <text x="464" y="102.325" font-size="11.5" fill="#a5700c" font-weight="700">Allocator effect (host-dependent ratio)</text>
  <text x="464" y="124.325" font-size="12" fill="#5b6b7b">Linking jemalloc at all costs 1.5 to</text>
  <text x="464" y="140.325" font-size="12" fill="#5b6b7b">2.4 MiB in either language.</text>
  <text x="464" y="156.325" font-size="12" fill="#5b6b7b"></text>
  <text x="464" y="172.325" font-size="12" fill="#5b6b7b">On the guest that extra was 13 times the</text>
  <text x="464" y="188.325" font-size="12" fill="#5b6b7b">language effect. On both bare-metal hosts</text>
  <text x="464" y="204.325" font-size="12" fill="#5b6b7b">the two are comparable.</text>
  <text x="464" y="220.325" font-size="12" fill="#5b6b7b"></text>
  <text x="464" y="236.325" font-size="12" fill="#5b6b7b">The transparent hugepage policy is the</text>
  <text x="464" y="252.325" font-size="12" fill="#5b6b7b">named candidate. The study does not claim</text>
  <text x="464" y="268.325" font-size="12" fill="#5b6b7b">causation. Future work can vary it.</text>
  <rect x="16" y="314" width="270" height="160" rx="9" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.6"/>
  <text x="30" y="338.325" font-size="11.5" fill="#1c4e86" font-weight="700">CPU below saturation</text>
  <text x="30" y="359.325" font-size="12" fill="#5b6b7b">At 56 kops/s Rust uses at</text>
  <text x="30" y="375.325" font-size="12" fill="#5b6b7b">most 5.1 percentage points</text>
  <text x="30" y="391.325" font-size="12" fill="#5b6b7b">less. Scoped to that load, not to</text>
  <text x="30" y="407.325" font-size="12" fill="#5b6b7b">the whole below-saturation band.</text>
  <rect x="304" y="314" width="270" height="160" rx="9" fill="#fdf1f0" stroke="#a5281b" stroke-width="1.6"/>
  <text x="318" y="338.325" font-size="11.5" fill="#8c2a20" font-weight="700">CPU past saturation</text>
  <text x="318" y="359.325" font-size="12" fill="#5b6b7b">The slower arm spends 1.8x</text>
  <text x="318" y="375.325" font-size="12" fill="#5b6b7b">the CPU per finished call. That is</text>
  <text x="318" y="391.325" font-size="12" fill="#5b6b7b">effort spent without finishing.</text>
  <text x="318" y="407.325" font-size="12" fill="#5b6b7b">The sign of CPU hangs on the load.</text>
  <rect x="592" y="314" width="272" height="160" rx="9" fill="#ffffff" stroke="#d7dde3" stroke-width="1.6"/>
  <text x="606" y="338.325" font-size="11.5" fill="#12233a" font-weight="700">A contrary result, reread</text>
  <text x="606" y="359.325" font-size="12" fill="#5b6b7b">Karlbäck reports Rust lowest on</text>
  <text x="606" y="375.325" font-size="12" fill="#5b6b7b">RAM. Those arms are two</text>
  <text x="606" y="391.325" font-size="12" fill="#5b6b7b">concurrency runtimes (Boost.Fibers</text>
  <text x="606" y="407.325" font-size="12" fill="#5b6b7b">vs Tokio), not two languages.</text>
  <text x="440.0" y="536" font-size="11.5" fill="#8794a3" text-anchor="middle">A single number for the CPU cost of Rust's safe-code model would mix two loads that move in opposite ways.</text>
</svg>
