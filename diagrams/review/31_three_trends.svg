<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs><marker id="a0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#12233a"/></marker></defs>
  <rect x="0" y="0" width="880" height="600" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">Three trends that make the language choice timely</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">They meet in one production component: UE Context Management inside a Nokia gNB-CU-CP</text>
  <rect x="20" y="76" width="266" height="268" rx="10" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.8"/>
  <text x="34" y="100.325" font-size="11.5" fill="#1c4e86" font-weight="700">1.  Cloud-native RAN</text>
  <text x="34" y="122.325" font-size="11" fill="#5b6b7b">Control-plane functions now run on</text>
  <text x="34" y="137.325" font-size="11" fill="#5b6b7b">ordinary servers. Open-RAN turns the</text>
  <text x="34" y="152.325" font-size="11" fill="#5b6b7b">base station into virtualised,</text>
  <text x="34" y="167.325" font-size="11" fill="#5b6b7b">multi-vendor software on open</text>
  <text x="34" y="182.325" font-size="11" fill="#5b6b7b">interfaces.</text>
  <text x="34" y="197.325" font-size="11" fill="#5b6b7b"></text>
  <text x="34" y="212.325" font-size="11" fill="#5b6b7b">A latency spike or a memory defect is</text>
  <text x="34" y="227.325" font-size="11" fill="#5b6b7b">then a network-wide risk, not a local</text>
  <text x="34" y="242.325" font-size="11" fill="#5b6b7b">fault on purpose-built hardware.</text>
  <rect x="307" y="76" width="266" height="268" rx="10" fill="#fdf6e9" stroke="#c8860d" stroke-width="1.8"/>
  <text x="321" y="100.325" font-size="11.5" fill="#a5700c" font-weight="700">2.  AI as a neighbour</text>
  <text x="321" y="122.325" font-size="11" fill="#5b6b7b">IMT-2030 lists AI as a usage scenario,</text>
  <text x="321" y="137.325" font-size="11" fill="#5b6b7b">not only as a tuner. AI-RAN puts radio</text>
  <text x="321" y="152.325" font-size="11" fill="#5b6b7b">work and inference on one accelerated</text>
  <text x="321" y="167.325" font-size="11" fill="#5b6b7b">server.</text>
  <text x="321" y="182.325" font-size="11" fill="#5b6b7b"></text>
  <text x="321" y="197.325" font-size="11" fill="#5b6b7b">The control plane no longer has</text>
  <text x="321" y="212.325" font-size="11" fill="#5b6b7b">the host to itself. When the</text>
  <text x="321" y="227.325" font-size="11" fill="#5b6b7b">neighbour takes capacity,</text>
  <text x="321" y="242.325" font-size="11" fill="#5b6b7b">saturation arrives sooner.</text>
  <rect x="594" y="76" width="266" height="268" rx="10" fill="#f4fbf6" stroke="#2e8b57" stroke-width="1.8"/>
  <text x="608" y="100.325" font-size="11.5" fill="#1f6b41" font-weight="700">3.  Memory-safe languages</text>
  <text x="608" y="122.325" font-size="11" fill="#5b6b7b">Vendors report that most serious</text>
  <text x="608" y="137.325" font-size="11" fill="#5b6b7b">bugs are memory-safety errors.</text>
  <text x="608" y="152.325" font-size="11" fill="#5b6b7b">Agencies urge a move away from</text>
  <text x="608" y="167.325" font-size="11" fill="#5b6b7b">C and C++. The EU Cyber Resilience</text>
  <text x="608" y="182.325" font-size="11" fill="#5b6b7b">Act adds duties from 2026 and 2027.</text>
  <text x="608" y="197.325" font-size="11" fill="#5b6b7b"></text>
  <text x="608" y="212.325" font-size="11" fill="#5b6b7b">The Act names no language. Direct</text>
  <text x="608" y="227.325" font-size="11" fill="#5b6b7b">RAN evidence is still missing.</text>
  <line x1="286" y1="210" x2="300" y2="210" stroke="#12233a" stroke-width="1.8" marker-end="url(#a0)"/>
  <line x1="573" y1="210" x2="587" y2="210" stroke="#12233a" stroke-width="1.8" marker-end="url(#a0)"/>
  <rect x="20" y="362" width="840" height="168" rx="10" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.6"/>
  <text x="36" y="386" font-size="13" fill="#12233a" font-weight="700">Where they land in this thesis</text>
  <rect x="36" y="404" width="250" height="108" rx="8" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="48" y="426.6" font-size="12" fill="#12233a" font-weight="700">Industrial setting</text>
  <text x="48" y="444.6" font-size="10.5" fill="#5b6b7b">Nokia is an end-to-end RAN vendor.</text>
  <text x="48" y="458.6" font-size="10.5" fill="#5b6b7b">UECM is modelled on a live gNB-CU-CP</text>
  <text x="48" y="472.6" font-size="10.5" fill="#5b6b7b">part, specified in public, not copied</text>
  <text x="48" y="486.6" font-size="10.5" fill="#5b6b7b">from proprietary source.</text>
  <rect x="304" y="404" width="250" height="108" rx="8" fill="#ffffff" stroke="#c8860d" stroke-width="1.0"/>
  <text x="316" y="426.6" font-size="12" fill="#12233a" font-weight="700">A generational horizon</text>
  <text x="316" y="444.6" font-size="10.5" fill="#5b6b7b">3GPP Release 20 and 21 cover 6G</text>
  <text x="316" y="458.6" font-size="10.5" fill="#5b6b7b">studies and normative work. A control</text>
  <text x="316" y="472.6" font-size="10.5" fill="#5b6b7b">plane written now is maintained next</text>
  <text x="316" y="486.6" font-size="10.5" fill="#5b6b7b">to that generation, not retired.</text>
  <rect x="572" y="404" width="268" height="108" rx="8" fill="#ffffff" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="584" y="426.6" font-size="12" fill="#12233a" font-weight="700">A concrete failure mode</text>
  <text x="584" y="444.6" font-size="10.5" fill="#5b6b7b">A mobility storm frees a UE context</text>
  <text x="584" y="458.6" font-size="10.5" fill="#5b6b7b">while an in-flight message still refers</text>
  <text x="584" y="472.6" font-size="10.5" fill="#5b6b7b">to it. C++ compiles. Safe Rust rejects</text>
  <text x="584" y="486.6" font-size="10.5" fill="#5b6b7b">the dangling reference.</text>
  <text x="440.0" y="568" font-size="11.5" fill="#8794a3" text-anchor="middle">The study measures both safety (which defects are prevented, and when) and predictability (tail latency under overload).</text>
</svg>
