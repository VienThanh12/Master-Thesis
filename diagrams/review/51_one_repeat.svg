<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs><marker id="a0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6db3"/></marker></defs>
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">Inside one repeat the four arms run back to back</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">20 repeats. 14 loads. 1120 measured runs. Interleaving makes host noise common to a block.</text>
  <text x="440" y="88" font-size="12" fill="#8794a3" text-anchor="middle" font-weight="700">ONE REPEAT, ONE LOAD</text>
  <rect x="40" y="104" width="190" height="80" rx="9" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.7"/>
  <text x="52" y="126.325" font-size="11.5" fill="#1c4e86" font-weight="700">C++  jemalloc</text>
  <text x="52" y="144.325" font-size="12" fill="#5b6b7b">same seed, same ops</text>
  <rect x="250" y="104" width="190" height="80" rx="9" fill="#dce8f7" stroke="#2f6db3" stroke-width="1.7"/>
  <text x="262" y="126.325" font-size="11.5" fill="#1c4e86" font-weight="700">C++  system</text>
  <text x="262" y="144.325" font-size="12" fill="#5b6b7b">same seed, same ops</text>
  <rect x="460" y="104" width="190" height="80" rx="9" fill="#f4fbf6" stroke="#2e8b57" stroke-width="1.7"/>
  <text x="472" y="126.325" font-size="11.5" fill="#1f6b41" font-weight="700">Rust  jemalloc</text>
  <text x="472" y="144.325" font-size="12" fill="#5b6b7b">same seed, same ops</text>
  <rect x="670" y="104" width="190" height="80" rx="9" fill="#d9f0dd" stroke="#2e8b57" stroke-width="1.7"/>
  <text x="682" y="126.325" font-size="11.5" fill="#1f6b41" font-weight="700">Rust  system</text>
  <text x="682" y="144.325" font-size="12" fill="#5b6b7b">same seed, same ops</text>
  <line x1="234" y1="144" x2="246" y2="144" stroke="#2f6db3" stroke-width="2.0" marker-end="url(#a0)"/>
  <line x1="444" y1="144" x2="456" y2="144" stroke="#2f6db3" stroke-width="2.0" marker-end="url(#a0)"/>
  <line x1="654" y1="144" x2="666" y2="144" stroke="#2f6db3" stroke-width="2.0" marker-end="url(#a0)"/>
  <rect x="40" y="212" width="400" height="160" rx="9" fill="#f4fbf6" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="54" y="236.325" font-size="11.5" fill="#1f6b41" font-weight="700">What pairing can cancel</text>
  <text x="54" y="257.325" font-size="12.5" fill="#5b6b7b">A noisy minute of the host hits all four</text>
  <text x="54" y="274.325" font-size="12.5" fill="#5b6b7b">arms in that block. The paired test then</text>
  <text x="54" y="291.325" font-size="12.5" fill="#5b6b7b">sees the language difference, not the</text>
  <text x="54" y="308.325" font-size="12.5" fill="#5b6b7b">noise. That is why the family is exact</text>
  <text x="54" y="325.325" font-size="12.5" fill="#5b6b7b">permutation tests over 20 pairs.</text>
  <rect x="460" y="212" width="380" height="160" rx="9" fill="#fdf6e9" stroke="#c8860d" stroke-width="1.6"/>
  <text x="474" y="236.325" font-size="11.5" fill="#a5700c" font-weight="700">What pairing cannot cancel</text>
  <text x="474" y="257.325" font-size="12.5" fill="#5b6b7b">A stall that hits only the high tail of</text>
  <text x="474" y="274.325" font-size="12.5" fill="#5b6b7b">one arm. p99 is computed from exactly</text>
  <text x="474" y="291.325" font-size="12.5" fill="#5b6b7b">those operations. The far tail is pooled</text>
  <text x="474" y="308.325" font-size="12.5" fill="#5b6b7b">across repeats, so it has no across-run</text>
  <text x="474" y="325.325" font-size="12.5" fill="#5b6b7b">interval and stays out of the family.</text>
  <text x="440.0" y="476" font-size="11.5" fill="#8794a3" text-anchor="middle">A load picked after seeing the sweep cannot enter the family. That is why the tracking gap at 448 kops/s is shown and not tested.</text>
</svg>
