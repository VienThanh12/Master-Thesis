<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="620" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">What this study cannot support, and what it would do next</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">The first professional duty is not to claim too much. The second is how far the data reaches.</text>
  <rect x="16" y="72" width="848" height="196" rx="11" fill="#fdf1f0" stroke="#a5281b" stroke-width="2.0"/>
  <rect x="16" y="72" width="848" height="34" rx="11" fill="#a5281b"/>
  <rect x="16" y="95" width="848" height="11" fill="#a5281b"/>
  <text x="440.0" y="94.0" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700">THREE THREATS THAT STILL MATTER</text>
  <rect x="32" y="120" width="260" height="128" rx="8" fill="#ffffff" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="44" y="142.875" font-size="12.5" fill="#12233a" font-weight="700">Single-author skill</text>
  <text x="44" y="160.875" font-size="11" fill="#5b6b7b">One person wrote both versions.</text>
  <text x="44" y="174.875" font-size="11" fill="#5b6b7b">In this field a code review then</text>
  <text x="44" y="188.875" font-size="11" fill="#5b6b7b">more speed work flipped a printed</text>
  <text x="44" y="202.875" font-size="11" fill="#5b6b7b">verdict from comparable to Rust</text>
  <text x="44" y="216.875" font-size="11" fill="#5b6b7b">worse by 85 to 91%.</text>
  <rect x="308" y="120" width="260" height="128" rx="8" fill="#ffffff" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="320" y="142.875" font-size="12.5" fill="#12233a" font-weight="700">The clock times the design</text>
  <text x="320" y="160.875" font-size="11" fill="#5b6b7b">End-to-end answers the question a</text>
  <text x="320" y="174.875" font-size="11" fill="#5b6b7b">vendor sizing a node would ask.</text>
  <text x="320" y="188.875" font-size="11" fill="#5b6b7b">It answers the language question</text>
  <text x="320" y="202.875" font-size="11" fill="#5b6b7b">hardly at all. The core timing is</text>
  <text x="320" y="216.875" font-size="11" fill="#5b6b7b">the supplement, and it is narrower.</text>
  <rect x="584" y="120" width="260" height="128" rx="8" fill="#ffffff" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="596" y="142.875" font-size="12.5" fill="#12233a" font-weight="700">One subsystem, one mix</text>
  <text x="596" y="160.875" font-size="11" fill="#5b6b7b">Call mix is not a public cell mix.</text>
  <text x="596" y="174.875" font-size="11" fill="#5b6b7b">A different mix moves both sides</text>
  <text x="596" y="188.875" font-size="11" fill="#5b6b7b">the same way. It limits how far</text>
  <text x="596" y="202.875" font-size="11" fill="#5b6b7b">the numbers travel. It does not</text>
  <text x="596" y="216.875" font-size="11" fill="#5b6b7b">make the test unfair.</text>
  <rect x="16" y="284" width="848" height="248" rx="11" fill="#eef3fa" stroke="#2f6db3" stroke-width="2.0"/>
  <rect x="16" y="284" width="848" height="34" rx="11" fill="#2f6db3"/>
  <rect x="16" y="307" width="848" height="11" fill="#2f6db3"/>
  <text x="440.0" y="306.0" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700">NAMED NEXT EXPERIMENTS</text>
  <rect x="32" y="332" width="260" height="80" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="42" y="352.6" font-size="12" fill="#12233a" font-weight="700">Hugepage policy</text>
  <text x="42" y="368.6" font-size="10.5" fill="#5b6b7b">Vary it on one host with all else</text>
  <text x="42" y="381.6" font-size="10.5" fill="#5b6b7b">fixed. The three hosts disagree</text>
  <text x="42" y="394.6" font-size="10.5" fill="#5b6b7b">about the allocator-to-language</text>
  <text x="42" y="407.6" font-size="10.5" fill="#5b6b7b">RSS ratio.</text>
  <rect x="308" y="332" width="260" height="80" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="318" y="352.6" font-size="12" fill="#12233a" font-weight="700">Production traces</text>
  <text x="318" y="368.6" font-size="10.5" fill="#5b6b7b">Replay anonymised traces to check</text>
  <text x="318" y="381.6" font-size="10.5" fill="#5b6b7b">the call mix.</text>
  <rect x="584" y="332" width="260" height="80" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="594" y="352.6" font-size="12" fill="#12233a" font-weight="700">Shared mutable state</text>
  <text x="594" y="368.6" font-size="10.5" fill="#5b6b7b">A part that is not shared-nothing</text>
  <text x="594" y="381.6" font-size="10.5" fill="#5b6b7b">would work the two sides in a way</text>
  <text x="594" y="394.6" font-size="10.5" fill="#5b6b7b">this design does not.</text>
  <rect x="32" y="420" width="260" height="80" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="42" y="440.6" font-size="12" fill="#12233a" font-weight="700">Async vs thread-per-shard</text>
  <text x="42" y="456.6" font-size="10.5" fill="#5b6b7b">Split the runtime from the</text>
  <text x="42" y="469.6" font-size="10.5" fill="#5b6b7b">language in the tail result.</text>
  <rect x="308" y="420" width="260" height="80" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="318" y="440.6" font-size="12" fill="#12233a" font-weight="700">Two heaps in one process</text>
  <text x="318" y="456.6" font-size="10.5" fill="#5b6b7b">Price what keeping a core free of</text>
  <text x="318" y="469.6" font-size="10.5" fill="#5b6b7b">unsafe is worth.</text>
  <rect x="584" y="420" width="260" height="80" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="594" y="440.6" font-size="12" fill="#12233a" font-weight="700">Longer case study</text>
  <text x="594" y="456.6" font-size="10.5" fill="#5b6b7b">Track defect counts and review</text>
  <text x="594" y="469.6" font-size="10.5" fill="#5b6b7b">effort while adding Rust a piece</text>
  <text x="594" y="482.6" font-size="10.5" fill="#5b6b7b">at a time.</text>
  <text x="440.0" y="596" font-size="11.5" fill="#8794a3" text-anchor="middle">A deadlocked control plane is an outage. A lost counter update that stays silent can misinform a mobility decision. Nothing shown here stops either.</text>
</svg>
