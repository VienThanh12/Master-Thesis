<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8794a3"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="540" fill="#ffffff"/>
  <text x="470" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#12233a">Memory-safety &amp; concurrency defect classes</text>
  <text x="470" y="56" text-anchor="middle" font-size="13" fill="#5b6b7b">All are silent in C++: accepted by the compiler, surfacing only later as corruption, a crash, a hang, or a latency spike</text>

  <!-- root -->
  <rect x="316" y="78" width="308" height="52" rx="10" fill="#12233a"/>
  <text x="470" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Defects in C++ control-plane code</text>
  <text x="470" y="120" text-anchor="middle" font-size="10.5" fill="#c3ccd5">(each has a natural incarnation in UECM)</text>

  <!-- families -->
  <rect x="150" y="172" width="240" height="52" rx="10" fill="#dce8f7" stroke="#2f6db3" stroke-width="2"/>
  <text x="270" y="197" text-anchor="middle" font-size="14" font-weight="700" fill="#1c4e86">Memory-safety family</text>
  <text x="270" y="214" text-anchor="middle" font-size="10.5" fill="#5b6b7b">object lifetime &amp; bounds</text>

  <rect x="550" y="172" width="240" height="52" rx="10" fill="#dce8f7" stroke="#2f6db3" stroke-width="2"/>
  <text x="670" y="197" text-anchor="middle" font-size="14" font-weight="700" fill="#1c4e86">Concurrency family</text>
  <text x="670" y="214" text-anchor="middle" font-size="10.5" fill="#5b6b7b">unsynchronised / ill-ordered access</text>

  <line x1="440" y1="130" x2="290" y2="170" stroke="#8794a3" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="500" y1="130" x2="650" y2="170" stroke="#8794a3" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- memory-safety leaves -->
  <g font-size="12.5">
    <rect x="130" y="262" width="280" height="46" rx="8" fill="#d9f0dd" stroke="#2e8b57" stroke-width="2"/>
    <text x="270" y="290" text-anchor="middle" font-weight="600" fill="#1f6b41">Use-after-free  &#9733;</text>
    <rect x="130" y="314" width="280" height="46" rx="8" fill="#d9f0dd" stroke="#2e8b57" stroke-width="2"/>
    <text x="270" y="342" text-anchor="middle" font-weight="600" fill="#1f6b41">Double-free  &#9733;</text>
    <rect x="130" y="366" width="280" height="46" rx="8" fill="#f1f3f5" stroke="#b7c0c9" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="270" y="394" text-anchor="middle" fill="#8794a3">Buffer overflow  (not injected)</text>
  </g>
  <line x1="270" y1="224" x2="270" y2="260" stroke="#8794a3" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- concurrency leaves -->
  <g font-size="12.5">
    <rect x="530" y="262" width="280" height="46" rx="8" fill="#d9f0dd" stroke="#2e8b57" stroke-width="2"/>
    <text x="670" y="290" text-anchor="middle" font-weight="600" fill="#1f6b41">Data race  &#9733;</text>
    <rect x="530" y="314" width="280" height="46" rx="8" fill="#d9f0dd" stroke="#2e8b57" stroke-width="2"/>
    <text x="670" y="342" text-anchor="middle" font-weight="600" fill="#1f6b41">Iterator invalidation  &#9733;</text>
    <rect x="530" y="366" width="280" height="46" rx="8" fill="#d9f0dd" stroke="#2e8b57" stroke-width="2"/>
    <text x="670" y="394" text-anchor="middle" font-weight="600" fill="#1f6b41">Unguarded shared mutation  &#9733;</text>
    <rect x="530" y="418" width="280" height="46" rx="8" fill="#fdf0d5" stroke="#c8860d" stroke-width="2"/>
    <text x="670" y="446" text-anchor="middle" font-weight="600" fill="#8a5a06">Lock-order deadlock  &#9670;</text>
    <rect x="530" y="470" width="280" height="46" rx="8" fill="#fdf0d5" stroke="#c8860d" stroke-width="2"/>
    <text x="670" y="498" text-anchor="middle" font-weight="600" fill="#8a5a06">Lost update  &#9670;</text>
  </g>
  <line x1="670" y1="224" x2="670" y2="260" stroke="#8794a3" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- legend -->
  <rect x="130" y="430" width="280" height="92" rx="9" fill="#fbfcfd" stroke="#d7dde3"/>
  <text x="270" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#12233a">Legend</text>
  <rect x="146" y="458" width="16" height="14" fill="#d9f0dd" stroke="#2e8b57"/>
  <text x="170" y="470" font-size="10.5" fill="#4a5b6b">&#9733; injected, inside Rust&#8217;s guarantee (5)</text>
  <rect x="146" y="478" width="16" height="14" fill="#fdf0d5" stroke="#c8860d"/>
  <text x="170" y="490" font-size="10.5" fill="#4a5b6b">&#9670; injected, boundary of the guarantee (2)</text>
  <rect x="146" y="498" width="16" height="14" fill="#f1f3f5" stroke="#b7c0c9"/>
  <text x="170" y="510" font-size="10.5" fill="#4a5b6b">described for completeness, not injected</text>
</svg>
