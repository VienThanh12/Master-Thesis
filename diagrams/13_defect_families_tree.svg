<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8794a3"/></marker>
  </defs>
  <rect x="0" y="0" width="1060" height="560" fill="#ffffff"/>
  <text x="530" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#12233a">Memory-safety &amp; concurrency defect classes</text>
  <text x="530" y="56" text-anchor="middle" font-size="13" fill="#5b6b7b">All are silent in C++: accepted by the compiler, surfacing only later as corruption, a crash, a hang, or a latency spike</text>

  <!-- root -->
  <rect x="376" y="78" width="308" height="52" rx="10" fill="#12233a"/>
  <text x="530" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Defects in C++ control-plane code</text>
  <text x="530" y="120" text-anchor="middle" font-size="10.5" fill="#c3ccd5">(each has a natural incarnation in UECM)</text>

  <!-- groups -->
  <rect x="30" y="170" width="320" height="56" rx="10" fill="#dce8f7" stroke="#2f6db3" stroke-width="2"/>
  <text x="190" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#1c4e86">Memory-safety family</text>
  <text x="190" y="212" text-anchor="middle" font-size="10.5" fill="#5b6b7b">object lifetime and bounds</text>

  <rect x="370" y="170" width="320" height="56" rx="10" fill="#dce8f7" stroke="#2f6db3" stroke-width="2"/>
  <text x="530" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#1c4e86">Concurrency family</text>
  <text x="530" y="212" text-anchor="middle" font-size="10.5" fill="#5b6b7b">unsynchronised or ill-ordered access</text>

  <rect x="710" y="170" width="320" height="56" rx="10" fill="#fdf0d5" stroke="#c8860d" stroke-width="2"/>
  <text x="870" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#8a5a06">Boundary group</text>
  <text x="870" y="212" text-anchor="middle" font-size="10.5" fill="#5b6b7b">chosen because safe Rust does not prevent them</text>

  <line x1="440" y1="130" x2="220" y2="166" stroke="#8794a3" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="530" y1="130" x2="530" y2="166" stroke="#8794a3" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="620" y1="130" x2="840" y2="166" stroke="#8794a3" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- memory-safety leaves -->
  <g font-size="12.5">
    <rect x="30" y="248" width="320" height="40" rx="8" fill="#d9f0dd" stroke="#2e8b57" stroke-width="2"/>
    <text x="190" y="273" text-anchor="middle" font-weight="600" fill="#1f6b41">Use-after-free  &#9733;</text>
    <rect x="30" y="292" width="320" height="40" rx="8" fill="#d9f0dd" stroke="#2e8b57" stroke-width="2"/>
    <text x="190" y="317" text-anchor="middle" font-weight="600" fill="#1f6b41">Double-free  &#9733;</text>
    <rect x="30" y="336" width="320" height="40" rx="8" fill="#d9f0dd" stroke="#2e8b57" stroke-width="2"/>
    <text x="190" y="361" text-anchor="middle" font-weight="600" fill="#1f6b41">Use-after-move  &#9733;</text>
    <rect x="30" y="380" width="320" height="40" rx="8" fill="#f1f3f5" stroke="#b7c0c9" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="190" y="405" text-anchor="middle" fill="#8794a3">Buffer overflow  (not injected)</text>
  </g>

  <!-- concurrency leaves -->
  <g font-size="12.5">
    <rect x="370" y="248" width="320" height="40" rx="8" fill="#d9f0dd" stroke="#2e8b57" stroke-width="2"/>
    <text x="530" y="273" text-anchor="middle" font-weight="600" fill="#1f6b41">Data race  &#9733;</text>
    <rect x="370" y="292" width="320" height="40" rx="8" fill="#d9f0dd" stroke="#2e8b57" stroke-width="2"/>
    <text x="530" y="317" text-anchor="middle" font-weight="600" fill="#1f6b41">Iterator invalidation  &#9733;</text>
    <rect x="370" y="336" width="320" height="40" rx="8" fill="#d9f0dd" stroke="#2e8b57" stroke-width="2"/>
    <text x="530" y="361" text-anchor="middle" font-weight="600" fill="#1f6b41">Unguarded shared mutation  &#9733;</text>
    <rect x="370" y="380" width="320" height="40" rx="8" fill="#d9f0dd" stroke="#2e8b57" stroke-width="2"/>
    <text x="530" y="405" text-anchor="middle" font-weight="600" fill="#1f6b41">Thread-unsafe handle shared  &#9733;</text>
  </g>

  <!-- boundary leaves -->
  <g font-size="12.5">
    <rect x="710" y="248" width="320" height="40" rx="8" fill="#fdf0d5" stroke="#c8860d" stroke-width="2"/>
    <text x="870" y="273" text-anchor="middle" font-weight="600" fill="#8a5a06">Lock-order deadlock  &#9670;</text>
    <rect x="710" y="292" width="320" height="40" rx="8" fill="#fdf0d5" stroke="#c8860d" stroke-width="2"/>
    <text x="870" y="317" text-anchor="middle" font-weight="600" fill="#8a5a06">Lost update  &#9670;</text>
    <rect x="710" y="336" width="320" height="40" rx="8" fill="#fdf0d5" stroke="#c8860d" stroke-width="2"/>
    <text x="870" y="361" text-anchor="middle" font-weight="600" fill="#8a5a06">Reference-cycle leak  &#9670;</text>
    <rect x="710" y="380" width="320" height="40" rx="8" fill="#fdf0d5" stroke="#c8860d" stroke-width="2"/>
    <text x="870" y="405" text-anchor="middle" font-weight="600" fill="#8a5a06">Integer overflow (release)  &#9670;</text>
    <rect x="710" y="424" width="320" height="40" rx="8" fill="#fdf0d5" stroke="#c8860d" stroke-width="2"/>
    <text x="870" y="449" text-anchor="middle" font-weight="600" fill="#8a5a06">Worker-failure blast radius  &#9670;</text>
    <rect x="710" y="468" width="320" height="40" rx="8" fill="#fdf0d5" stroke="#c8860d" stroke-width="2"/>
    <text x="870" y="493" text-anchor="middle" font-weight="600" fill="#8a5a06">Double-free across the seam  &#9670;</text>
    <rect x="710" y="512" width="320" height="40" rx="8" fill="#fdf0d5" stroke="#c8860d" stroke-width="2"/>
    <text x="870" y="537" text-anchor="middle" font-weight="600" fill="#8a5a06">Forgotten lock guard  &#9670;</text>
  </g>

  <!-- legend -->
  <rect x="30" y="440" width="660" height="98" rx="9" fill="#fbfcfd" stroke="#d7dde3"/>
  <text x="360" y="462" text-anchor="middle" font-size="12" font-weight="700" fill="#12233a">Legend</text>
  <rect x="52" y="472" width="16" height="14" fill="#d9f0dd" stroke="#2e8b57"/>
  <text x="78" y="484" font-size="11" fill="#4a5b6b">&#9733; injected, inside Rust&#8217;s guarantee (7)</text>
  <rect x="52" y="494" width="16" height="14" fill="#fdf0d5" stroke="#c8860d"/>
  <text x="78" y="506" font-size="11" fill="#4a5b6b">&#9670; injected, boundary of the guarantee (7)</text>
  <rect x="52" y="516" width="16" height="14" fill="#f1f3f5" stroke="#b7c0c9"/>
  <text x="78" y="528" font-size="11" fill="#4a5b6b">described for completeness, not injected</text>
  <text x="386" y="478" font-size="11" fill="#4a5b6b">Both sides are the same size on purpose.</text>
  <text x="386" y="494" font-size="11" fill="#4a5b6b">A catalogue holding only the defects Rust</text>
  <text x="386" y="510" font-size="11" fill="#4a5b6b">prevents would confirm its own premise, so</text>
  <text x="386" y="526" font-size="11" fill="#4a5b6b">this one measures a boundary instead.</text>
</svg>
