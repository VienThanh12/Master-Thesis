<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="860" height="400" fill="#ffffff"/>
  <rect x="16" y="16" width="400" height="348" rx="11" fill="#f4fbf6" stroke="#2e8b57" stroke-width="2.0"/>
  <rect x="16" y="16" width="400" height="36" rx="11" fill="#2e8b57"/>
  <rect x="16" y="41" width="400" height="11" fill="#2e8b57"/>
  <text x="216.0" y="39.0" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700">Inside the guarantee</text>
  <text x="216" y="70" font-size="12" fill="#1f6b41" text-anchor="middle">compile error in safe Rust</text>
  <rect x="34" y="86" width="364" height="118" rx="9" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.5"/>
  <text x="48" y="108" font-size="13" fill="#12233a" font-weight="700">Lifetime and aliasing</text>
  <text x="48" y="126" font-size="11" fill="#5b6b7b">ownership and borrowing</text>
  <rect x="48" y="140" width="162" height="26" rx="5" fill="#d9f0dd"/>
  <text x="129.0" y="157.32" font-size="12" fill="#1f6b41" text-anchor="middle">Use-after-free</text>
  <rect x="222" y="140" width="160" height="26" rx="5" fill="#d9f0dd"/>
  <text x="302.0" y="157.32" font-size="12" fill="#1f6b41" text-anchor="middle">Double-free</text>
  <rect x="48" y="172" width="334" height="26" rx="5" fill="#d9f0dd"/>
  <text x="215.0" y="189.32" font-size="12" fill="#1f6b41" text-anchor="middle">Iterator invalidation</text>
  <rect x="34" y="216" width="364" height="100" rx="9" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.5"/>
  <text x="48" y="238" font-size="13" fill="#12233a" font-weight="700">Unsynchronised access</text>
  <text x="48" y="256" font-size="11" fill="#5b6b7b">data races (Send/Sync)</text>
  <rect x="48" y="274" width="132" height="26" rx="5" fill="#d9f0dd"/>
  <text x="114.0" y="291.32" font-size="12" fill="#1f6b41" text-anchor="middle">Data race</text>
  <rect x="192" y="274" width="190" height="26" rx="5" fill="#d9f0dd"/>
  <text x="287.0" y="290.96" font-size="11" fill="#1f6b41" text-anchor="middle">Unguarded shared mutation</text>
  <rect x="34" y="328" width="364" height="24" rx="5" fill="#d9f0dd"/>
  <text x="216" y="345" font-size="11.5" fill="#1f6b41" text-anchor="middle" font-weight="700">No test required</text>
  <rect x="444" y="16" width="400" height="348" rx="11" fill="#fdf1f0" stroke="#a5281b" stroke-width="2.0"/>
  <rect x="444" y="16" width="400" height="36" rx="11" fill="#a5281b"/>
  <rect x="444" y="41" width="400" height="11" fill="#a5281b"/>
  <text x="644.0" y="39.0" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700">Outside the guarantee</text>
  <text x="644" y="70" font-size="12" fill="#8c2a20" text-anchor="middle">compiles and misbehaves in both</text>
  <rect x="462" y="86" width="364" height="118" rx="9" fill="#ffffff" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="476" y="108" font-size="13" fill="#12233a" font-weight="700">Order of lock acquisition</text>
  <text x="476" y="126" font-size="11" fill="#5b6b7b">neither compiler prevents this</text>
  <rect x="476" y="154" width="336" height="32" rx="5" fill="#fbdedb"/>
  <text x="644.0" y="174.68" font-size="13" fill="#8c2a20" text-anchor="middle">Lock-order deadlock</text>
  <rect x="462" y="216" width="364" height="100" rx="9" fill="#ffffff" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="476" y="238" font-size="13" fill="#12233a" font-weight="700">Atomicity of a composed operation</text>
  <text x="476" y="256" font-size="11" fill="#5b6b7b">race conditions</text>
  <rect x="476" y="276" width="336" height="26" rx="5" fill="#fbdedb"/>
  <text x="644.0" y="293.68" font-size="13" fill="#8c2a20" text-anchor="middle">Lost update</text>
  <rect x="462" y="328" width="364" height="24" rx="5" fill="#fbdedb"/>
  <text x="644" y="345" font-size="11.5" fill="#8c2a20" text-anchor="middle" font-weight="700">Fails quietly</text>
  <line x1="430" y1="16" x2="430" y2="364" stroke="#12233a" stroke-width="2.2" stroke-dasharray="9 5"/>
  <rect x="366" y="372" width="128" height="22" rx="11" fill="#12233a"/>
  <text x="430" y="388" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">the boundary</text>
</svg>
