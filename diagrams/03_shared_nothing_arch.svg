<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="520" fill="#ffffff"/>
  <text x="490" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#12233a">Shared-nothing, thread-per-shard architecture</text>
  <text x="490" y="59" text-anchor="middle" font-size="13.5" fill="#5b6b7b">Each shard is owned by exactly one worker &#8212; no shared mutable state, no locks on context data (spec &#167;7)</text>

  <!-- Producers -->
  <rect x="34" y="120" width="176" height="250" rx="12" fill="#f3f6fb" stroke="#8794a3" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="122" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#33475b">load generators</text>
  <rect x="56" y="140" width="132" height="46" rx="8" fill="#dce8f7" stroke="#2f6db3" stroke-width="1.8"/>
  <text x="122" y="168" text-anchor="middle" font-size="13.5" fill="#1c4e86">Producer 1</text>
  <rect x="56" y="210" width="132" height="46" rx="8" fill="#dce8f7" stroke="#2f6db3" stroke-width="1.8"/>
  <text x="122" y="238" text-anchor="middle" font-size="13.5" fill="#1c4e86">Producer 2</text>
  <rect x="56" y="300" width="132" height="46" rx="8" fill="#dce8f7" stroke="#2f6db3" stroke-width="1.8"/>
  <text x="122" y="328" text-anchor="middle" font-size="13.5" fill="#1c4e86">Producer m</text>
  <text x="122" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#8794a3">&#8942;</text>

  <!-- routing label -->
  <text x="290" y="240" text-anchor="middle" font-size="12.5" font-weight="600" fill="#a5281b">route by</text>
  <text x="290" y="258" text-anchor="middle" font-size="12.5" font-weight="600" fill="#a5281b">shard_index(ue_id)</text>
  <text x="290" y="276" text-anchor="middle" font-size="10.5" fill="#8a3227">SplitMix64 finalizer</text>

  <!-- Shard lane 1 -->
  <rect x="352" y="112" width="588" height="120" rx="12" fill="#fcfdfe" stroke="#cbd4dd" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="372" y="132" font-size="12" font-weight="700" fill="#7a8a99">Shard 0 lane  (single-consumer)</text>
  <rect x="372" y="146" width="150" height="56" rx="7" fill="#eceff1" stroke="#6b7b8c" stroke-width="1.8"/>
  <text x="447" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#33475b">bounded MPSC</text>
  <text x="447" y="188" text-anchor="middle" font-size="10.5" fill="#5b6b7b">sync_channel(1024)</text>
  <rect x="566" y="146" width="140" height="56" rx="7" fill="#fbe0cb" stroke="#d35400" stroke-width="1.9"/>
  <text x="636" y="170" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a04000">Worker 0</text>
  <text x="636" y="188" text-anchor="middle" font-size="10.5" fill="#8a4b16">owns ShardCore</text>
  <path d="M772 150 a44 10 0 0 0 88 0 v44 a44 10 0 0 1 -88 0 z" fill="#d9f0dd" stroke="#2e8b57" stroke-width="1.9"/>
  <ellipse cx="816" cy="150" rx="44" ry="10" fill="#d9f0dd" stroke="#2e8b57" stroke-width="1.9"/>
  <text x="816" y="176" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6b41">HashMap</text>
  <text x="816" y="192" text-anchor="middle" font-size="10" fill="#2e8b57">shard 0 ctxs</text>
  <line x1="522" y1="174" x2="562" y2="174" stroke="#33475b" stroke-width="2" marker-end="url(#a)"/>
  <text x="542" y="164" text-anchor="middle" font-size="10.5" fill="#33475b">FIFO</text>
  <line x1="706" y1="174" x2="768" y2="174" stroke="#33475b" stroke-width="2" marker-end="url(#a)"/>
  <text x="737" y="164" text-anchor="middle" font-size="10.5" fill="#33475b">owns</text>

  <!-- Shard lane N -->
  <rect x="352" y="290" width="588" height="120" rx="12" fill="#fcfdfe" stroke="#cbd4dd" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="372" y="310" font-size="12" font-weight="700" fill="#7a8a99">Shard N-1 lane  (single-consumer)</text>
  <rect x="372" y="324" width="150" height="56" rx="7" fill="#eceff1" stroke="#6b7b8c" stroke-width="1.8"/>
  <text x="447" y="348" text-anchor="middle" font-size="13" font-weight="600" fill="#33475b">bounded MPSC</text>
  <text x="447" y="366" text-anchor="middle" font-size="10.5" fill="#5b6b7b">sync_channel(1024)</text>
  <rect x="566" y="324" width="140" height="56" rx="7" fill="#fbe0cb" stroke="#d35400" stroke-width="1.9"/>
  <text x="636" y="348" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a04000">Worker N-1</text>
  <text x="636" y="366" text-anchor="middle" font-size="10.5" fill="#8a4b16">owns ShardCore</text>
  <path d="M772 328 a44 10 0 0 0 88 0 v44 a44 10 0 0 1 -88 0 z" fill="#d9f0dd" stroke="#2e8b57" stroke-width="1.9"/>
  <ellipse cx="816" cy="328" rx="44" ry="10" fill="#d9f0dd" stroke="#2e8b57" stroke-width="1.9"/>
  <text x="816" y="354" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6b41">HashMap</text>
  <text x="816" y="370" text-anchor="middle" font-size="10" fill="#2e8b57">shard N-1 ctxs</text>
  <line x1="522" y1="352" x2="562" y2="352" stroke="#33475b" stroke-width="2" marker-end="url(#a)"/>
  <text x="542" y="342" text-anchor="middle" font-size="10.5" fill="#33475b">FIFO</text>
  <line x1="706" y1="352" x2="768" y2="352" stroke="#33475b" stroke-width="2" marker-end="url(#a)"/>
  <text x="737" y="342" text-anchor="middle" font-size="10.5" fill="#33475b">owns</text>

  <text x="646" y="266" text-anchor="middle" font-size="18" font-weight="700" fill="#8794a3">&#8942;</text>

  <!-- submit arrows -->
  <path d="M210 210 C 300 210, 300 174, 368 174" fill="none" stroke="#33475b" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M210 290 C 300 290, 300 352, 368 352" fill="none" stroke="#33475b" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="330" y="200" text-anchor="middle" font-size="11.5" font-weight="600" fill="#33475b">submit</text>

  <!-- completion return path (green) -->
  <path d="M636 380 C 636 468, 260 468, 122 380" fill="none" stroke="#2e8b57" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="430" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="#1f6b41">one-shot completion: worker writes OpResult to a fresh per-request channel &#8594; waiting producer</text>

  <text x="447" y="222" text-anchor="middle" font-size="10" fill="#c0392b">full queue &#8658; submit blocks (backpressure &#8658; tail latency)</text>
</svg>
