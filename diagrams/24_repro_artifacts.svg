<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs><marker id="a0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/></marker></defs>
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">What is published, and what it regenerates</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">The study is built so that a third party can reproduce it without access to any proprietary code</text>
  <rect x="20" y="78" width="262" height="312" rx="11" fill="#eef3fa" stroke="#2f6db3" stroke-width="2.0"/>
  <rect x="20" y="78" width="262" height="34" rx="11" fill="#2f6db3"/>
  <rect x="20" y="101" width="262" height="11" fill="#2f6db3"/>
  <text x="151.0" y="100.0" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700">PUBLISHED</text>
  <rect x="38" y="122" width="226" height="48" rx="6" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="48" y="142.05" font-size="11" fill="#12233a" font-weight="700">spec/</text>
  <text x="48" y="156.05" font-size="9.5" fill="#5b6b7b">The frozen specification and the</text>
  <text x="48" y="168.05" font-size="9.5" fill="#5b6b7b">conformance suite</text>
  <rect x="38" y="174" width="226" height="48" rx="6" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="48" y="194.05" font-size="11" fill="#12233a" font-weight="700">cpp/   rust/</text>
  <text x="48" y="208.05" font-size="9.5" fill="#5b6b7b">The parity-tested pair of</text>
  <text x="48" y="220.05" font-size="9.5" fill="#5b6b7b">implementations</text>
  <rect x="38" y="226" width="226" height="48" rx="6" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="48" y="246.05" font-size="11" fill="#12233a" font-weight="700">bench/</text>
  <text x="48" y="260.05" font-size="9.5" fill="#5b6b7b">Harness, campaign scripts, and the</text>
  <text x="48" y="272.05" font-size="9.5" fill="#5b6b7b">testbed protocol</text>
  <rect x="38" y="278" width="226" height="48" rx="6" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="48" y="298.05" font-size="11" fill="#12233a" font-weight="700">faults/</text>
  <text x="48" y="312.05" font-size="9.5" fill="#5b6b7b">The seven-program defect catalogue and</text>
  <text x="48" y="324.05" font-size="9.5" fill="#5b6b7b">its runner</text>
  <rect x="38" y="330" width="226" height="48" rx="6" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="48" y="350.05" font-size="11" fill="#12233a" font-weight="700">ffi/</text>
  <text x="48" y="364.05" font-size="9.5" fill="#5b6b7b">The C-ABI seam and its C++ host</text>
  <text x="48" y="376.05" font-size="9.5" fill="#5b6b7b">prototype</text>
  <rect x="306" y="78" width="250" height="312" rx="11" fill="#f4fbf6" stroke="#2e8b57" stroke-width="2.0"/>
  <rect x="306" y="78" width="250" height="34" rx="11" fill="#2e8b57"/>
  <rect x="306" y="101" width="250" height="11" fill="#2e8b57"/>
  <text x="431.0" y="100.0" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700">ONE COMMAND</text>
  <rect x="324" y="128" width="214" height="30" rx="6" fill="#d9f0dd"/>
  <text x="431.0" y="147.32" font-size="12" fill="#1f6b41" text-anchor="middle" font-weight="700">bench/refresh_thesis.sh</text>
  <text x="324" y="182" font-size="10.5" fill="#33475b">Reruns the analysis over the raw</text>
  <text x="324" y="196" font-size="10.5" fill="#33475b">logs and rebuilds the PDF, then</text>
  <text x="324" y="210" font-size="10.5" fill="#33475b">fails loudly if LaTeX reports an</text>
  <text x="324" y="224" font-size="10.5" fill="#33475b">error or an unresolved reference.</text>
  <line x1="430" y1="246" x2="430" y2="262" stroke="#2e8b57" stroke-width="2.0" marker-end="url(#a0)"/>
  <rect x="324" y="268" width="214" height="92" rx="6" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="336" y="290.325" font-size="11.5" fill="#12233a" font-weight="700">It calls</text>
  <text x="336" y="306.325" font-size="10" fill="#5b6b7b">plot_figures.py: figures,</text>
  <text x="336" y="319.825" font-size="10" fill="#5b6b7b">tables, and gen_macros.tex</text>
  <text x="336" y="333.325" font-size="10" fill="#5b6b7b">complexity.py: size and</text>
  <text x="336" y="346.825" font-size="10" fill="#5b6b7b">cyclomatic-complexity proxies</text>
  <rect x="580" y="78" width="280" height="312" rx="11" fill="#fdf6e9" stroke="#c8860d" stroke-width="2.0"/>
  <rect x="580" y="78" width="280" height="34" rx="11" fill="#a5700c"/>
  <rect x="580" y="101" width="280" height="11" fill="#a5700c"/>
  <text x="720.0" y="100.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">REGENERATED VERBATIM</text>
  <text x="598" y="130" font-size="10.5" fill="#33475b">Every figure, table, and quoted number</text>
  <text x="598" y="144" font-size="10.5" fill="#33475b">in the evaluation, straight from the logs.</text>
  <rect x="598" y="166" width="244" height="26" rx="5" fill="#ffffff" stroke="#c8860d" stroke-width="1.0"/>
  <text x="720.0" y="182.96" font-size="11" fill="#a5700c" text-anchor="middle">figures/*.pdf</text>
  <rect x="598" y="198" width="244" height="26" rx="5" fill="#ffffff" stroke="#c8860d" stroke-width="1.0"/>
  <text x="720.0" y="214.96" font-size="11" fill="#a5700c" text-anchor="middle">figures/tab_*.tex</text>
  <rect x="598" y="230" width="244" height="26" rx="5" fill="#ffffff" stroke="#c8860d" stroke-width="1.0"/>
  <text x="720.0" y="246.96" font-size="11" fill="#a5700c" text-anchor="middle">figures/gen_macros.tex</text>
  <text x="598" y="288" font-size="10.5" fill="#5b6b7b">The environment record (CPU model,</text>
  <text x="598" y="302" font-size="10.5" fill="#5b6b7b">kernel, and toolchain versions) is</text>
  <text x="598" y="316" font-size="10.5" fill="#5b6b7b">captured by capture_env.sh and stored</text>
  <text x="598" y="330" font-size="10.5" fill="#5b6b7b">with each result set, so the conditions of</text>
  <text x="598" y="344" font-size="10.5" fill="#5b6b7b">a measurement travel with its data.</text>
  <rect x="20" y="406" width="840" height="56" rx="8" fill="#fdf1f0" stroke="#a5281b" stroke-width="1.7"/>
  <text x="36" y="428" font-size="11.5" fill="#8c2a20" font-weight="700">Not required:</text>
  <text x="126" y="428" font-size="10.5" fill="#33475b">no proprietary source. The implementations are driven entirely by the public specification. The</text>
  <text x="36" y="447" font-size="10.5" fill="#33475b">service is a 3GPP-shaped model, not a reduced product module.</text>
  <text x="440.0" y="478" font-size="11.5" fill="#8794a3" text-anchor="middle">Separating environment-sensitive results from environment-insensitive ones is what lets the thesis</text>
  <text x="440.0" y="494" font-size="11.5" fill="#8794a3" text-anchor="middle">label the first preliminary and the second final without ambiguity.</text>
</svg>
