<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 524" width="880" height="524" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="524" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">What the thesis concludes, and what it leaves behind</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">The evidence divides by what is being measured before it divides by resource</text>
  <rect x="15" y="76" width="278" height="218" rx="10" fill="#f4fbf6" stroke="#2e8b57" stroke-width="1.8"/>
  <text x="30" y="101.325" font-size="11.5" fill="#1f6b41" font-weight="700">Safety: a difference in kind</text>
  <text x="30" y="122.325" font-size="10.5" fill="#5b6b7b">Safe Rust rejects all five injected</text>
  <text x="30" y="136.325" font-size="10.5" fill="#5b6b7b">memory-safety and data-race classes at</text>
  <text x="30" y="150.325" font-size="10.5" fill="#5b6b7b">compile time. The two boundary classes</text>
  <text x="30" y="164.325" font-size="10.5" fill="#5b6b7b">(a lock-order deadlock and a lost</text>
  <text x="30" y="178.325" font-size="10.5" fill="#5b6b7b">update) compile and misbehave</text>
  <text x="30" y="192.325" font-size="10.5" fill="#5b6b7b">exactly as they do in C++.</text>
  <text x="30" y="206.325" font-size="10.5" fill="#5b6b7b"></text>
  <text x="30" y="220.325" font-size="10.5" fill="#5b6b7b">Rust eliminates data races, not race</text>
  <text x="30" y="234.325" font-size="10.5" fill="#5b6b7b">conditions, and aliasing errors, not</text>
  <text x="30" y="248.325" font-size="10.5" fill="#5b6b7b">lock-ordering errors.</text>
  <rect x="301" y="76" width="278" height="218" rx="10" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.8"/>
  <text x="316" y="101.325" font-size="11.5" fill="#1c4e86" font-weight="700">Migration: the cost is human</text>
  <text x="316" y="122.325" font-size="10.5" fill="#5b6b7b">An unmodified Rust core can be driven</text>
  <text x="316" y="136.325" font-size="10.5" fill="#5b6b7b">from C++ across a thin seam that</text>
  <text x="316" y="150.325" font-size="10.5" fill="#5b6b7b">concentrates every unsafe site, for a</text>
  <text x="316" y="164.325" font-size="10.5" fill="#5b6b7b">cost on a real operation bounded at</text>
  <text x="316" y="178.325" font-size="10.5" fill="#5b6b7b">10.91% against the same operation</text>
  <text x="316" y="192.325" font-size="10.5" fill="#5b6b7b">called natively.</text>
  <text x="316" y="206.325" font-size="10.5" fill="#5b6b7b"></text>
  <text x="316" y="220.325" font-size="10.5" fill="#5b6b7b">What migration costs is API design and</text>
  <text x="316" y="234.325" font-size="10.5" fill="#5b6b7b">the learning curve, not run time.</text>
  <rect x="587" y="76" width="278" height="218" rx="10" fill="#fdf6e9" stroke="#c8860d" stroke-width="1.8"/>
  <text x="602" y="101.325" font-size="11.5" fill="#a5700c" font-weight="700">Performance: two different answers</text>
  <text x="602" y="122.325" font-size="10.5" fill="#5b6b7b">End to end, an operation is 0.250% the</text>
  <text x="602" y="136.325" font-size="10.5" fill="#5b6b7b">work the language performs and the rest</text>
  <text x="602" y="150.325" font-size="10.5" fill="#5b6b7b">a cross-thread handoff. The two are</text>
  <text x="602" y="164.325" font-size="10.5" fill="#5b6b7b">equivalent at the median and</text>
  <text x="602" y="178.325" font-size="10.5" fill="#5b6b7b">unresolvable at the tail.</text>
  <text x="602" y="192.325" font-size="10.5" fill="#5b6b7b"></text>
  <text x="602" y="206.325" font-size="10.5" fill="#5b6b7b">Measured on the operation alone they</text>
  <text x="602" y="220.325" font-size="10.5" fill="#5b6b7b">are not equivalent: Rust is faster by</text>
  <text x="602" y="234.325" font-size="10.5" fill="#5b6b7b">about a factor of two, for reasons</text>
  <text x="602" y="248.325" font-size="10.5" fill="#5b6b7b">tracing to hash-map layout.</text>
  <rect x="15" y="308" width="850" height="74" rx="9" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.6"/>
  <text x="31" y="330" font-size="12.5" fill="#12233a" font-weight="700">What this adds to the decision is an instrument, not a verdict</text>
  <rect x="31" y="344" width="156.2" height="26" rx="5" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="109.1" y="360.78" font-size="10.5" fill="#33475b" text-anchor="middle">A frozen specification</text>
  <rect x="197.2" y="344" width="144.0" height="26" rx="5" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="269.2" y="360.78" font-size="10.5" fill="#33475b" text-anchor="middle">A parity-tested pair</text>
  <rect x="351.2" y="344" width="168.39999999999998" height="26" rx="5" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="435.4" y="360.78" font-size="10.5" fill="#33475b" text-anchor="middle">A reproducible framework</text>
  <rect x="529.5999999999999" y="344" width="266.0" height="26" rx="5" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="662.5999999999999" y="360.78" font-size="10.5" fill="#33475b" text-anchor="middle">A catalogue of what the guarantee misses</text>
  <rect x="15" y="396" width="850" height="78" rx="9" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.7"/>
  <text x="31" y="418" font-size="12.5" fill="#1c4e86" font-weight="700">Where it goes next</text>
  <text x="206" y="418" font-size="10.5" fill="#33475b">the bare-metal campaign first. What bare metal now buys is the tail and the overload cliff, not the repeat count.</text>
  <rect x="31" y="434" width="122.0" height="24" rx="5" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="92.0" y="449.6" font-size="10" fill="#1c4e86" text-anchor="middle">Production traces</text>
  <rect x="162.0" y="434" width="128.0" height="24" rx="5" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="226.0" y="449.6" font-size="10" fill="#1c4e86" text-anchor="middle">Further subsystems</text>
  <rect x="299.0" y="434" width="122.0" height="24" rx="5" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="360.0" y="449.6" font-size="10" fill="#1c4e86" text-anchor="middle">Hardware counters</text>
  <rect x="430.0" y="434" width="140.0" height="24" rx="5" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="500.0" y="449.6" font-size="10" fill="#1c4e86" text-anchor="middle">Extend the catalogue</text>
  <rect x="579.0" y="434" width="104.0" height="24" rx="5" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="631.0" y="449.6" font-size="10" fill="#1c4e86" text-anchor="middle">Async runtimes</text>
  <rect x="692.0" y="434" width="122.0" height="24" rx="5" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="753.0" y="449.6" font-size="10" fill="#1c4e86" text-anchor="middle">Isolate the heaps</text>
  <text x="440.0" y="502" font-size="11.5" fill="#8794a3" text-anchor="middle">For stateful, concurrent, partitionable control-plane services of this kind, the choice between modern C++ and Rust is not a performance decision.</text>
</svg>
