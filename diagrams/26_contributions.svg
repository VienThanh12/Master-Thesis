<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 524" width="880" height="524" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="524" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">What the thesis concludes, and what it leaves behind</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">The evidence divides by what is being measured before it divides by resource</text>
  <rect x="15" y="76" width="278" height="218" rx="10" fill="#f4fbf6" stroke="#2e8b57" stroke-width="1.8"/>
  <text x="30" y="101.325" font-size="11.5" fill="#1f6b41" font-weight="700">Safety: a difference in kind</text>
  <text x="30" y="122.325" font-size="10.5" fill="#5b6b7b">Safe Rust rejects all 7 injected</text>
  <text x="30" y="136.325" font-size="10.5" fill="#5b6b7b">memory-safety and data-race classes at</text>
  <text x="30" y="150.325" font-size="10.5" fill="#5b6b7b">compile time. The 7 boundary</text>
  <text x="30" y="164.325" font-size="10.5" fill="#5b6b7b">classes, from a deadlock to a forgotten</text>
  <text x="30" y="178.325" font-size="10.5" fill="#5b6b7b">lock guard, compile and misbehave</text>
  <text x="30" y="192.325" font-size="10.5" fill="#5b6b7b">exactly as they do in C++.</text>
  <text x="30" y="206.325" font-size="10.5" fill="#5b6b7b"></text>
  <text x="30" y="220.325" font-size="10.5" fill="#5b6b7b">Rust eliminates data races, not race</text>
  <text x="30" y="234.325" font-size="10.5" fill="#5b6b7b">conditions, and aliasing errors, not</text>
  <text x="30" y="248.325" font-size="10.5" fill="#5b6b7b">lock-ordering errors.</text>
  <rect x="301" y="76" width="278" height="218" rx="10" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.8"/>
  <text x="316" y="101.325" font-size="11.5" fill="#1c4e86" font-weight="700">Migration: the call tax is bounded</text>
  <text x="316" y="122.325" font-size="10.5" fill="#5b6b7b">An unmodified Rust core can be driven</text>
  <text x="316" y="136.325" font-size="10.5" fill="#5b6b7b">from C++ across a thin seam that</text>
  <text x="316" y="150.325" font-size="10.5" fill="#5b6b7b">holds every unsafe site. Any call</text>
  <text x="316" y="164.325" font-size="10.5" fill="#5b6b7b">tax is bounded at 10.91%.</text>
  <text x="316" y="178.325" font-size="10.5" fill="#5b6b7b"></text>
  <text x="316" y="192.325" font-size="10.5" fill="#5b6b7b">API design and training time</text>
  <text x="316" y="206.325" font-size="10.5" fill="#5b6b7b">were not measured.</text>
  <rect x="587" y="76" width="278" height="218" rx="10" fill="#fdf6e9" stroke="#c8860d" stroke-width="1.8"/>
  <text x="602" y="101.325" font-size="11.5" fill="#a5700c" font-weight="700">Performance: The order splits</text>
  <text x="602" y="122.325" font-size="10.5" fill="#5b6b7b">Below saturation Rust leads.</text>
  <text x="602" y="136.325" font-size="10.5" fill="#5b6b7b">Median gap at most 1.5 µs.</text>
  <text x="602" y="150.325" font-size="10.5" fill="#5b6b7b">The p99.9 gap is larger.</text>
  <text x="602" y="164.325" font-size="10.5" fill="#5b6b7b">The far tail is larger still.</text>
  <text x="602" y="178.325" font-size="10.5" fill="#5b6b7b">A late wake-up sits in each.</text>
  <text x="602" y="192.325" font-size="10.5" fill="#5b6b7b"></text>
  <text x="602" y="206.325" font-size="10.5" fill="#5b6b7b">The core, timed apart, is</text>
  <text x="602" y="220.325" font-size="10.5" fill="#5b6b7b">1.6× faster in Rust.</text>
  <text x="602" y="234.325" font-size="10.5" fill="#5b6b7b">Past saturation, the order</text>
  <text x="602" y="248.325" font-size="10.5" fill="#5b6b7b">follows what the timer includes.</text>
  <rect x="15" y="308" width="850" height="74" rx="9" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.6"/>
  <text x="31" y="330" font-size="12.5" fill="#12233a" font-weight="700">What this adds to the decision is an instrument, not a verdict</text>
  <rect x="31" y="344" width="156.2" height="26" rx="5" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="109.1" y="360.78" font-size="10.5" fill="#33475b" text-anchor="middle">A frozen specification</text>
  <rect x="197.2" y="344" width="144.0" height="26" rx="5" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="269.2" y="360.78" font-size="10.5" fill="#33475b" text-anchor="middle">A parity-tested pair</text>
  <rect x="351.2" y="344" width="119.6" height="26" rx="5" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="411.0" y="360.78" font-size="10.5" fill="#33475b" text-anchor="middle">A timing harness</text>
  <rect x="480.79999999999995" y="344" width="266.0" height="26" rx="5" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="613.8" y="360.78" font-size="10.5" fill="#33475b" text-anchor="middle">A catalogue of what the guarantee misses</text>
  <rect x="15" y="396" width="850" height="78" rx="9" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.7"/>
  <text x="31" y="418" font-size="12.5" fill="#1c4e86" font-weight="700">Where it goes next</text>
  <text x="206" y="418" font-size="10.5" fill="#33475b">large pages, production traces, async versus threads, two allocators, and review effort.</text>
  <rect x="31" y="434" width="86.0" height="24" rx="5" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="74.0" y="449.6" font-size="10" fill="#1c4e86" text-anchor="middle">Large pages</text>
  <rect x="126.0" y="434" width="122.0" height="24" rx="5" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="187.0" y="449.6" font-size="10" fill="#1c4e86" text-anchor="middle">Production traces</text>
  <rect x="257.0" y="434" width="140.0" height="24" rx="5" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="327.0" y="449.6" font-size="10" fill="#1c4e86" text-anchor="middle">Async versus threads</text>
  <rect x="406.0" y="434" width="104.0" height="24" rx="5" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="458.0" y="449.6" font-size="10" fill="#1c4e86" text-anchor="middle">Two allocators</text>
  <rect x="519.0" y="434" width="98.0" height="24" rx="5" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="568.0" y="449.6" font-size="10" fill="#1c4e86" text-anchor="middle">Review effort</text>
  <text x="440.0" y="502" font-size="11.5" fill="#8794a3" text-anchor="middle">Where the service still meets the sent rate, the choice is which defects to make impossible to write.</text>
</svg>
