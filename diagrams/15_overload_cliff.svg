<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker>
  </defs>
  <rect x="0" y="0" width="860" height="500" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#12233a">The overload cliff: why the sweep is pushed past saturation</text>
  <text x="430" y="56" text-anchor="middle" font-size="13" fill="#5b6b7b">The operationally decisive behaviour is the onset and shape of the cliff, not the latency at nominal load</text>

  <!-- region shading -->
  <rect x="80" y="90" width="400" height="340" fill="#eef8f1"/>
  <rect x="480" y="90" width="120" height="340" fill="#fdf6e9"/>
  <rect x="600" y="90" width="200" height="340" fill="#fdf1f0"/>

  <!-- axes -->
  <line x1="80" y1="430" x2="810" y2="430" stroke="#33475b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="80" y1="430" x2="80" y2="80" stroke="#33475b" stroke-width="2" marker-end="url(#a)"/>
  <text x="445" y="466" text-anchor="middle" font-size="13" font-weight="600" fill="#33475b">offered load (kops/s)  &#8594;</text>
  <text x="46" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#33475b" transform="rotate(-90 46 255)">p99 latency (log scale)  &#8594;</text>

  <!-- curve -->
  <path d="M90 372 L 300 368 L 470 358 C 540 348 578 315 620 250 C 655 195 700 150 780 112"
        fill="none" stroke="#2f6db3" stroke-width="3"/>

  <!-- region labels -->
  <text x="280" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6b41">nominal load</text>
  <text x="280" y="138" text-anchor="middle" font-size="10.5" fill="#2e8b57">flat, low tail</text>
  <text x="540" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a5700c">knee</text>
  <text x="540" y="138" text-anchor="middle" font-size="10.5" fill="#a5700c">saturation</text>
  <text x="700" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#a5281b">overload</text>
  <text x="700" y="138" text-anchor="middle" font-size="10.5" fill="#a5281b">tail explodes</text>

  <!-- markers -->
  <line x1="300" y1="368" x2="300" y2="430" stroke="#2e8b57" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="300" cy="368" r="4" fill="#2e8b57"/>
  <text x="300" y="448" text-anchor="middle" font-size="10.5" fill="#1f6b41">reported operating point</text>

  <line x1="490" y1="90" x2="490" y2="430" stroke="#d99413" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="490" y="448" text-anchor="middle" font-size="10.5" fill="#a5700c">measured saturation</text>

  <!-- annotation, placed clear of the curve with a leader to the knee -->
  <path d="M395 240 L 480 318" fill="none" stroke="#c3ccd5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="105" y="182" width="290" height="86" rx="9" fill="#ffffff" stroke="#d7dde3"/>
  <text x="120" y="204" font-size="11.5" font-weight="700" fill="#12233a">Near capacity:</text>
  <text x="120" y="224" font-size="11" fill="#4a5b6b">queueing delay grows super-linearly,</text>
  <text x="120" y="242" font-size="11" fill="#4a5b6b">bounded blocking queues make overload</text>
  <text x="120" y="260" font-size="11" fill="#4a5b6b">observable as tail latency (not silent drops).</text>

  <text x="430" y="490" text-anchor="middle" font-size="11" fill="#8794a3">Schematic, not measured data. Whether the two languages differ in the onset or the shape of this cliff is the open question of RQ1.</text>
</svg>
