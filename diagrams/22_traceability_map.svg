<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 504" width="880" height="504" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs><marker id="a0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#bcd0e8"/></marker></defs>
  <rect x="0" y="0" width="880" height="504" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">From research question to verdict, grouped by hypothesis</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">Grouping by hypothesis rather than by question number exposes two things a row-per-question table can only note in passing</text>
  <text x="86.0" y="90" font-size="10.5" fill="#8794a3" text-anchor="middle" font-weight="700">QUESTION</text>
  <text x="276.0" y="90" font-size="10.5" fill="#8794a3" text-anchor="middle" font-weight="700">OBJECTIVE</text>
  <text x="472.0" y="90" font-size="10.5" fill="#8794a3" text-anchor="middle" font-weight="700">HYPOTHESIS</text>
  <text x="705.0" y="90" font-size="10.5" fill="#8794a3" text-anchor="middle" font-weight="700">EVIDENCE</text>
  <rect x="22" y="102" width="128" height="64" rx="7" fill="#dce8f7"/>
  <text x="86.0" y="139.4" font-size="15" fill="#1c4e86" text-anchor="middle" font-weight="700">RQ1</text>
  <rect x="158" y="102" width="236" height="64" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="169" y="121.2" font-size="10.5" fill="#33475b">O1 Quantify the latency</text>
  <text x="169" y="134.7" font-size="10.5" fill="#33475b">distributions to overload, and</text>
  <text x="169" y="148.2" font-size="10.5" fill="#33475b">locate any divergence</text>
  <rect x="550" y="102" width="310" height="64" rx="7" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="561" y="121.2" font-size="10.5" fill="#33475b">§7.5.1 and §7.5.2 — equivalent at the median,</text>
  <text x="561" y="134.7" font-size="10.5" fill="#33475b">unresolvable at the tail</text>
  <line x1="396" y1="134" x2="404" y2="134" stroke="#bcd0e8" stroke-width="1.5" marker-end="url(#a0)"/>
  <line x1="540" y1="134" x2="548" y2="134" stroke="#bcd0e8" stroke-width="1.5" marker-end="url(#a0)"/>
  <rect x="22" y="178" width="128" height="64" rx="7" fill="#dce8f7"/>
  <text x="86.0" y="215.4" font-size="15" fill="#1c4e86" text-anchor="middle" font-weight="700">RQ3</text>
  <rect x="158" y="178" width="236" height="64" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="169" y="197.2" font-size="10.5" fill="#33475b">O3 Measure the resource cost of</text>
  <text x="169" y="210.7" font-size="10.5" fill="#33475b">the safety model under matched</text>
  <text x="169" y="224.2" font-size="10.5" fill="#33475b">conditions</text>
  <rect x="550" y="178" width="310" height="64" rx="7" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="561" y="197.2" font-size="10.5" fill="#33475b">§7.5.4 — peak RSS reproduces, CPU does not</text>
  <line x1="396" y1="210" x2="404" y2="210" stroke="#bcd0e8" stroke-width="1.5" marker-end="url(#a0)"/>
  <line x1="540" y1="210" x2="548" y2="210" stroke="#bcd0e8" stroke-width="1.5" marker-end="url(#a0)"/>
  <rect x="22" y="254" width="128" height="64" rx="7" fill="#dce8f7"/>
  <text x="86.0" y="291.4" font-size="15" fill="#1c4e86" text-anchor="middle" font-weight="700">RQ2</text>
  <rect x="158" y="254" width="236" height="64" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="169" y="273.2" font-size="10.5" fill="#33475b">O2 Determine which defect</text>
  <text x="169" y="286.7" font-size="10.5" fill="#33475b">classes are prevented at compile</text>
  <text x="169" y="300.2" font-size="10.5" fill="#33475b">time, and when the rest are</text>
  <text x="169" y="313.7" font-size="10.5" fill="#33475b">caught</text>
  <rect x="550" y="254" width="310" height="64" rx="7" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="561" y="273.2" font-size="10.5" fill="#33475b">§7.5.5 — five prevented, two compile and</text>
  <text x="561" y="286.7" font-size="10.5" fill="#33475b">misbehave</text>
  <line x1="396" y1="286" x2="404" y2="286" stroke="#bcd0e8" stroke-width="1.5" marker-end="url(#a0)"/>
  <line x1="540" y1="286" x2="548" y2="286" stroke="#bcd0e8" stroke-width="1.5" marker-end="url(#a0)"/>
  <rect x="22" y="330" width="128" height="64" rx="7" fill="#dce8f7"/>
  <text x="86.0" y="367.4" font-size="15" fill="#1c4e86" text-anchor="middle" font-weight="700">RQ4</text>
  <rect x="158" y="330" width="236" height="64" rx="7" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="169" y="349.2" font-size="10.5" fill="#33475b">O4 Build and measure an</text>
  <text x="169" y="362.7" font-size="10.5" fill="#33475b">incremental-adoption prototype</text>
  <text x="169" y="376.2" font-size="10.5" fill="#33475b">at the language boundary</text>
  <rect x="550" y="330" width="310" height="64" rx="7" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="561" y="349.2" font-size="10.5" fill="#33475b">§7.5.6 — bounded at 1.37% of the operation</text>
  <line x1="396" y1="362" x2="404" y2="362" stroke="#bcd0e8" stroke-width="1.5" marker-end="url(#a0)"/>
  <line x1="540" y1="362" x2="548" y2="362" stroke="#bcd0e8" stroke-width="1.5" marker-end="url(#a0)"/>
  <rect x="406" y="102" width="132" height="140" rx="8" fill="#fdecc8" stroke="#c8860d" stroke-width="1.6"/>
  <text x="418" y="125.7" font-size="14" fill="#a5700c" font-weight="700">H1</text>
  <text x="418" y="145.7" font-size="10.5" fill="#33475b">Performance-</text>
  <text x="418" y="159.2" font-size="10.5" fill="#33475b">equivalent below</text>
  <text x="418" y="172.7" font-size="10.5" fill="#33475b">saturation, with</text>
  <text x="418" y="186.2" font-size="10.5" fill="#33475b">any difference</text>
  <text x="418" y="199.7" font-size="10.5" fill="#33475b">confined to the</text>
  <text x="418" y="213.2" font-size="10.5" fill="#33475b">far tail.</text>
  <rect x="406" y="254" width="132" height="64" rx="8" fill="#d9f0dd" stroke="#a8d7bb" stroke-width="1.6"/>
  <text x="417" y="276.15" font-size="13" fill="#1f6b41" font-weight="700">H2</text>
  <text x="417" y="293.15" font-size="10" fill="#33475b">Safe Rust prevents</text>
  <text x="417" y="305.65" font-size="10" fill="#33475b">what C++ leaves</text>
  <text x="417" y="318.15" font-size="10" fill="#33475b">to testing.</text>
  <rect x="406" y="330" width="132" height="64" rx="8" fill="#dce8f7" stroke="#bcd0e8" stroke-width="1.6"/>
  <text x="417" y="352.15" font-size="13" fill="#1c4e86" font-weight="700">H3</text>
  <text x="417" y="369.15" font-size="10" fill="#33475b">Interop cost is</text>
  <text x="417" y="381.65" font-size="10" fill="#33475b">negligible against</text>
  <text x="417" y="394.15" font-size="10" fill="#33475b">the work invoked.</text>
  <rect x="22" y="410" width="838" height="46" rx="8" fill="#f4fbf6" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="38" y="432" font-size="12" fill="#1f6b41" font-weight="700">O5  Artifacts and guidance</text>
  <text x="220" y="432" font-size="11" fill="#33475b">cross-cutting: discharged by the published artifacts and the guidelines, not by any single question.</text>
  <text x="440.0" y="474" font-size="11.5" fill="#8794a3" text-anchor="middle">H1 does double duty for RQ1 and RQ3, so a single wording had to cover equivalence in both its latency and its resource sense</text>
  <text x="440.0" y="490" font-size="11.5" fill="#8794a3" text-anchor="middle">— Chapter 8 finds that to be its main weakness.</text>
</svg>
