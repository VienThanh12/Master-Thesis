<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#33475b"/>
    </marker>
    <marker id="arrowb" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 z" fill="#33475b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="420" fill="#ffffff"/>
  <text x="470" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#12233a">Where UE Context Management sits in the 5G NG-RAN</text>
  <text x="470" y="62" text-anchor="middle" font-size="14" fill="#5b6b7b">The gNB is disaggregated into DU / CU, and the CU is split into control- and user-plane functions</text>

  <!-- UE -->
  <rect x="40" y="180" width="120" height="70" rx="10" fill="#eef1f4" stroke="#6b7b8c" stroke-width="1.8"/>
  <text x="100" y="212" text-anchor="middle" font-size="17" font-weight="600" fill="#243447">UE</text>
  <text x="100" y="232" text-anchor="middle" font-size="11.5" fill="#5b6b7b">device</text>

  <!-- gNB-DU -->
  <rect x="220" y="180" width="120" height="70" rx="10" fill="#eef1f4" stroke="#6b7b8c" stroke-width="1.8"/>
  <text x="280" y="212" text-anchor="middle" font-size="16" font-weight="600" fill="#243447">gNB-DU</text>
  <text x="280" y="232" text-anchor="middle" font-size="11.5" fill="#5b6b7b">lower layers</text>

  <!-- gNB-CU outer -->
  <rect x="400" y="110" width="330" height="230" rx="14" fill="#f7f9fb" stroke="#8794a3" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="565" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#33475b">gNB-CU (central unit)</text>

  <!-- CP -->
  <rect x="424" y="150" width="282" height="105" rx="11" fill="#dce8f7" stroke="#2f6db3" stroke-width="2"/>
  <text x="565" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#1c4e86">gNB-CU-CP  (control plane)</text>
  <!-- UECM highlighted inside CP -->
  <rect x="440" y="185" width="250" height="56" rx="9" fill="#f6d4d0" stroke="#c0392b" stroke-width="2.4"/>
  <text x="565" y="208" text-anchor="middle" font-size="14.5" font-weight="700" fill="#a5281b">UE Context Management</text>
  <text x="565" y="228" text-anchor="middle" font-size="10.5" fill="#8a3227">per-UE state, RRC &amp; mobility  (this thesis)</text>

  <!-- UP -->
  <rect x="424" y="272" width="282" height="52" rx="11" fill="#d9f0dd" stroke="#2e8b57" stroke-width="2"/>
  <text x="565" y="303" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6b41">gNB-CU-UP  (user plane)</text>

  <!-- 5GC -->
  <rect x="790" y="180" width="120" height="70" rx="10" fill="#eef1f4" stroke="#6b7b8c" stroke-width="1.8"/>
  <text x="850" y="212" text-anchor="middle" font-size="16" font-weight="600" fill="#243447">5GC</text>
  <text x="850" y="232" text-anchor="middle" font-size="11.5" fill="#5b6b7b">5G core</text>

  <!-- interfaces -->
  <line x1="160" y1="215" x2="220" y2="215" stroke="#33475b" stroke-width="2" marker-start="url(#arrowb)" marker-end="url(#arrow)"/>
  <text x="190" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#33475b">Uu</text>

  <line x1="340" y1="215" x2="400" y2="215" stroke="#33475b" stroke-width="2" marker-start="url(#arrowb)" marker-end="url(#arrow)"/>
  <text x="370" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#33475b">F1</text>

  <line x1="730" y1="215" x2="790" y2="215" stroke="#33475b" stroke-width="2" marker-start="url(#arrowb)" marker-end="url(#arrow)"/>
  <text x="760" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#33475b">NG</text>

  <!-- E1 between CP and UP: leaves the CP box below the F1 line at y=215, so the
       two interfaces do not cross each other on the way out of the CU -->
  <line x1="380" y1="246" x2="380" y2="298" stroke="#33475b" stroke-width="2" marker-start="url(#arrowb)" marker-end="url(#arrow)"/>
  <text x="366" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#33475b">E1</text>
  <line x1="424" y1="246" x2="380" y2="246" stroke="#33475b" stroke-width="1.4"/>
  <line x1="424" y1="298" x2="380" y2="298" stroke="#33475b" stroke-width="1.4"/>

  <text x="470" y="404" text-anchor="middle" font-size="12" fill="#8794a3">Interfaces per 3GPP TS 38.401 / 38.300. O-RAN standardises them for multi-vendor software deployment.</text>
</svg>
