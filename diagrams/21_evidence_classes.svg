<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 568" width="880" height="568" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="568" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">Which conclusions the measurement host can carry</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">A result is final if it is a property of the compilers and the source, and preliminary if it is a property of the machine</text>
  <rect x="20" y="76" width="400" height="300" rx="11" fill="#f4fbf6" stroke="#2e8b57" stroke-width="2.0"/>
  <rect x="20" y="76" width="400" height="34" rx="11" fill="#2e8b57"/>
  <rect x="20" y="99" width="400" height="11" fill="#2e8b57"/>
  <text x="220.0" y="98.0" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700">FINAL</text>
  <text x="220" y="130" font-size="12.5" fill="#1f6b41" text-anchor="middle">Unchanged by the host it was measured on</text>
  <rect x="38" y="144" width="364" height="48" rx="7" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.5"/>
  <text x="52" y="168.6" font-size="12" fill="#12233a" font-weight="700">Transcript parity</text>
  <text x="52" y="185.6" font-size="10.5" fill="#5b6b7b">A conformance suite diffed line by line, not asserted.</text>
  <rect x="38" y="200" width="364" height="48" rx="7" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.5"/>
  <text x="52" y="224.6" font-size="12" fill="#12233a" font-weight="700">Defect catalogue (RQ2)</text>
  <text x="52" y="241.6" font-size="10.5" fill="#5b6b7b">Whether a program compiles is a fact about the compiler.</text>
  <rect x="38" y="256" width="364" height="48" rx="7" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.5"/>
  <text x="52" y="280.6" font-size="12" fill="#12233a" font-weight="700">Seam structure (RQ4)</text>
  <text x="52" y="297.6" font-size="10.5" fill="#5b6b7b">Entry points, unsafe sites, and lines: read off the code.</text>
  <rect x="38" y="312" width="364" height="48" rx="7" fill="#ffffff" stroke="#a8d7bb" stroke-width="1.5"/>
  <text x="52" y="336.6" font-size="12" fill="#12233a" font-weight="700">Size and complexity proxies</text>
  <text x="52" y="353.6" font-size="10.5" fill="#5b6b7b">Counted from the code rather than from a run.</text>
  <rect x="460" y="76" width="400" height="300" rx="11" fill="#fdf6e9" stroke="#c8860d" stroke-width="2.0"/>
  <rect x="460" y="76" width="400" height="34" rx="11" fill="#a5700c"/>
  <rect x="460" y="99" width="400" height="11" fill="#a5700c"/>
  <text x="660.0" y="98.0" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700">PRELIMINARY</text>
  <text x="660" y="130" font-size="12.5" fill="#a5700c" text-anchor="middle">Carries a contribution from the hypervisor</text>
  <rect x="478" y="144" width="364" height="48" rx="7" fill="#ffffff" stroke="#c8860d" stroke-width="1.5"/>
  <text x="492" y="168.6" font-size="12" fill="#12233a" font-weight="700">Tail latency, p99 and p99.9 (RQ1)</text>
  <text x="492" y="185.6" font-size="10.5" fill="#5b6b7b">Computed from exactly the operations a stall disturbs.</text>
  <rect x="478" y="200" width="364" height="48" rx="7" fill="#ffffff" stroke="#c8860d" stroke-width="1.5"/>
  <text x="492" y="224.6" font-size="12" fill="#12233a" font-weight="700">Onset of the overload cliff</text>
  <text x="492" y="241.6" font-size="10.5" fill="#5b6b7b">Where saturation begins depends on the scheduler.</text>
  <rect x="478" y="256" width="364" height="48" rx="7" fill="#ffffff" stroke="#c8860d" stroke-width="1.5"/>
  <text x="492" y="280.6" font-size="12" fill="#12233a" font-weight="700">CPU utilisation (RQ3)</text>
  <text x="492" y="297.6" font-size="10.5" fill="#5b6b7b">Reverses sign between allocators, reported as unresolved.</text>
  <rect x="478" y="312" width="364" height="48" rx="7" fill="#ffffff" stroke="#c8860d" stroke-width="1.5"/>
  <text x="492" y="336.6" font-size="12" fill="#12233a" font-weight="700">Peak resident set size (RQ3)</text>
  <text x="492" y="353.6" font-size="10.5" fill="#5b6b7b">A run-level statistic, so pairing rescues it.</text>
  <line x1="440" y1="68" x2="440" y2="392" stroke="#12233a" stroke-width="2.5" stroke-dasharray="9 5"/>
  <rect x="20" y="404" width="840" height="104" rx="9" fill="#eef3fa" stroke="#2f6db3" stroke-width="1.8"/>
  <text x="36" y="427" font-size="12.5" fill="#1c4e86" font-weight="700">What the bare-metal protocol buys, and only this</text>
  <rect x="36" y="440" width="177.60000000000002" height="26" rx="5" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="124.80000000000001" y="456.96" font-size="11" fill="#1c4e86" text-anchor="middle">Isolated cores (taskset)</text>
  <rect x="225.60000000000002" y="440" width="152.0" height="26" rx="5" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="301.6" y="456.96" font-size="11" fill="#1c4e86" text-anchor="middle">performance governor</text>
  <rect x="389.6" y="440" width="164.8" height="26" rx="5" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="472.0" y="456.96" font-size="11" fill="#1c4e86" text-anchor="middle">Turbo and SMT disabled</text>
  <rect x="566.4000000000001" y="440" width="132.8" height="26" rx="5" fill="#ffffff" stroke="#bcd0e8" stroke-width="1.0"/>
  <text x="632.8000000000001" y="456.96" font-size="11" fill="#1c4e86" text-anchor="middle">Hardware counters</text>
  <text x="36" y="484" font-size="11" fill="#33475b">bench/TESTBED.md is scripted and published, and the analysis pipeline does not change: executing the protocol and</text>
  <text x="36" y="500" font-size="11" fill="#33475b">rerunning the same scripts is the only step between the two columns.</text>
  <text x="440.0" y="540" font-size="11.5" fill="#8794a3" text-anchor="middle">Every row on which the two columns agree is a property of the source code. Every row on which they differ is a property of the machine.</text>
</svg>
