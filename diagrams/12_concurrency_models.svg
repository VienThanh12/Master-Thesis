<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="500" fill="#ffffff"/>
  <text x="470" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#12233a">Two concurrency models for control-plane state</text>

  <!-- LEFT: shared memory -->
  <rect x="30" y="64" width="420" height="400" rx="12" fill="#fffafa" stroke="#e0b4af" stroke-width="1.6"/>
  <text x="240" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#a5281b">Shared-memory concurrency</text>
  <text x="240" y="112" text-anchor="middle" font-size="11.5" fill="#8a3227">threads mutate common state behind locks</text>

  <rect x="60" y="140" width="90" height="42" rx="7" fill="#dce8f7" stroke="#2f6db3"/><text x="105" y="166" text-anchor="middle" font-size="12" fill="#1c4e86">Thread 1</text>
  <rect x="195" y="140" width="90" height="42" rx="7" fill="#dce8f7" stroke="#2f6db3"/><text x="240" y="166" text-anchor="middle" font-size="12" fill="#1c4e86">Thread 2</text>
  <rect x="330" y="140" width="90" height="42" rx="7" fill="#dce8f7" stroke="#2f6db3"/><text x="375" y="166" text-anchor="middle" font-size="12" fill="#1c4e86">Thread 3</text>

  <!-- lock + shared state -->
  <rect x="150" y="270" width="180" height="74" rx="9" fill="#f8d7d5" stroke="#c0392b" stroke-width="2"/>
  <text x="240" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#a5281b">shared mutable state</text>
  <text x="240" y="320" text-anchor="middle" font-size="11" fill="#8a3227">guarded by mutex / atomics</text>
  <!-- lock icon -->
  <rect x="228" y="248" width="24" height="18" rx="3" fill="#c0392b"/>
  <path d="M232 248 v-5 a8 8 0 0 1 16 0 v5" fill="none" stroke="#c0392b" stroke-width="2.4"/>

  <line x1="105" y1="182" x2="200" y2="268" stroke="#c0392b" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="240" y1="182" x2="240" y2="268" stroke="#c0392b" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="375" y1="182" x2="280" y2="268" stroke="#c0392b" stroke-width="1.8" marker-end="url(#ar)"/>

  <g font-size="11.5" fill="#a5281b">
    <text x="240" y="378" text-anchor="middle" font-weight="700">Hazards:</text>
    <text x="240" y="398" text-anchor="middle">data races &#183; deadlock &#183; lock contention</text>
    <text x="240" y="416" text-anchor="middle">priority inversion &#183; hard-to-reason worst case</text>
    <text x="240" y="442" text-anchor="middle" font-style="italic" fill="#8a3227">worst-case timing is hard to bound</text>
  </g>

  <!-- RIGHT: shared nothing -->
  <rect x="490" y="64" width="420" height="400" rx="12" fill="#f8fdfa" stroke="#a9d9bd" stroke-width="1.6"/>
  <text x="700" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6b41">Shared-nothing (message-passing)</text>
  <text x="700" y="112" text-anchor="middle" font-size="11.5" fill="#2e8b57">state partitioned; each piece owned by one thread</text>

  <!-- three lanes -->
  <g>
    <rect x="520" y="150" width="86" height="40" rx="7" fill="#dce8f7" stroke="#2f6db3"/><text x="563" y="175" text-anchor="middle" font-size="11.5" fill="#1c4e86">Worker 1</text>
    <path d="M525 214 a30 7 0 0 0 60 0 v34 a30 7 0 0 1 -60 0 z" fill="#d9f0dd" stroke="#2e8b57"/><ellipse cx="555" cy="214" rx="30" ry="7" fill="#d9f0dd" stroke="#2e8b57"/>
    <text x="555" y="238" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6b41">shard 1</text>
    <line x1="563" y1="190" x2="555" y2="206" stroke="#2e8b57" stroke-width="1.8" marker-end="url(#ag)"/>
  </g>
  <g>
    <rect x="657" y="150" width="86" height="40" rx="7" fill="#dce8f7" stroke="#2f6db3"/><text x="700" y="175" text-anchor="middle" font-size="11.5" fill="#1c4e86">Worker 2</text>
    <path d="M662 214 a30 7 0 0 0 60 0 v34 a30 7 0 0 1 -60 0 z" fill="#d9f0dd" stroke="#2e8b57"/><ellipse cx="692" cy="214" rx="30" ry="7" fill="#d9f0dd" stroke="#2e8b57"/>
    <text x="692" y="238" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6b41">shard 2</text>
    <line x1="700" y1="190" x2="692" y2="206" stroke="#2e8b57" stroke-width="1.8" marker-end="url(#ag)"/>
  </g>
  <g>
    <rect x="794" y="150" width="86" height="40" rx="7" fill="#dce8f7" stroke="#2f6db3"/><text x="837" y="175" text-anchor="middle" font-size="11.5" fill="#1c4e86">Worker N</text>
    <path d="M799 214 a30 7 0 0 0 60 0 v34 a30 7 0 0 1 -60 0 z" fill="#d9f0dd" stroke="#2e8b57"/><ellipse cx="829" cy="214" rx="30" ry="7" fill="#d9f0dd" stroke="#2e8b57"/>
    <text x="829" y="238" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6b41">shard N</text>
    <line x1="837" y1="190" x2="829" y2="206" stroke="#2e8b57" stroke-width="1.8" marker-end="url(#ag)"/>
  </g>

  <!-- messages -->
  <rect x="545" y="290" width="310" height="34" rx="7" fill="#eceff1" stroke="#6b7b8c"/>
  <text x="700" y="312" text-anchor="middle" font-size="11.5" fill="#33475b">interaction only via messages (bounded queues)</text>
  <line x1="700" y1="290" x2="700" y2="250" stroke="#33475b" stroke-width="1.4" marker-end="url(#a)"/>

  <g font-size="11.5" fill="#1f6b41">
    <text x="700" y="360" text-anchor="middle" font-weight="700">Benefits:</text>
    <text x="700" y="380" text-anchor="middle">no shared mutable state &#183; no locks on data</text>
    <text x="700" y="398" text-anchor="middle">simpler reasoning &#183; scales &#183; bounded worst case</text>
  </g>
  <rect x="507" y="420" width="386" height="30" rx="15" fill="#d9f0dd" stroke="#2e8b57" stroke-width="1.8"/>
  <text x="700" y="440" text-anchor="middle" font-size="11" font-weight="700" fill="#1f6b41">chosen for BOTH implementations (maps to per-UE state)</text>
</svg>
