<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 762" width="880" height="762" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="762" fill="#ffffff"/>
  <text x="440.0" y="32" font-size="22" fill="#12233a" text-anchor="middle" font-weight="700">Threats to validity, and what each control leaves behind</text>
  <text x="440.0" y="54" font-size="12.5" fill="#5b6b7b" text-anchor="middle">Shaded by what remains after the control rather than by how the threat was described</text>
  <text x="276" y="92" font-size="10" fill="#8794a3" text-anchor="middle" font-weight="700">THREAT</text>
  <text x="488" y="92" font-size="10" fill="#8794a3" text-anchor="middle" font-weight="700">CONTROL APPLIED</text>
  <text x="732" y="92" font-size="10" fill="#8794a3" text-anchor="middle" font-weight="700">WHAT REMAINS</text>
  <rect x="20" y="100" width="152" height="74.0" rx="7" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.4"/>
  <text x="33" y="123.325" font-size="11.5" fill="#2f6db3" font-weight="700">INTERNAL</text>
  <text x="33" y="140.325" font-size="9.8" fill="#5b6b7b">Is the language really</text>
  <text x="33" y="152.325" font-size="9.8" fill="#5b6b7b">the only difference?</text>
  <rect x="180" y="103" width="192" height="66.0" rx="6" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="190" y="121.0" font-size="10" fill="#12233a">Implementation bias between</text>
  <text x="190" y="133.5" font-size="10" fill="#12233a">the two versions</text>
  <rect x="378" y="103" width="226" height="66.0" rx="6" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="388" y="120.92" font-size="9.8" fill="#33475b">Frozen specification, shared</text>
  <text x="388" y="133.42000000000002" font-size="9.8" fill="#33475b">allocator and optimisation level,</text>
  <text x="388" y="145.92000000000002" font-size="9.8" fill="#33475b">pinned hash functions, forced-idiom</text>
  <text x="388" y="158.42000000000002" font-size="9.8" fill="#33475b">log, transcript parity</text>
  <rect x="610" y="103" width="250" height="66.0" rx="6" fill="#fbdedb" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="620" y="120.92" font-size="9.8" fill="#8c2a20">Single-author skill asymmetry. Parity</text>
  <text x="620" y="133.42000000000002" font-size="9.8" fill="#8c2a20">bounds behaviour, not performance</text>
  <rect x="20" y="183.0" width="152" height="212.0" rx="7" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.4"/>
  <text x="33" y="206.325" font-size="11.5" fill="#a04000" font-weight="700">CONSTRUCT</text>
  <text x="33" y="223.325" font-size="9.8" fill="#5b6b7b">Do the metrics measure</text>
  <text x="33" y="235.325" font-size="9.8" fill="#5b6b7b">what the questions ask?</text>
  <rect x="180" y="186.0" width="192" height="41.0" rx="6" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="190" y="204.0" font-size="10" fill="#12233a">The sweep measures the design,</text>
  <text x="190" y="216.5" font-size="10" fill="#12233a">not the language</text>
  <rect x="378" y="186.0" width="226" height="41.0" rx="6" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="388" y="203.92" font-size="9.8" fill="#33475b">The operation is measured apart from</text>
  <text x="388" y="216.42" font-size="9.8" fill="#33475b">the handoff and both are reported</text>
  <rect x="610" y="186.0" width="250" height="41.0" rx="6" fill="#fdecc8" stroke="#c8860d" stroke-width="1.0"/>
  <text x="620" y="203.92" font-size="9.8" fill="#a5700c">One operation on one data structure is</text>
  <text x="620" y="216.42" font-size="9.8" fill="#a5700c">narrower than the sweep it supplements</text>
  <rect x="180" y="232.0" width="192" height="53.5" rx="6" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="190" y="250.0" font-size="10" fill="#12233a">A defect catalogue is a sample</text>
  <text x="190" y="262.5" font-size="10" fill="#12233a">the author chose</text>
  <rect x="378" y="232.0" width="226" height="53.5" rx="6" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="388" y="249.92" font-size="9.8" fill="#33475b">Two classes drawn from outside the</text>
  <text x="388" y="262.41999999999996" font-size="9.8" fill="#33475b">guarantee, with expectations recorded</text>
  <text x="388" y="274.91999999999996" font-size="9.8" fill="#33475b">in advance</text>
  <rect x="610" y="232.0" width="250" height="53.5" rx="6" fill="#fdecc8" stroke="#c8860d" stroke-width="1.0"/>
  <text x="620" y="249.92" font-size="9.8" fill="#a5700c">Seven programs remain seven programs</text>
  <rect x="180" y="290.5" width="192" height="41.0" rx="6" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="190" y="308.5" font-size="10" fill="#12233a">RQ3 captures resource cost but</text>
  <text x="190" y="321.0" font-size="10" fill="#12233a">not its origin</text>
  <rect x="378" y="290.5" width="226" height="41.0" rx="6" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="388" y="308.42" font-size="9.8" fill="#33475b">None available on this host</text>
  <rect x="610" y="290.5" width="250" height="41.0" rx="6" fill="#fbdedb" stroke="#e6b3ad" stroke-width="1.0"/>
  <text x="620" y="308.42" font-size="9.8" fill="#8c2a20">The memory result is established but</text>
  <text x="620" y="320.92" font-size="9.8" fill="#8c2a20">unexplained</text>
  <rect x="180" y="336.5" width="192" height="53.5" rx="6" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="190" y="354.5" font-size="10" fill="#12233a">RQ4 measures the seam, not the</text>
  <text x="190" y="367.0" font-size="10" fill="#12233a">safety of the whole</text>
  <rect x="378" y="336.5" width="226" height="53.5" rx="6" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="388" y="354.42" font-size="9.8" fill="#33475b">The distinction is restated wherever</text>
  <text x="388" y="366.92" font-size="9.8" fill="#33475b">the result is quoted</text>
  <rect x="610" y="336.5" width="250" height="53.5" rx="6" fill="#fdecc8" stroke="#c8860d" stroke-width="1.0"/>
  <text x="620" y="354.42" font-size="9.8" fill="#a5700c">One address space: a compile-time</text>
  <text x="620" y="366.92" font-size="9.8" fill="#a5700c">property of the Rust side bounds nothing</text>
  <text x="620" y="379.42" font-size="9.8" fill="#a5700c">at run time</text>
  <rect x="20" y="404.0" width="152" height="132.5" rx="7" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.4"/>
  <text x="33" y="427.325" font-size="11.5" fill="#2e8b57" font-weight="700">CONCLUSION</text>
  <text x="33" y="444.325" font-size="9.8" fill="#5b6b7b">Are the differences</text>
  <text x="33" y="456.325" font-size="9.8" fill="#5b6b7b">real, or noise?</text>
  <rect x="180" y="407.0" width="192" height="66.0" rx="6" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="190" y="425.0" font-size="10" fill="#12233a">Run-to-run non-determinism</text>
  <rect x="378" y="407.0" width="226" height="66.0" rx="6" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="388" y="424.92" font-size="9.8" fill="#33475b">20 interleaved repeats, bootstrap</text>
  <text x="388" y="437.42" font-size="9.8" fill="#33475b">intervals, an exact paired</text>
  <text x="388" y="449.92" font-size="9.8" fill="#33475b">permutation test, Holm correction,</text>
  <text x="388" y="462.42" font-size="9.8" fill="#33475b">floors quoted</text>
  <rect x="610" y="407.0" width="250" height="66.0" rx="6" fill="#fdecc8" stroke="#c8860d" stroke-width="1.0"/>
  <text x="620" y="424.92" font-size="9.8" fill="#a5700c">Pairing cancels only what a block</text>
  <text x="620" y="437.42" font-size="9.8" fill="#a5700c">shared, so the tail percentiles stay</text>
  <text x="620" y="449.92" font-size="9.8" fill="#a5700c">unresolved</text>
  <rect x="180" y="478.0" width="192" height="53.5" rx="6" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="190" y="496.0" font-size="10" fill="#12233a">A corrected p-value that does</text>
  <text x="190" y="508.5" font-size="10" fill="#12233a">not replicate</text>
  <rect x="378" y="478.0" width="226" height="53.5" rx="6" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="388" y="495.92" font-size="9.8" fill="#33475b">The allocator control runs every</text>
  <text x="388" y="508.42" font-size="9.8" fill="#33475b">comparison twice, and replication is</text>
  <text x="388" y="520.9200000000001" font-size="9.8" fill="#33475b">followed over the p-value</text>
  <rect x="610" y="478.0" width="250" height="53.5" rx="6" fill="#d9f0dd" stroke="#a8d7bb" stroke-width="1.0"/>
  <text x="620" y="495.92" font-size="9.8" fill="#1f6b41">Costs a result where the two disagree:</text>
  <text x="620" y="508.42" font-size="9.8" fill="#1f6b41">the CPU effect is reported as unresolved</text>
  <rect x="20" y="545.5" width="152" height="61.5" rx="7" fill="#f1f4f7" stroke="#d7dde3" stroke-width="1.4"/>
  <text x="33" y="568.825" font-size="11.5" fill="#a5700c" font-weight="700">EXTERNAL</text>
  <text x="33" y="585.825" font-size="9.8" fill="#5b6b7b">How far do the results</text>
  <text x="33" y="597.825" font-size="9.8" fill="#5b6b7b">travel?</text>
  <rect x="180" y="548.5" width="192" height="53.5" rx="6" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="190" y="566.5" font-size="10" fill="#12233a">One subsystem, one workload,</text>
  <text x="190" y="579.0" font-size="10" fill="#12233a">one machine</text>
  <rect x="378" y="548.5" width="226" height="53.5" rx="6" fill="#ffffff" stroke="#d7dde3" stroke-width="1.0"/>
  <text x="388" y="566.42" font-size="9.8" fill="#33475b">RQ2 and RQ4 rest on the compilers and</text>
  <text x="388" y="578.92" font-size="9.8" fill="#33475b">the C ABI rather than on the host</text>
  <rect x="610" y="548.5" width="250" height="53.5" rx="6" fill="#fdecc8" stroke="#c8860d" stroke-width="1.0"/>
  <text x="620" y="566.42" font-size="9.8" fill="#a5700c">The performance results do not travel:</text>
  <text x="620" y="578.92" font-size="9.8" fill="#a5700c">shared mutable state or allocation churn</text>
  <text x="620" y="591.42" font-size="9.8" fill="#a5700c">could behave differently</text>
  <rect x="20" y="620.0" width="840" height="64" rx="8" fill="#fdf1f0" stroke="#a5281b" stroke-width="1.7"/>
  <text x="36" y="642.0" font-size="12" fill="#8c2a20" font-weight="700">Two of these are load-bearing</text>
  <text x="36" y="661.0" font-size="10.5" fill="#33475b">The study cannot rule out single-author skill asymmetry, and its end-to-end instrument answers the question a vendor sizing a node</text>
  <text x="36" y="676.0" font-size="10.5" fill="#33475b">would ask rather than the one a language comparison asks.</text>
  <text x="440.0" y="716.0" font-size="11.5" fill="#8794a3" text-anchor="middle">Only the last column is a live risk. The middle column is what has already been done about each.</text>
  <text x="440.0" y="732.0" font-size="11.5" fill="#8794a3" text-anchor="middle">Two rows carry no mitigation at all, and are recorded as such.</text>
</svg>
