<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="560" fill="#ffffff"/>
  <text x="470" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#12233a">Request lifecycle &amp; completion handoff (one operation)</text>
  <text x="470" y="56" text-anchor="middle" font-size="13" fill="#5b6b7b">Latency is measured end-to-end, from intended send time to completion, so it includes queueing delay under load</text>

  <!-- lifelines -->
  <rect x="60" y="76" width="150" height="40" rx="8" fill="#dce8f7" stroke="#2f6db3" stroke-width="1.9"/>
  <text x="135" y="101" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1c4e86">Caller (producer)</text>
  <line x1="135" y1="116" x2="135" y2="500" stroke="#9fb0c0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="320" y="76" width="150" height="40" rx="8" fill="#eceff1" stroke="#6b7b8c" stroke-width="1.9"/>
  <text x="395" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#33475b">Shard queue</text>
  <line x1="395" y1="116" x2="395" y2="500" stroke="#9fb0c0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="560" y="76" width="150" height="40" rx="8" fill="#fbe0cb" stroke="#d35400" stroke-width="1.9"/>
  <text x="635" y="101" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a04000">Worker thread</text>
  <line x1="635" y1="116" x2="635" y2="500" stroke="#9fb0c0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="795" y="76" width="120" height="40" rx="8" fill="#d9f0dd" stroke="#2e8b57" stroke-width="1.9"/>
  <text x="855" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6b41">ShardCore</text>
  <line x1="855" y1="116" x2="855" y2="500" stroke="#9fb0c0" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- worker activation bar -->
  <rect x="628" y="270" width="14" height="150" fill="#fbe0cb" stroke="#d35400" stroke-width="1.3"/>

  <!-- messages -->
  <path d="M135 150 h70 v22 h-70" fill="none" stroke="#33475b" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="215" y="146" font-size="11.5" fill="#33475b">1. build Request + fresh completion channel (rtx, rrx)</text>

  <path d="M135 200 h70 v22 h-70" fill="none" stroke="#33475b" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="215" y="196" font-size="11.5" fill="#33475b">2. shard = shard_index(ue_id)</text>

  <line x1="135" y1="248" x2="389" y2="248" stroke="#33475b" stroke-width="2" marker-end="url(#a)"/>
  <text x="150" y="240" font-size="11.5" fill="#33475b">3. send(Request): blocks if queue full (backpressure)</text>

  <line x1="395" y1="280" x2="629" y2="280" stroke="#33475b" stroke-width="2" marker-end="url(#a)"/>
  <text x="410" y="272" font-size="11.5" fill="#33475b">4. rx.recv(): FIFO dequeue</text>

  <rect x="72" y="262" width="126" height="34" rx="6" fill="#fff6f5" stroke="#e0b4af"/>
  <text x="135" y="283" text-anchor="middle" font-size="10.5" fill="#a5281b">blocked on rrx.recv()</text>

  <line x1="642" y1="312" x2="849" y2="312" stroke="#33475b" stroke-width="2" marker-end="url(#a)"/>
  <text x="648" y="304" font-size="11.5" fill="#33475b">5. core.op(ue_id, ...)</text>

  <path d="M855 336 h50 v20 h-50" fill="none" stroke="#33475b" stroke-width="1.7" marker-end="url(#a)"/>
  <text x="840" y="332" text-anchor="end" font-size="11" fill="#1f6b41">6. mutate map + stamp</text>
  <text x="840" y="348" text-anchor="end" font-size="11" fill="#1f6b41">last_activity_seq (atomic)</text>

  <line x1="849" y1="388" x2="644" y2="388" stroke="#2e8b57" stroke-width="2" marker-end="url(#ag)"/>
  <text x="742" y="380" text-anchor="middle" font-size="11.5" fill="#1f6b41">7. OpResult&lt;T&gt;</text>

  <line x1="628" y1="430" x2="139" y2="430" stroke="#2e8b57" stroke-width="2.2" marker-end="url(#ag)"/>
  <text x="380" y="422" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f6b41">8. resp.send(OpResult) &#8594; caller's rrx.recv() returns</text>

  <!-- ownership note -->
  <rect x="60" y="470" width="855" height="66" rx="9" fill="#fbfcfd" stroke="#d7dde3"/>
  <text x="76" y="492" font-size="11.5" fill="#4a5b6b"><tspan font-weight="700" fill="#a04000">Ownership transfer:</tspan> the Request (and any heap data it carries) is moved to the worker on submit and is never shared.</text>
  <text x="76" y="512" font-size="11.5" fill="#4a5b6b">That upholds the shared-nothing invariant end to end. Requests to the same shard are processed strictly FIFO (O1).</text>
  <text x="76" y="530" font-size="11" fill="#7a8a99">Source: rust/src/service.rs (create_context ... worker_loop) and cpp equivalent (std::promise / std::future).</text>
</svg>
