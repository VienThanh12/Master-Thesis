<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8794a3"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#12233a">Research design: from question to evidence</text>
  <text x="490" y="56" text-anchor="middle" font-size="13" fill="#5b6b7b">Each research question is tied to a concrete method, artifact, and the metric its conclusion rests on</text>

  <!-- column headers -->
  <text x="118" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99">Research question</text>
  <text x="360" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99">Method</text>
  <text x="610" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99">Artifact / data</text>
  <text x="855" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99">Primary metric</text>

  <!-- Row template helper: y centers 150, 250, 350, 450 -->
  <!-- RQ1 -->
  <g>
    <rect x="40" y="116" width="156" height="72" rx="9" fill="#dce8f7" stroke="#2f6db3" stroke-width="2"/>
    <text x="118" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#1c4e86">RQ1</text>
    <text x="118" y="166" text-anchor="middle" font-size="10.5" fill="#33475b">tail-latency</text>
    <text x="118" y="180" text-anchor="middle" font-size="10.5" fill="#33475b">predictability</text>
    <rect x="240" y="116" width="240" height="72" rx="9" fill="#f3f6fb" stroke="#9fb0c0" stroke-width="1.6"/>
    <text x="360" y="148" text-anchor="middle" font-size="11.5" fill="#33475b">load sweep to overload,</text>
    <text x="360" y="166" text-anchor="middle" font-size="11.5" fill="#33475b">interleaved repeats</text>
    <rect x="500" y="116" width="220" height="72" rx="9" fill="#f3f6fb" stroke="#9fb0c0" stroke-width="1.6"/>
    <text x="610" y="148" text-anchor="middle" font-size="11.5" fill="#33475b">benchmark harness,</text>
    <text x="610" y="166" text-anchor="middle" font-size="11.5" fill="#33475b">HDR latency histograms</text>
    <rect x="740" y="116" width="200" height="72" rx="9" fill="#fff3ec" stroke="#e0975a" stroke-width="1.8"/>
    <text x="840" y="148" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a04000">p99 / p99.9 tail</text>
    <text x="840" y="166" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a04000">&amp; jitter vs load</text>
  </g>
  <!-- RQ3 -->
  <g>
    <rect x="40" y="204" width="156" height="72" rx="9" fill="#dce8f7" stroke="#2f6db3" stroke-width="2"/>
    <text x="118" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#1c4e86">RQ3</text>
    <text x="118" y="256" text-anchor="middle" font-size="10.5" fill="#33475b">safety-model</text>
    <text x="118" y="270" text-anchor="middle" font-size="10.5" fill="#33475b">overhead</text>
    <rect x="240" y="204" width="240" height="72" rx="9" fill="#f3f6fb" stroke="#9fb0c0" stroke-width="1.6"/>
    <text x="360" y="244" text-anchor="middle" font-size="11.5" fill="#33475b">same sweep,</text>
    <text x="360" y="262" text-anchor="middle" font-size="11.5" fill="#33475b">resource capture</text>
    <rect x="500" y="204" width="220" height="72" rx="9" fill="#f3f6fb" stroke="#9fb0c0" stroke-width="1.6"/>
    <text x="610" y="244" text-anchor="middle" font-size="11.5" fill="#33475b">getrusage samples</text>
    <text x="610" y="262" text-anchor="middle" font-size="11.5" fill="#33475b">per run</text>
    <rect x="740" y="204" width="200" height="72" rx="9" fill="#fff3ec" stroke="#e0975a" stroke-width="1.8"/>
    <text x="840" y="244" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a04000">peak RSS, CPU,</text>
    <text x="840" y="262" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a04000">throughput</text>
  </g>
  <!-- RQ2 -->
  <g>
    <rect x="40" y="292" width="156" height="72" rx="9" fill="#dce8f7" stroke="#2f6db3" stroke-width="2"/>
    <text x="118" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#1c4e86">RQ2</text>
    <text x="118" y="344" text-anchor="middle" font-size="10.5" fill="#33475b">defect</text>
    <text x="118" y="358" text-anchor="middle" font-size="10.5" fill="#33475b">prevention</text>
    <rect x="240" y="292" width="240" height="72" rx="9" fill="#f3f6fb" stroke="#9fb0c0" stroke-width="1.6"/>
    <text x="360" y="332" text-anchor="middle" font-size="11.5" fill="#33475b">controlled</text>
    <text x="360" y="350" text-anchor="middle" font-size="11.5" fill="#33475b">fault injection</text>
    <rect x="500" y="292" width="220" height="72" rx="9" fill="#f3f6fb" stroke="#9fb0c0" stroke-width="1.6"/>
    <text x="610" y="332" text-anchor="middle" font-size="11.5" fill="#33475b">defect catalogue,</text>
    <text x="610" y="350" text-anchor="middle" font-size="11.5" fill="#33475b">ASan/TSan + rustc logs</text>
    <rect x="740" y="292" width="200" height="72" rx="9" fill="#fff3ec" stroke="#e0975a" stroke-width="1.8"/>
    <text x="840" y="332" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a04000">defect-class taxonomy</text>
    <text x="840" y="350" text-anchor="middle" font-size="10.5" fill="#a04000">compile / runtime / missed</text>
  </g>
  <!-- RQ4 -->
  <g>
    <rect x="40" y="380" width="156" height="72" rx="9" fill="#dce8f7" stroke="#2f6db3" stroke-width="2"/>
    <text x="118" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#1c4e86">RQ4</text>
    <text x="118" y="432" text-anchor="middle" font-size="10.5" fill="#33475b">migration</text>
    <text x="118" y="446" text-anchor="middle" font-size="10.5" fill="#33475b">cost</text>
    <rect x="240" y="380" width="240" height="72" rx="9" fill="#f3f6fb" stroke="#9fb0c0" stroke-width="1.6"/>
    <text x="360" y="420" text-anchor="middle" font-size="11.5" fill="#33475b">FFI migration</text>
    <text x="360" y="438" text-anchor="middle" font-size="11.5" fill="#33475b">prototype</text>
    <rect x="500" y="380" width="220" height="72" rx="9" fill="#f3f6fb" stroke="#9fb0c0" stroke-width="1.6"/>
    <text x="610" y="420" text-anchor="middle" font-size="11.5" fill="#33475b">C++ host +</text>
    <text x="610" y="438" text-anchor="middle" font-size="11.5" fill="#33475b">Rust C-ABI seam</text>
    <rect x="740" y="380" width="200" height="72" rx="9" fill="#fff3ec" stroke="#e0975a" stroke-width="1.8"/>
    <text x="840" y="420" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a04000">seam size, unsafe</text>
    <text x="840" y="438" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a04000">scope, per-call cost</text>
  </g>

  <!-- flow arrows for each row -->
  <g stroke="#8794a3" stroke-width="1.8">
    <line x1="196" y1="152" x2="238" y2="152" marker-end="url(#a)"/><line x1="480" y1="152" x2="498" y2="152" marker-end="url(#a)"/><line x1="720" y1="152" x2="738" y2="152" marker-end="url(#a)"/>
    <line x1="196" y1="240" x2="238" y2="240" marker-end="url(#a)"/><line x1="480" y1="240" x2="498" y2="240" marker-end="url(#a)"/><line x1="720" y1="240" x2="738" y2="240" marker-end="url(#a)"/>
    <line x1="196" y1="328" x2="238" y2="328" marker-end="url(#a)"/><line x1="480" y1="328" x2="498" y2="328" marker-end="url(#a)"/><line x1="720" y1="328" x2="738" y2="328" marker-end="url(#a)"/>
    <line x1="196" y1="416" x2="238" y2="416" marker-end="url(#a)"/><line x1="480" y1="416" x2="498" y2="416" marker-end="url(#a)"/><line x1="720" y1="416" x2="738" y2="416" marker-end="url(#a)"/>
  </g>

  <!-- evidence status band -->
  <rect x="40" y="478" width="900" height="60" rx="9" fill="#fbfcfd" stroke="#d7dde3"/>
  <rect x="58" y="496" width="16" height="14" fill="#d9f0dd" stroke="#2e8b57"/>
  <text x="82" y="508" font-size="11.5" fill="#4a5b6b">RQ2 &amp; RQ4: <tspan font-weight="700" fill="#1f6b41">final</tspan> (environment-insensitive)</text>
  <rect x="420" y="496" width="16" height="14" fill="#fdecc8" stroke="#d99413"/>
  <text x="444" y="508" font-size="11.5" fill="#4a5b6b">RQ1 &amp; RQ3: <tspan font-weight="700" fill="#a5700c">preliminary</tspan> (await bare-metal testbed)</text>
  <text x="58" y="530" font-size="11" fill="#8794a3">All four answered from one matched pair of C++/Rust implementations built from a single frozen specification.</text>
</svg>
