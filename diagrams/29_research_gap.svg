  <text x="36" y="449" font-size="12.5" fill="#1c4e86" font-weight="700">The gap</text>
  <text x="104" y="449" font-size="10.5" fill="#33475b">in both RAN theses the language varies together with the runtime, the concurrency model, and the implementation, so a measured</text>
  <text x="36" y="468" font-size="10.5" fill="#33475b">difference cannot be attributed to the language rather than to the framework built on it. Holding those fixed is what this study adds.</text>
