  <text x="28" y="652" font-size="20" fill="#1c4e86" font-weight="700">The gap</text>
  <text x="136" y="652" font-size="18" fill="#33475b">most of the telecom studies change two things at once:</text>
  <text x="136" y="674" font-size="18" fill="#33475b">the language, and how the program is run.</text>
  <text x="136" y="696" font-size="18" fill="#33475b">Emberg and Wadsten keep the design the same,</text>
  <text x="136" y="718" font-size="18" fill="#33475b">but they still test a stateless program.</text>
  <text x="136" y="740" font-size="18" fill="#33475b">None holds the concurrency model fixed</text>
  <text x="136" y="762" font-size="18" fill="#33475b">and then drives a stateful subsystem past saturation.</text>
