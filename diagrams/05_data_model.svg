<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker>
    <marker id="diamond" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto"><path d="M0,6 L8,1 L16,6 L8,11 z" fill="#ffffff" stroke="#33475b"/></marker>
  </defs>
  <rect x="0" y="0" width="920" height="540" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#12233a">UE context data model (spec &#167;4)</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#5b6b7b">Fixed field widths so memory footprint and copy cost are comparable across C++ and Rust</text>

  <!-- UeContext -->
  <g font-size="12.5">
    <rect x="60" y="90" width="290" height="286" rx="7" fill="#ffffff" stroke="#2f6db3" stroke-width="2"/>
    <rect x="60" y="90" width="290" height="34" rx="7" fill="#dce8f7" stroke="#2f6db3" stroke-width="2"/>
    <text x="205" y="113" text-anchor="middle" font-size="15" font-weight="700" fill="#1c4e86">UeContext</text>
    <line x1="60" y1="124" x2="350" y2="124" stroke="#2f6db3" stroke-width="1.2"/>
    <text x="74" y="146" fill="#243447"><tspan font-weight="700">ue_id</tspan>: u64  <tspan fill="#8794a3">- key, immutable</tspan></text>
    <text x="74" y="170" fill="#243447"><tspan font-weight="700">state</tspan>: UeState (u8)</text>
    <text x="74" y="194" fill="#243447">serving_cell_id: u32</text>
    <text x="74" y="218" fill="#243447">rrc_transaction_id: u16</text>
    <text x="74" y="242" fill="#243447">security_key: [u8; 32]  <tspan fill="#8794a3">- dummy keys</tspan></text>
    <text x="74" y="266" fill="#a04000" font-weight="700">drbs: Vec&lt;DrbEntry&gt;  <tspan fill="#8a4b16" font-weight="400">- 0..=8, dynamic</tspan></text>
    <text x="74" y="290" fill="#243447">messages_handled: u64</text>
    <text x="74" y="314" fill="#243447">last_activity_seq: u64  <tspan fill="#8794a3">- atomic</tspan></text>
    <line x1="60" y1="330" x2="350" y2="330" stroke="#cbd4dd" stroke-width="1"/>
    <text x="74" y="352" fill="#5b6b7b" font-style="italic" font-size="11.5">dynamic Vec chosen to exercise the</text>
    <text x="74" y="368" fill="#5b6b7b" font-style="italic" font-size="11.5">allocator (RQ3) - not a fixed array</text>
  </g>

  <!-- DrbEntry -->
  <g font-size="12.5">
    <rect x="560" y="100" width="230" height="118" rx="7" fill="#ffffff" stroke="#d35400" stroke-width="2"/>
    <rect x="560" y="100" width="230" height="32" rx="7" fill="#fbe0cb" stroke="#d35400" stroke-width="2"/>
    <text x="675" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#a04000">DrbEntry</text>
    <line x1="560" y1="132" x2="790" y2="132" stroke="#d35400" stroke-width="1.1"/>
    <text x="574" y="154" fill="#243447">drb_id: u8  <tspan fill="#8794a3">- unique per ctx</tspan></text>
    <text x="574" y="178" fill="#243447">qos_flow_id: u8</text>
    <text x="574" y="202" fill="#243447">teid: u32</text>
  </g>
  <line x1="350" y1="260" x2="558" y2="176" stroke="#33475b" stroke-width="1.8" marker-start="url(#diamond)" marker-end="url(#a)"/>
  <text x="452" y="206" text-anchor="middle" font-size="11" fill="#33475b">0..=MAX_DRBS (8)</text>

  <!-- UeContextView -->
  <g font-size="12.5">
    <rect x="560" y="262" width="300" height="140" rx="7" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
    <rect x="560" y="262" width="300" height="32" rx="7" fill="#d9f0dd" stroke="#2e8b57" stroke-width="2"/>
    <text x="710" y="284" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f6b41">UeContextView  (read-only)</text>
    <line x1="560" y1="294" x2="860" y2="294" stroke="#2e8b57" stroke-width="1.1"/>
    <text x="574" y="316" fill="#243447">by-value snapshot of all fields</text>
    <text x="574" y="338" fill="#243447">drbs copied by value (&#167;4.4)</text>
    <text x="574" y="362" fill="#5b6b7b" font-style="italic" font-size="11.5">lookup() returns this - never an</text>
    <text x="574" y="378" fill="#5b6b7b" font-style="italic" font-size="11.5">alias into live shard state</text>
  </g>
  <path d="M300 376 C 300 470, 640 470, 640 404" fill="none" stroke="#2e8b57" stroke-width="1.9" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="470" y="486" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f6b41">lookup(ue_id) &#8594; copies out an immutable UeContextView (preserves shared-nothing)</text>

  <text x="205" y="420" text-anchor="middle" font-size="11" fill="#8794a3">Source: rust/src/types.rs &#183; cpp/include/uecm/types.hpp</text>
  <text x="60" y="524" font-size="11" fill="#8794a3">CreateParams { serving_cell_id, security_key[32] }  &#183;  SignalingMsg { kind, payload_len, payload[64] }  &#8594;  SignalingAck { accepted, new_messages_handled }</text>
</svg>
