<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#12233a">UE context data model (spec &#167;4)</text>
  <text x="490" y="57" text-anchor="middle" font-size="13" fill="#5b6b7b">Fixed field widths so memory footprint and copy cost are comparable across C++ and Rust</text>

  <!-- UeContext -->
  <g font-size="12.5">
    <rect x="60" y="92" width="350" height="290" rx="7" fill="#ffffff" stroke="#2f6db3" stroke-width="2"/>
    <rect x="60" y="92" width="350" height="34" rx="7" fill="#dce8f7" stroke="#2f6db3" stroke-width="2"/>
    <text x="235" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#1c4e86">UeContext</text>
    <line x1="60" y1="126" x2="410" y2="126" stroke="#2f6db3" stroke-width="1.2"/>
    <text x="76" y="150" fill="#243447"><tspan font-weight="700">ue_id</tspan>: u64 <tspan fill="#8794a3">- key, immutable</tspan></text>
    <text x="76" y="174" fill="#243447"><tspan font-weight="700">state</tspan>: UeState (u8)</text>
    <text x="76" y="198" fill="#243447">serving_cell_id: u32</text>
    <text x="76" y="222" fill="#243447">rrc_transaction_id: u16</text>
    <text x="76" y="246" fill="#243447">security_key: [u8; 32] <tspan fill="#8794a3">- dummy keys</tspan></text>
    <text x="76" y="270" fill="#a04000" font-weight="700">drbs: Vec&lt;DrbEntry&gt; <tspan fill="#8a4b16" font-weight="400">- 0..=8, dynamic</tspan></text>
    <text x="76" y="294" fill="#243447">messages_handled: u64</text>
    <text x="76" y="318" fill="#243447">last_activity_seq: u64 <tspan fill="#8794a3">- atomic</tspan></text>
    <line x1="60" y1="334" x2="410" y2="334" stroke="#cbd4dd" stroke-width="1"/>
    <text x="76" y="356" fill="#5b6b7b" font-style="italic" font-size="11.5">dynamic Vec chosen to exercise the</text>
    <text x="76" y="372" fill="#5b6b7b" font-style="italic" font-size="11.5">allocator (RQ3) - not a fixed array</text>
  </g>

  <!-- DrbEntry -->
  <g font-size="12.5">
    <rect x="620" y="92" width="300" height="122" rx="7" fill="#ffffff" stroke="#d35400" stroke-width="2"/>
    <rect x="620" y="92" width="300" height="32" rx="7" fill="#fbe0cb" stroke="#d35400" stroke-width="2"/>
    <text x="770" y="114" text-anchor="middle" font-size="14.5" font-weight="700" fill="#a04000">DrbEntry</text>
    <line x1="620" y1="124" x2="920" y2="124" stroke="#d35400" stroke-width="1.1"/>
    <text x="636" y="148" fill="#243447">drb_id: u8 <tspan fill="#8794a3">- unique per ctx</tspan></text>
    <text x="636" y="172" fill="#243447">qos_flow_id: u8</text>
    <text x="636" y="196" fill="#243447">teid: u32</text>
  </g>

  <!-- composition: UeContext owns its DrbEntry list (routed clear of both boxes) -->
  <polygon points="410,270 419,265 428,270 419,275" fill="#ffffff" stroke="#33475b" stroke-width="1.6"/>
  <path d="M428 270 L535 270 Q545 270 545 260 L545 196 Q545 186 555 186 L613 186"
        fill="none" stroke="#33475b" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="481" y="260" text-anchor="middle" font-size="11" fill="#33475b">0..=MAX_DRBS (8)</text>

  <!-- UeContextView -->
  <g font-size="12.5">
    <rect x="620" y="270" width="300" height="145" rx="7" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
    <rect x="620" y="270" width="300" height="32" rx="7" fill="#d9f0dd" stroke="#2e8b57" stroke-width="2"/>
    <text x="770" y="292" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f6b41">UeContextView (read-only)</text>
    <line x1="620" y1="302" x2="920" y2="302" stroke="#2e8b57" stroke-width="1.1"/>
    <text x="636" y="326" fill="#243447">by-value snapshot of all fields</text>
    <text x="636" y="350" fill="#243447">drbs copied by value (&#167;4.4)</text>
    <text x="636" y="376" fill="#5b6b7b" font-style="italic" font-size="11.5">lookup() returns this - never an</text>
    <text x="636" y="392" fill="#5b6b7b" font-style="italic" font-size="11.5">alias into live shard state</text>
  </g>

  <!-- lookup: copy out of the shard, routed below both boxes -->
  <path d="M380 382 L380 462 Q380 472 390 472 L690 472 Q700 472 700 462 L700 419"
        fill="none" stroke="#2e8b57" stroke-width="1.9" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="490" y="500" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f6b41">lookup(ue_id) &#8594; copies out an immutable UeContextView (preserves shared-nothing)</text>

  <text x="60" y="404" font-size="10.5" fill="#8794a3">Source: rust/src/types.rs &#183; cpp/include/uecm/types.hpp</text>
  <text x="490" y="534" text-anchor="middle" font-size="10" fill="#8794a3">CreateParams { serving_cell_id, security_key[32] } &#183; SignalingMsg { kind, payload_len, payload[64] } &#8594; SignalingAck { accepted, new_messages_handled }</text>
</svg>
